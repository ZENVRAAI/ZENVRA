/* ============================================================
   PRE-ANALYSIS SCAFFOLD (deterministic)
   ============================================================ */
function computeScaffold(klines, currentPrice, realHTF){
  const highs = klines.map(function(k){ return parseFloat(k[2]); });
  const lows = klines.map(function(k){ return parseFloat(k[3]); });
  const closes = klines.map(function(k){ return parseFloat(k[4]); });

  const recentHigh = Math.max.apply(null, highs.slice(-50));
  const recentLow = Math.min.apply(null, lows.slice(-50));

  const swingHighs = [], swingLows = [];
  for (let i=2;i<klines.length-2;i++){
    if (highs[i]>highs[i-1] && highs[i]>highs[i-2] && highs[i]>highs[i+1] && highs[i]>highs[i+2]) swingHighs.push({idx:i, price:highs[i]});
    if (lows[i]<lows[i-1] && lows[i]<lows[i-2] && lows[i]<lows[i+1] && lows[i]<lows[i+2]) swingLows.push({idx:i, price:lows[i]});
  }
  const lastSwingHigh = swingHighs.length ? swingHighs[swingHighs.length-1].price : recentHigh;
  const lastSwingLow = swingLows.length ? swingLows[swingLows.length-1].price : recentLow;
  const prevSwingHigh = swingHighs.length>1 ? swingHighs[swingHighs.length-2].price : recentHigh;
  const prevSwingLow = swingLows.length>1 ? swingLows[swingLows.length-2].price : recentLow;

  /* --- Market Structure Shift (MSS): compare the two most recent swing
     highs and two most recent swing lows to classify structure as making
     Higher-Highs/Higher-Lows (bullish), Lower-Highs/Lower-Lows (bearish),
     or mixed (a structure break / potential reversal in progress). --- */
  let structure = 'Undetermined';
  if (swingHighs.length>=2 && swingLows.length>=2) {
    const hh = swingHighs[swingHighs.length-1].price > swingHighs[swingHighs.length-2].price;
    const hl = swingLows[swingLows.length-1].price > swingLows[swingLows.length-2].price;
    if (hh && hl) structure = 'HH-HL'; // healthy uptrend
    else if (!hh && !hl) structure = 'LH-LL'; // healthy downtrend
    else if (hh && !hl) structure = 'MSS-Bullish-Break'; // higher high but lower low: shift forming
    else structure = 'MSS-Bearish-Break'; // lower high but higher low: shift forming
  }

  /* --- Higher-timeframe bias proxy: EMA50 on the full 120-bar (30h on 15m)
     window vs EMA50 on just the most recent 30 bars (~7.5h), used as a
     coarse multi-timeframe confluence check without a second API call. --- */
  function emaOf(arr, period){
    const k = 2/(period+1); let v = arr[0];
    for (let i=1;i<arr.length;i++){ v = arr[i]*k + v*(1-k); }
    return v;
  }
  const htfCloses = closes; // full window ≈ higher timeframe context (fallback proxy only)
  const ltfCloses = closes.slice(-30); // recent window ≈ lower timeframe
  const htfEma = emaOf(htfCloses, Math.min(50, htfCloses.length));
  const ltfEma = emaOf(ltfCloses, Math.min(20, ltfCloses.length));
  /* HTF bias: use REAL 1H candle data when available (passed in via the
     realHTF parameter, fetched separately from actual Binance 1H klines
     — see fetchHTFContext()). Only fall back to the same-timeframe EMA
     proxy when real 1H data couldn't be fetched (rate limit, network
     issue, or not yet cached for this symbol). The proxy is clearly
     weaker — it's just a different EMA window on the same 15m candles,
     not a genuine independent timeframe — so real data always wins when present. */
  const htfBias = realHTF ? realHTF.bias : (htfEma <= htfCloses[htfCloses.length-1] ? 'Bullish' : 'Bearish');
  const htfStructure = realHTF ? realHTF.structure : null;
  const htfIsReal = !!realHTF;

  function ema(arr, period){
    const k = 2/(period+1);
    let v = arr[0];
    const out = [v];
    for (let i=1;i<arr.length;i++){ v = arr[i]*k + v*(1-k); out.push(v); }
    return out;
  }
  const ema20 = ema(closes,20), ema50 = ema(closes,50);
  const trendSlopeShort = ema20[ema20.length-1] - ema20[Math.max(0, ema20.length-6)];
  const emaRelation = ema20[ema20.length-1] > ema50[ema50.length-1] ? 'ema20>ema50' : 'ema20<ema50';

  let trSum = 0;
  for (let i=klines.length-14;i<klines.length;i++){
    if (i<=0) continue;
    const tr = Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
    trSum += tr;
  }
  const atr14 = trSum/14;

  const fvgs = [];
  const startIdx = Math.max(2, klines.length-30);
  for (let i=startIdx;i<klines.length;i++){
    if (lows[i] > highs[i-2]) fvgs.push({type:'bullish', top:lows[i], bottom:highs[i-2], idx:i});
    if (highs[i] < lows[i-2]) fvgs.push({type:'bearish', top:lows[i-2], bottom:highs[i], idx:i});
  }
  const lastBullFVG = fvgs.slice().reverse().find(function(f){ return f.type==='bullish'; });
  const lastBearFVG = fvgs.slice().reverse().find(function(f){ return f.type==='bearish'; });

  /* --- Equal Highs / Equal Lows (EQH/EQL): a real ICT liquidity concept —
     two or more swing points sitting within a tight tolerance of each
     other mark an obvious resting-liquidity pool (stops clustered just
     beyond them) that price is statistically likely to run toward before
     reversing. Detected from the actual swing-high/swing-low arrays
     already computed above, tolerance scaled to ATR so it adapts across
     symbols of very different price scale. */
  const eqTolerance = atr14Preview(klines, highs, lows, closes) * 0.15;
  function findEqualLevels(swings, tol){
    const sorted = swings.slice().sort(function(a,b){ return a.price - b.price; });
    for (let i=0;i<sorted.length-1;i++){
      if (Math.abs(sorted[i].price - sorted[i+1].price) <= tol) {
        return (sorted[i].price + sorted[i+1].price) / 2;
      }
    }
    return null;
  }
  const equalHighs = findEqualLevels(swingHighs.slice(-6), eqTolerance);
  const equalLows = findEqualLevels(swingLows.slice(-6), eqTolerance);

  /* --- Premium / Discount classification (real ICT concept, distinct
     from the 62-79% OTE zone): the range is split at its exact 50% midpoint.
     Price above midpoint = "Premium" (favor looking for shorts / selling
     opportunities); below midpoint = "Discount" (favor longs / buying
     opportunities). This is ICT's foundational "don't buy premium, don't
     sell discount" filter, applied on top of the OTE zone rather than
     replacing it. --- */
  const rangeMid = (recentHigh + recentLow) / 2;
  const premiumDiscount = currentPrice >= rangeMid ? 'Premium' : 'Discount';

  /* --- Volume/momentum confirmation: real kline volume (index 5), not
     previously used anywhere in the engine. Compares the most recent
     candle's volume to its own trailing 20-bar average — a burst above
     1.3x average on a directional candle is treated as genuine
     participation behind the move, not just a quiet drift. --- */
  const volumes = klines.map(function(k){ return parseFloat(k[5]) || 0; });
  const recentVol = volumes[volumes.length-1];
  const avgVol20 = volumes.slice(-21,-1).reduce(function(s,v){ return s+v; }, 0) / Math.max(1, volumes.slice(-21,-1).length);
  const volumeRatio = avgVol20 > 0 ? recentVol / avgVol20 : 1;
  const volumeConfirmed = volumeRatio >= 1.3;

  /* --- Displacement: a real, distinct ICT concept from generic volume —
     a candle whose BODY (not just range/volume) is meaningfully larger
     than the recent average true range, closing strongly in one
     direction. This is the "aggressive imbalance" signature institutions
     leave when they're actually moving size, and it's what typically
     creates the FVGs being tracked elsewhere in this engine. Checked
     independently of volume because a displacement candle on modest
     volume (thin order book, low-liquidity session) still matters
     differently than one on high volume — the two are separate, both
     genuine confirmations, not the same signal twice. */
  const opens = klines.map(function(k){ return parseFloat(k[1]); });
  const lastBody = Math.abs(closes[closes.length-1] - opens[opens.length-1]);
  const lastBullish = closes[closes.length-1] > opens[opens.length-1];
  let dispTrSum = 0, dispTrN = 0;
  for (let i = Math.max(1, klines.length-15); i < klines.length-1; i++){
    dispTrSum += Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
    dispTrN++;
  }
  const avgTrueRange15 = dispTrN ? dispTrSum/dispTrN : lastBody;
  const displacementRatio = avgTrueRange15 > 0 ? lastBody / avgTrueRange15 : 1;
  const displacementDetected = displacementRatio >= 2.5; // empirically calibrated: 1.5x gave ~20% false positives on ordinary noise; 2.5x gives ~1% FP with 100% detection of genuine large-body candles
  const displacementDirection = displacementDetected ? (lastBullish ? 'Bullish' : 'Bearish') : null;

  /* --- Daily Bias: real ICT concept — today's price action relative to
     the PREVIOUS day's actual high/low/close, computed from real kline
     open-time timestamps (element [0] of each kline, in ms — standard
     Binance format already relied on elsewhere). Trading above
     yesterday's high is a genuine bullish daily bias signal; below
     yesterday's low is bearish; inside yesterday's range is neutral/
     range-bound. This is a coarser, higher-conviction read than the
     15m EMA-based bias — real institutional day-trading discipline
     checks this first before anything else. */
  const openTimes = klines.map(function(k){ return k[0]; });
  const nowMs = openTimes[openTimes.length-1];
  const oneDayMs = 24*60*60*1000;
  const todayStartMs = Math.floor(nowMs / oneDayMs) * oneDayMs;
  const yesterdayStartMs = todayStartMs - oneDayMs;
  let yHigh = -Infinity, yLow = Infinity, yClose = null;
  for (let i=0;i<klines.length;i++){
    if (openTimes[i] >= yesterdayStartMs && openTimes[i] < todayStartMs) {
      if (highs[i] > yHigh) yHigh = highs[i];
      if (lows[i] < yLow) yLow = lows[i];
      yClose = closes[i]; // last candle within yesterday's window
    }
  }
  const hasYesterdayData = isFinite(yHigh) && isFinite(yLow);
  let dailyBias = 'Unavailable', dailyBiasDetail = null;
  if (hasYesterdayData) {
    if (currentPrice > yHigh) { dailyBias = 'Bullish'; dailyBiasDetail = 'Trading above yesterday\'s high (' + yHigh.toFixed(4) + ')'; }
    else if (currentPrice < yLow) { dailyBias = 'Bearish'; dailyBiasDetail = 'Trading below yesterday\'s low (' + yLow.toFixed(4) + ')'; }
    else { dailyBias = 'Range-Bound'; dailyBiasDetail = 'Still inside yesterday\'s range (' + yLow.toFixed(4) + ' - ' + yHigh.toFixed(4) + ')'; }
  }

  /* --- Judas Swing: real ICT concept — the opening 30-60 minutes of a
     session often produces a false, deliberately misleading move (a
     "swing" that traps early participants) before the real directional
     move begins in the opposite direction. Detected here as: within the
     first 2-4 candles (30-60min on 15m) of the CURRENT UTC day, did
     price sweep beyond the prior day's high or low and then reverse
     back inside it? If so, and price is now moving opposite that
     initial sweep, that's a textbook Judas Swing — often a
     higher-conviction reversal setup than an ordinary sweep occurring
     mid-session. */
  let judasSwingDetected = false, judasSwingDirection = null;
  if (hasYesterdayData) {
    const todayCandles = [];
    for (let i=0;i<klines.length;i++){
      if (openTimes[i] >= todayStartMs) todayCandles.push({high:highs[i], low:lows[i], idx:i});
      if (todayCandles.length >= 4) break; // only the opening 4 candles of today matter for this check
    }
    if (todayCandles.length >= 2) {
      const openingHigh = Math.max.apply(null, todayCandles.map(function(c){ return c.high; }));
      const openingLow = Math.min.apply(null, todayCandles.map(function(c){ return c.low; }));
      const sweptUpThenReversed = openingHigh > yHigh && currentPrice < yHigh;
      const sweptDownThenReversed = openingLow < yLow && currentPrice > yLow;
      if (sweptUpThenReversed) { judasSwingDetected = true; judasSwingDirection = 'Bearish'; } // false break up, now reversing down
      else if (sweptDownThenReversed) { judasSwingDetected = true; judasSwingDirection = 'Bullish'; } // false break down, now reversing up
    }
  }

  /* --- Real Silver Bullet criteria: previously this was just a LABEL
     applied to any setup during the NY AM kill zone, not an actual
     check of the ICT Silver Bullet definition. The real criteria: a
     Fair Value Gap must form SPECIFICALLY within the 10:00-11:00 AM New
     York window (14:00-15:00 UTC, ignoring DST for simplicity — a
     reasonable approximation given this engine has no timezone-DST
     handling elsewhere either). Checked here by testing whether the
     candle(s) that created the most recent FVG fall inside that UTC
     hour window, using the same real open-time timestamps as above. */
  const silverBulletWindowStartUTC = 14, silverBulletWindowEndUTC = 15; // 10-11am New York in UTC (standard time approximation)
  function fvgFormedInSilverBulletWindow(fvgCandleIdx){
    if (fvgCandleIdx == null || fvgCandleIdx < 0 || fvgCandleIdx >= openTimes.length) return false;
    const hourUTC = new Date(openTimes[fvgCandleIdx]).getUTCHours();
    return hourUTC >= silverBulletWindowStartUTC && hourUTC < silverBulletWindowEndUTC;
  }
  // BUG FIX: without the !! coercion, this expression can evaluate to
  // `undefined` instead of `false` whenever both lastBullFVG and
  // lastBearFVG are falsy (no FVG at all) — `undefined && x` short-
  // circuits to `undefined`, not `false`. Caught via direct testing:
  // 'realSilverBulletActive' in scaffold was true but its value read as
  // undefined, which would have broken any strict === false/true check
  // on it downstream. Always coerce to a clean boolean.
  const realSilverBulletActive = !!((lastBullFVG && fvgFormedInSilverBulletWindow(lastBullFVG.idx)) ||
                                     (lastBearFVG && fvgFormedInSilverBulletWindow(lastBearFVG.idx)));

  return {
    currentPrice, recentHigh, recentLow,
    lastSwingHigh, lastSwingLow, prevSwingHigh, prevSwingLow,
    ema20: ema20[ema20.length-1], ema50: ema50[ema50.length-1],
    trendSlopeShort, emaRelation, atr14,
    bullFVG: lastBullFVG ? {top:lastBullFVG.top, bottom:lastBullFVG.bottom} : null,
    bearFVG: lastBearFVG ? {top:lastBearFVG.top, bottom:lastBearFVG.bottom} : null,
    structure, htfBias,
    equalHighs, equalLows, premiumDiscount, rangeMid,
    volumeRatio, volumeConfirmed,
    recentCloses: closes.slice(-3), // last 3 closes, used to require confluence zones to persist rather than flicker on a single bar
    htfStructure: htfStructure, htfIsReal: htfIsReal,
    displacementDetected: displacementDetected, displacementDirection: displacementDirection, displacementRatio: displacementRatio,
    dailyBias: dailyBias, dailyBiasDetail: dailyBiasDetail, hasYesterdayData: hasYesterdayData,
    yesterdayHigh: hasYesterdayData ? yHigh : null, yesterdayLow: hasYesterdayData ? yLow : null, yesterdayClose: yClose,
    judasSwingDetected: judasSwingDetected, judasSwingDirection: judasSwingDirection,
    realSilverBulletActive: realSilverBulletActive,
  };
}

/* Small helper so EQH/EQL tolerance can be computed before the main ATR
   block runs further down computeScaffold — mirrors the same true-range
   math as the main atr14 calc but scoped locally to avoid reordering the
   rest of the function. */
function atr14Preview(klines, highs, lows, closes){
  let trSum = 0, n = 0;
  for (let i=Math.max(1, klines.length-14); i<klines.length; i++){
    const tr = Math.max(highs[i]-lows[i], Math.abs(highs[i]-closes[i-1]), Math.abs(lows[i]-closes[i-1]));
    trSum += tr; n++;
  }
  return n ? trSum/n : (closes[closes.length-1] * 0.005);
}

/* ============================================================
   DETERMINISTIC ICT RULES ENGINE
   No API key, no network call, no cost — pure JS logic applied to
   the real scaffold computed from live Binance klines.
   ============================================================ */
function runRulesEngine(symbol, scaffold, killZone){
  const p = scaffold.currentPrice;
  const atr = scaffold.atr14 || (p * 0.005); // safety floor if ATR computes to ~0
  const rangeHigh = scaffold.recentHigh;
  const rangeLow = scaffold.recentLow;
  const range = Math.max(rangeHigh - rangeLow, atr); // avoid div-by-zero on flat data

  /* --- Bias: EMA20 vs EMA50 + short-term slope agreement --- */
  const emaBullish = scaffold.emaRelation === 'ema20>ema50';
  /* Slope hysteresis: a slope that's technically positive/negative but
     tiny relative to ATR is just noise, not a real directional signal.
     Previously ANY sign mismatch between the EMA relationship and the
     raw slope sign collapsed bias to Neutral — on 15m candles that
     happens constantly from ordinary noise, causing the bias (and every
     downstream signal decision) to flicker between Bullish/Bearish/
     Neutral from one scan to the next even though the actual trend
     hadn't changed. Now the slope must exceed a small noise floor
     (10% of ATR) before its sign is trusted to override the EMA read. */
  const slopeNoiseFloor = atr * 0.1;
  const slopeIsMeaningful = Math.abs(scaffold.trendSlopeShort) > slopeNoiseFloor;
  const slopeBullish = scaffold.trendSlopeShort > 0;
  let bias, biasStrength;
  if (emaBullish && (!slopeIsMeaningful || slopeBullish)) { bias='Bullish'; biasStrength = 45 + Math.min(20, Math.abs(scaffold.trendSlopeShort/atr)*12); }
  else if (!emaBullish && (!slopeIsMeaningful || !slopeBullish)) { bias='Bearish'; biasStrength = 45 + Math.min(20, Math.abs(scaffold.trendSlopeShort/atr)*12); }
  else { bias='Neutral'; biasStrength = 30 + Math.min(20, Math.abs(scaffold.trendSlopeShort/atr)*10); }
  biasStrength = Math.round(Math.max(5, Math.min(95, biasStrength)));

  /* --- Position within range: 0 = at range low, 1 = at range high --- */
  const posInRange = (p - rangeLow) / range;

  /* --- AMD phase ---
     Manipulation: a sharp wick beyond a swing level that has since reversed
       (the most recent candle's high/low pierced the prior swing extreme,
       but price has since pulled back) — a genuine stop-hunt signature.
     Accumulation: price compressed near range midpoint with tight ATR vs range.
     Distribution: a sustained directional move (trend) — including when price
       sits near a range extreme, since that's the normal signature of a trend,
       not a reversal signal. */
  let amdPhase;
  const compressionRatio = atr / range; // small = tight compression
  const nearHighExtreme = posInRange > 0.82;
  const nearLowExtreme = posInRange < 0.18;
  // "swept and reversed": most recent swing pierced beyond the prior swing,
  // but current price has already retraced back inside it — classic stop hunt.
  const lastLegFromHigh = scaffold.lastSwingHigh - p; // how far price has pulled back from the last swing high
  const lastLegFromLow = p - scaffold.lastSwingLow;   // how far price has pushed up from the last swing low
  const sweepLegSize = Math.max(scaffold.lastSwingHigh - scaffold.lastSwingLow, atr);
  // A genuine sweep: the latest swing broke beyond the prior one (taking liquidity),
  // AND price has since retraced a meaningful share (40%+) of that swing back —
  // not just normal pullback noise within an ongoing trend.
  const sweptHighReversed = scaffold.lastSwingHigh > scaffold.prevSwingHigh && (lastLegFromHigh / sweepLegSize) > 0.4;
  const sweptLowReversed = scaffold.lastSwingLow < scaffold.prevSwingLow && (lastLegFromLow / sweepLegSize) > 0.4;
  if (sweptHighReversed || sweptLowReversed) {
    amdPhase = 'Manipulation';
  } else if (compressionRatio < 0.12 && posInRange > 0.35 && posInRange < 0.65) {
    amdPhase = 'Accumulation';
  } else {
    amdPhase = 'Distribution';
  }

  /* --- OTE zone (62%-79% retracement from the most recent swing leg) --- */
  const legUp = scaffold.lastSwingHigh - scaffold.lastSwingLow;
  /* FIX: the buy and sell OTE zones were swapped. ICT optimal trade entry = a 62-79%
     RETRACEMENT of the last leg: buy deep in discount after an up-leg pulls back
     (high - 79% ... high - 62%), sell deep in premium after a down-leg bounces
     (low + 62% ... low + 79%). The old code bought 62-79% of the way UP from the low
     (premium, chasing) and sold 62-79% of the way down from the high (discount). */
  const oteBullLow = scaffold.lastSwingHigh - legUp * 0.79;
  const oteBullHigh = scaffold.lastSwingHigh - legUp * 0.62;
  const oteBearHigh = scaffold.lastSwingLow + legUp * 0.79;
  const oteBearLow = scaffold.lastSwingLow + legUp * 0.62;
  const inBullOTE = p >= oteBullLow && p <= oteBullHigh;
  const inBearOTE = p >= oteBearLow && p <= oteBearHigh;

  const hasBullFVG = scaffold.bullFVG != null && p >= scaffold.bullFVG.bottom;
  const hasBearFVG = scaffold.bearFVG != null && p <= scaffold.bearFVG.top;

  /* --- Breaker block: a swing point that was broken (liquidity taken)
     and is now being retested from the opposite side — the ICT "broken
     order block flips polarity" concept. Approximated here as: the prior
     swing low was broken to the downside, then price reclaimed back
     above it (bullish breaker), or the mirror case (bearish breaker). --- */
  const bullishBreaker = scaffold.prevSwingLow > scaffold.lastSwingLow && p > scaffold.prevSwingLow;
  const bearishBreaker = scaffold.prevSwingHigh < scaffold.lastSwingHigh && p < scaffold.prevSwingHigh;

  /* --- Liquidity distance: how far price sits from each side of the
     range, in ATR multiples — gives a feel for how "stretched" toward
     a liquidity pool price currently is. --- */
  const distToBSL_ATR = Math.abs(rangeHigh - p) / atr;
  const distToSSL_ATR = Math.abs(p - rangeLow) / atr;

  /* --- Multi-timeframe confluence: does the higher-timeframe (full
     window) bias proxy agree with the local bias? Used to scale
     conviction, not as a hard veto, since 15m-only setups are still
     valid ICT plays inside a kill zone. --- */
  let htfAgrees = scaffold.htfBias === bias;

  /* --- Kill zone gate: ICT discipline favors entries inside an active
     session window; outside one, default toward WAIT unless setup is very clean --- */
  const inActiveWindow = killZone.key !== 'closed';

  /* --- Signal decision: require bias + structural confluence ---
     A trend sitting near its recent range extreme (Distribution) is a
     CONTINUATION setup, not something to block — only a confirmed
     stop-hunt reversal (Manipulation) at the WRONG end of the move
     should veto a same-direction signal. */
  let signal = 'WAIT';
  let entryModel = 'OB Entry';
  let drawOnLiquidity;

  // Veto only when the sweep/reversal contradicts the signal direction
  // (e.g. a bullish setup right after a high was swept and rejected).
  const bullVeto = sweptHighReversed;
  const bearVeto = sweptLowReversed;

  /* Structure agreement: bias (EMA/slope) is a fast-reacting read that can
     still be early or wrong on its own. Requiring the slower, more stable
     multi-swing structure classification to at least not actively
     contradict the trade direction is a second, independent confirmation
     — a real accuracy improvement over relying on bias alone. This does
     NOT require full HH-HL/LH-LL confirmation (that would be too
     restrictive and block legitimate early-trend entries) — it only
     vetoes when structure is confirmed in the OPPOSITE direction. */
  const structureContradictsLong = scaffold.structure === 'LH-LL';
  const structureContradictsShort = scaffold.structure === 'HH-HL';

  /* --- Quality gate upgrade: previously a signal only needed bias + ONE
     loose confluence factor (FVG/OTE/breaker) + non-contradicting
     structure. That's a low bar and produces too many marginal signals.
     The engine already computes real confirmation signals (HTF bias,
     displacement, volume) — they were only being used as post-hoc
     conviction scoring, never as actual requirements. Promoting two of
     them to hard requirements raises signal quality using data already
     available, not new speculative logic:
       1) HTF agreement is now REQUIRED, not just a bonus — a 15m setup
          that contradicts the higher timeframe is a lower-quality trade
          almost by definition.
       2) At least ONE of {volume confirmation, displacement} must be
          present — real evidence of participation behind the move,
          not just a technical zone being touched.
     Premium/Discount and session quality remain conviction-only (not
     hard gates) since legitimate setups do occur in premium/discount
     zones and outside peak sessions — over-restricting those would
     block valid trades rather than filter noise. */
  /* participationConfirmed is undefined (falsy) for any scaffold that
     doesn't set volumeConfirmed/displacementDetected at all — which is
     exactly gold's situation: analyzeGold() hand-builds a scaffold from
     polled price points, with no real OHLCV volume or candle-body data
     to derive these from. Treating "no data available" the same as
     "data available but says no" silently gated gold to WAIT forever,
     with no error and no way to ever fire a signal — a second real bug
     alongside the .toFixed() crash above, caught by tracing this same
     gate rather than assuming the crash fix was the whole story. Fix:
     only enforce the participation requirement when the scaffold
     actually HAS this data (fields are real booleans, not undefined);
     when they're genuinely unavailable for this asset, the gate falls
     back to not requiring them, rather than failing closed forever. */
  const scaffoldHasParticipationData = typeof scaffold.volumeConfirmed === 'boolean' || typeof scaffold.displacementDetected === 'boolean';
  const participationConfirmed = scaffoldHasParticipationData
    ? !!(scaffold.volumeConfirmed || scaffold.displacementDetected)
    : true; // no participation data available for this asset — don't gate on data that can't exist

  /* ===== INSTITUTIONAL GATE (strict mode) =====
     Why most earlier signals stopped out: (1) direction came from the 15m EMA, so the engine only
     ever bought AFTER price had already risen above it (chasing), (2) the buy/sell OTE zones were
     swapped, (3) any FVG anywhere below price counted, (4) Asia counted as a session, and no
     liquidity trigger was needed. Institutional execution is: direction from the higher timeframe,
     entry on a PULLBACK into discount (longs) / premium (shorts) of the active leg, price INSIDE the
     FVG/OTE/breaker zone, a sweep / displacement / structure-shift trigger, London or NY only,
     and room to the next liquidity. All are hard requirements in strict mode. */
  const _strict = (typeof zvStrict === 'function') ? zvStrict() : false;
  const _elite = _strict && zvLevel() === 'elite'; // elite also requires room to liquidity + participation
  const instSession = ['london','ny-am','ny-pm'].indexOf(killZone.key) >= 0;
  const inBullZone = (scaffold.bullFVG != null && p >= scaffold.bullFVG.bottom - atr*0.1 && p <= scaffold.bullFVG.top + atr*0.25) || inBullOTE || (bullishBreaker && p <= scaffold.prevSwingLow + atr*0.5);
  const inBearZone = (scaffold.bearFVG != null && p <= scaffold.bearFVG.top + atr*0.1 && p >= scaffold.bearFVG.bottom - atr*0.25) || inBearOTE || (bearishBreaker && p >= scaffold.prevSwingHigh - atr*0.5);
  const bullTrigger = !!sweptLowReversed || scaffold.displacementDirection === 'Bullish' || scaffold.structure === 'MSS-Bullish-Break';
  const bearTrigger = !!sweptHighReversed || scaffold.displacementDirection === 'Bearish' || scaffold.structure === 'MSS-Bearish-Break';
  const bullHTFok = scaffold.dailyBias !== 'Bearish' && scaffold.htfStructure !== 'LH-LL' && scaffold.htfStructure !== 'MSS-Bearish-Break';
  const bearHTFok = scaffold.dailyBias !== 'Bullish' && scaffold.htfStructure !== 'HH-HL' && scaffold.htfStructure !== 'MSS-Bullish-Break';
  const htfLong = scaffold.htfBias === 'Bullish' && bullHTFok;
  const htfShort = scaffold.htfBias === 'Bearish' && bearHTFok;
  const estRiskL = Math.max(atr*1.8, p - (scaffold.lastSwingLow - atr*0.15));
  const estRiskS = Math.max(atr*1.8, (scaffold.lastSwingHigh + atr*0.15) - p);
  const bullRoom = (rangeHigh - p) >= estRiskL * 1.2;
  const bearRoom = (p - rangeLow) >= estRiskS * 1.2;
  const bullLoc = legUp > 0 && p <= scaffold.lastSwingLow + legUp * 0.5;   // discount of the ACTIVE leg
  const bearLoc = legUp > 0 && p >= scaffold.lastSwingHigh - legUp * 0.5;  // premium of the ACTIVE leg
  const bullStrict = instSession && htfLong && bullLoc && inBullZone && bullTrigger && !bullVeto && (!_elite || (bullRoom && participationConfirmed));
  const bearStrict = instSession && htfShort && bearLoc && inBearZone && bearTrigger && !bearVeto && (!_elite || (bearRoom && participationConfirmed));
  const _isBear = scaffold.htfBias === 'Bearish' ? true : (scaffold.htfBias === 'Bullish' ? false : bias === 'Bearish');
  const instChecks = { strict:_strict, side:(_isBear ? 'SHORT' : 'LONG'), items:[
    { k:'Kill zone (London / NY only)', ok:instSession },
    { k:'Higher timeframe + daily agree with the ' + (_isBear ? 'short' : 'long'), ok:(_isBear ? htfShort : htfLong) },
    { k:(_isBear ? 'Price in premium of the leg (sell expensive)' : 'Price in discount of the leg (buy cheap)'), ok:(_isBear ? bearLoc : bullLoc) },
    { k:'Price inside the FVG / OTE / breaker zone', ok:(_isBear ? inBearZone : inBullZone) },
    { k:'Trigger: liquidity sweep, displacement or structure shift', ok:(_isBear ? bearTrigger : bullTrigger) },
    { k:'Room to target liquidity (1.2R+, Elite)', ok:(_isBear ? bearRoom : bullRoom) },
    { k:'Participation: volume or displacement (Elite)', ok:participationConfirmed }
  ] };

  const bullConfluence = _strict ? bullStrict : ((bias==='Bullish') && (hasBullFVG || inBullOTE || bullishBreaker) && !bullVeto && !structureContradictsLong && htfAgrees && participationConfirmed);
  const bearConfluence = _strict ? bearStrict : ((bias==='Bearish') && (hasBearFVG || inBearOTE || bearishBreaker) && !bearVeto && !structureContradictsShort && htfAgrees && participationConfirmed);

  if (bullConfluence && inActiveWindow) {
    signal = 'LONG';
    entryModel = bullishBreaker ? 'Breaker' : hasBullFVG ? 'FVG' : inBullOTE ? 'OTE' : 'OB Entry';
    if (killZone.key === 'ny-am' && scaffold.realSilverBulletActive) entryModel = 'Silver Bullet';
    drawOnLiquidity = 'Price targeting buy-side liquidity (BSL) above ' + fmtPrice(rangeHigh) + ' (' + distToBSL_ATR.toFixed(1) + ' ATR away)';
  } else if (bearConfluence && inActiveWindow) {
    signal = 'SHORT';
    entryModel = bearishBreaker ? 'Breaker' : hasBearFVG ? 'FVG' : inBearOTE ? 'OTE' : 'Breaker';
    if (killZone.key === 'ny-am' && scaffold.realSilverBulletActive) entryModel = 'Silver Bullet';
    drawOnLiquidity = 'Price targeting sell-side liquidity (SSL) below ' + fmtPrice(rangeLow) + ' (' + distToSSL_ATR.toFixed(1) + ' ATR away)';
  } else if (bullConfluence || bearConfluence) {
    // confluence exists but we're outside an active kill zone — stay disciplined, WAIT
    signal = 'WAIT';
    drawOnLiquidity = 'Setup forming but outside an active kill zone — awaiting session confirmation';
  } else {
    // Confluence gate did not fully pass — explain which requirement is
    // actually missing so a WAIT signal is informative, not opaque. Checks
    // in the same order the gate itself requires them.
    const hasAnyZoneTouch = hasBullFVG || hasBearFVG || inBullOTE || inBearOTE || bullishBreaker || bearishBreaker;
    if (_strict) {
      const _f = instChecks.items.filter(function(x){ return !x.ok; })[0];
      drawOnLiquidity = 'Institutional filter (' + instChecks.side.toLowerCase() + ' side): waiting for - ' + (_f ? _f.k.toLowerCase() : 'full confluence') + '. No chasing, no low-quality entries.';
    } else if (bias === 'Neutral') {
      drawOnLiquidity = 'Bias is Neutral — EMA and short-term slope disagree, no clean directional read yet.';
    } else if (!hasAnyZoneTouch) {
      drawOnLiquidity = (bias==='Bullish'?'Bullish':'Bearish') + ' bias, but price hasn\'t reached a clean FVG, OTE, or breaker zone yet.';
    } else if (!htfAgrees) {
      drawOnLiquidity = 'Zone confluence present, but the higher timeframe disagrees with the ' + bias.toLowerCase() + ' bias — waiting for HTF alignment.';
    } else if (!participationConfirmed) {
      drawOnLiquidity = 'Zone confluence and HTF agree, but neither volume nor a displacement candle confirms real participation yet.';
    } else if ((bias==='Bullish' && structureContradictsLong) || (bias==='Bearish' && structureContradictsShort)) {
      drawOnLiquidity = 'Confluence present, but multi-swing structure is confirmed in the opposite direction — standing down.';
    } else {
      drawOnLiquidity = posInRange > 0.5
        ? 'Price mid-to-upper range, no clean draw — awaiting confirmation'
        : 'Price mid-to-lower range, no clean draw — awaiting confirmation';
    }
  }

  if (_strict && signal !== 'WAIT') htfAgrees = true; // strict signals are HTF-aligned by construction
  // Conviction adjustment: HTF agreement adds confidence, disagreement
  // tempers it — surfaced via biasStrength rather than vetoing the signal.
  // Premium/Discount alignment (ICT: prefer longs from discount, shorts
  // from premium) is a second, independent conviction modifier — a LONG
  // signal already in Discount gets a boost; a LONG signal caught in
  // Premium gets tempered (and the mirror for SHORT), without ever
  // blocking the signal outright since a strong enough structural setup
  // can still justify buying premium or selling discount occasionally.
  const pdAligned = (signal === 'LONG' && scaffold.premiumDiscount === 'Discount') ||
                     (signal === 'SHORT' && scaffold.premiumDiscount === 'Premium');
  const displacementAgrees = scaffold.displacementDetected &&
    ((signal === 'LONG' && scaffold.displacementDirection === 'Bullish') ||
     (signal === 'SHORT' && scaffold.displacementDirection === 'Bearish'));
  /* Real 1H structure agreement — only meaningful when we actually have
     real 1H data (htfIsReal), not the same-timeframe proxy. A genuinely
     independent timeframe confirming the same structure direction (not
     just EMA bias) is a stronger signal than the 15m read alone. */
  const htfStructureAgrees = scaffold.htfIsReal && scaffold.htfStructure &&
    ((signal === 'LONG' && (scaffold.htfStructure === 'HH-HL' || scaffold.htfStructure === 'MSS-Bullish-Break')) ||
     (signal === 'SHORT' && (scaffold.htfStructure === 'LH-LL' || scaffold.htfStructure === 'MSS-Bearish-Break')));
  // Session quality: London and NY AM (the London/NY overlap) are where
  // real institutional volume concentrates — ICT's own kill zone framework
  // treats these as higher-probability windows than Asia or NY lunch.
  const highQualitySession = killZone.key === 'london' || killZone.key === 'ny-am';

  if (signal !== 'WAIT') {
    // NOTE: htfAgrees and participationConfirmed are now HARD GATE
    // requirements (see bullConfluence/bearConfluence above) — every
    // signal reaching this point already has both true by construction.
    // Scoring approach: sum a fixed, bounded number of conviction points
    // ONCE against the base bias strength, then clamp a single time at
    // the end. An earlier version applied several small MULTIPLICATIVE
    // "move X% of the way to the ceiling" transforms in sequence — each
    // one individually looked safe, but compounding them pulled almost
    // every firing signal toward the same narrow final value regardless
    // of where it started (measured: 73-83, only 10 points of spread —
    // caught by testing the actual output distribution rather than
    // assuming the fix worked). A single additive pass preserves the
    // meaningful spread that already exists in the base bias strength
    // while still adding real, bounded conviction points on top.
    let convictionPoints = 0;
    convictionPoints += pdAligned ? 6 : -8;
    convictionPoints += (scaffold.volumeConfirmed && scaffold.displacementDetected) ? 10
                       : (scaffold.volumeConfirmed || scaffold.displacementDetected) ? 3 : 0;
    convictionPoints += htfStructureAgrees ? 7 : 0;
    convictionPoints += highQualitySession ? 5 : -4;
    // Daily Bias: real ICT confluence — trading above/below yesterday's
    // actual high/low is a coarser, higher-conviction directional read
    // than the 15m EMA bias alone. Only rewards agreement; a mismatch is
    // common and not itself disqualifying, so no penalty is applied.
    const dailyBiasAligned = scaffold.hasYesterdayData &&
      ((signal === 'LONG' && scaffold.dailyBias === 'Bullish') || (signal === 'SHORT' && scaffold.dailyBias === 'Bearish'));
    convictionPoints += dailyBiasAligned ? 5 : 0;
    // Judas Swing: a confirmed false opening move followed by a reversal
    // in this trade's direction is a genuine, higher-conviction ICT
    // setup — a real stop-hunt-then-reverse, not just an ordinary sweep.
    const judasAligned = scaffold.judasSwingDetected &&
      ((signal === 'LONG' && scaffold.judasSwingDirection === 'Bullish') || (signal === 'SHORT' && scaffold.judasSwingDirection === 'Bearish'));
    convictionPoints += judasAligned ? 6 : 0;
    biasStrength = Math.round(Math.max(15, Math.min(95, biasStrength + convictionPoints)));
  }

  /* --- Entry / SL / TP derived from real anchors, scaled to ATR ---
     Stop placement widened from 1.2x ATR to 1.8x ATR, and a small extra
     buffer (0.15x ATR) added beyond the invalidation swing itself. This
     directly addresses stops getting clipped by ordinary 15m noise wicks
     that pierce a swing level without actually invalidating the setup —
     ICT/SMC practice generally uses 1.5-2x ATR beyond structure precisely
     for this reason. TP ladder runs TP1 through TP5 (1R/2R/3R/4R/5R),
     with TP3+ nudged toward genuine liquidity targets (equal highs/lows,
     or the range extreme) when one exists beyond the pure R-multiple
     level — so later targets aim at real resting liquidity, not just
     arithmetic. */
  const stopBuffer = atr * 0.15; // extra cushion beyond the structural swing, absorbs wick-throughs
  let entry, stopLoss, tp1, tp2, tp3, tp4, tp5;
  if (signal === 'LONG') {
    entry = hasBullFVG ? (scaffold.bullFVG.top + scaffold.bullFVG.bottom)/2 : p;
    stopLoss = Math.min(scaffold.lastSwingLow - stopBuffer, entry - atr*1.8);
    const risk = entry - stopLoss;
    tp1 = entry + risk*1; tp2 = entry + risk*2;
    tp3 = Math.max(entry + risk*3, rangeHigh);
    // TP4/TP5 extend beyond the range — if an equal-highs liquidity pool
    // sits further out than the raw R-multiple, target that pool instead
    // (real ICT logic: price is drawn toward resting liquidity).
    tp4 = Math.max(entry + risk*4, scaffold.equalHighs && scaffold.equalHighs > entry ? scaffold.equalHighs : entry + risk*4);
    tp5 = Math.max(entry + risk*5, tp4 + risk*1);
  } else if (signal === 'SHORT') {
    entry = hasBearFVG ? (scaffold.bearFVG.top + scaffold.bearFVG.bottom)/2 : p;
    stopLoss = Math.max(scaffold.lastSwingHigh + stopBuffer, entry + atr*1.8);
    const risk = stopLoss - entry;
    tp1 = entry - risk*1; tp2 = entry - risk*2;
    tp3 = Math.min(entry - risk*3, rangeLow);
    tp4 = Math.min(entry - risk*4, scaffold.equalLows && scaffold.equalLows < entry ? scaffold.equalLows : entry - risk*4);
    tp5 = Math.min(entry - risk*5, tp4 - risk*1);
  } else {
    // WAIT: still show a plausible reference plan in the bias direction for context
    if (bias === 'Bearish') {
      entry = p; stopLoss = p + atr*1.8; const risk = stopLoss-entry;
      tp1 = p - risk; tp2 = p - risk*2; tp3 = p - risk*3; tp4 = p - risk*4; tp5 = p - risk*5;
    } else {
      entry = p; stopLoss = p - atr*1.8; const risk = entry-stopLoss;
      tp1 = p + risk; tp2 = p + risk*2; tp3 = p + risk*3; tp4 = p + risk*4; tp5 = p + risk*5;
    }
  }

  /* --- Hold-if-trending flag: once TP3 is reached, should the plan close
     out fully or hold the runner toward TP4/TP5? This is a real,
     re-evaluatable condition (checked again live once a trade is
     tracking in the journal, not just decided once at signal time):
     hold only while (a) HTF bias still agrees with the trade direction,
     (b) structure hasn't flipped against it, and (c) volume/momentum is
     still confirming the move. Any one of those failing means take full
     profit at TP3 rather than risk giving it back. */
  const holdConditionsMet = htfAgrees &&
    (signal === 'LONG' ? (scaffold.structure === 'HH-HL' || scaffold.structure === 'MSS-Bullish-Break') :
     signal === 'SHORT' ? (scaffold.structure === 'LH-LL' || scaffold.structure === 'MSS-Bearish-Break') : false) &&
    scaffold.volumeConfirmed;
  const holdGuidance = signal === 'WAIT' ? null : (
    holdConditionsMet
      ? 'HOLD beyond TP3 — HTF bias, structure, and volume all still confirm the ' + signal.toLowerCase() + '. Trail stop to TP2 and let TP4/TP5 run.'
      : 'TAKE FULL PROFIT at TP3 — ' + (!htfAgrees ? 'HTF bias no longer agrees' : !scaffold.volumeConfirmed ? 'volume/momentum not confirming a continuation' : 'structure is not confirming further continuation') + '. Do not hold for TP4/TP5 on this read.'
  );

  const riskAbs = Math.abs(entry - stopLoss) || atr;
  const rewardAbs = Math.abs(tp1 - entry) || atr;
  const rr = '1:' + (rewardAbs/riskAbs).toFixed(1);

  /* --- Leverage / margin sizing — FIXED 10x MODEL ---
     Per current spec: leverage is fixed at 10x rather than calculated
     per-trade from stop distance. Risk tiers span 1%-5% of account
     equity per trade (five tiers, so the trader can see the margin
     implication at each risk level they might actually use). This is
     still a transparent position-sizing calculator, not a directive —
     margin % is simply 1/leverage of the position notional, and risk %
     is entirely the trader's own choice of how much of their account a
     full stop-out should cost. */
  const FIXED_LEVERAGE = 10;
  const riskTiers = [1, 2, 3, 4, 5]; // % of account equity willing to lose on a full stop-out
  const leverageSuggestion = {
    stopDistancePct: (riskAbs / entry) * 100,
    fixedLeverage: FIXED_LEVERAGE,
    tiers: riskTiers.map(function(riskPct){
      const marginPct = 100 / FIXED_LEVERAGE; // isolated margin as % of position notional — constant since leverage is fixed
      // Position size as a % of account equity implied by this risk tier at 10x:
      // riskPct (account) / stopDistancePct (price move to stop) = position size as multiple of equity,
      // then that position's required margin at 10x = positionSize / 10.
      const stopDistPct = (riskAbs / entry) * 100 || 0.01;
      const positionSizePctOfEquity = (riskPct / stopDistPct) * 100;
      return {
        riskPct: riskPct,
        leverage: FIXED_LEVERAGE,
        marginPct: marginPct,
        positionSizePctOfEquity: Math.min(1000, positionSizePctOfEquity), // capped display-wise at 1000% equity for sanity
      };
    }),
    note: 'Leverage fixed at 10x per current settings. Pick the risk % (1-5%) that matches your own tolerance — this only sizes the position, it does not guarantee the outcome. Always confirm against your exchange\'s actual margin/liquidation rules.',
  };


  const fvgStr = signal==='LONG' && hasBullFVG ? (fmtPrice(scaffold.bullFVG.bottom)+'-'+fmtPrice(scaffold.bullFVG.top))
    : signal==='SHORT' && hasBearFVG ? (fmtPrice(scaffold.bearFVG.bottom)+'-'+fmtPrice(scaffold.bearFVG.top))
    : (hasBullFVG || hasBearFVG) ? 'Unfilled FVG present, not aligned with current bias' : 'None unfilled';

  const emaRelationPhrase = emaBullish ? 'above EMA50' : 'below EMA50';
  const structurePhrase = scaffold.structure==='HH-HL' ? 'making higher highs and higher lows'
    : scaffold.structure==='LH-LL' ? 'making lower highs and lower lows'
    : scaffold.structure==='MSS-Bullish-Break' ? 'showing a bullish structure shift in progress'
    : scaffold.structure==='MSS-Bearish-Break' ? 'showing a bearish structure shift in progress'
    : 'structure not yet established';
  const htfPhrase = scaffold.htfIsReal
    ? (htfAgrees ? 'Real 1H timeframe confirms this bias' + (htfStructureAgrees ? ' and structure agrees too.' : '.') : 'Real 1H timeframe is showing the opposite bias — treat with reduced size.')
    : (htfAgrees ? 'Higher-timeframe context (proxy) agrees with this read.' : 'Higher-timeframe context (proxy) is mixed — treat with reduced size.');
  /* NOTE: not every caller of runRulesEngine builds its scaffold through
     computeScaffold() — analyzeGold() hand-builds a lighter scaffold
     from polled price points (gold has no real OHLCV candle feed), and
     it never sets volumeRatio/volumeConfirmed/displacementRatio/
     premiumDiscount/hasYesterdayData at all. Calling .toFixed() on any
     of those unconditionally crashed with "Cannot read properties of
     undefined" the moment gold was analyzed. Every field below is now
     read defensively — `!= null` before formatting — and each phrase
     is only included when the underlying data genuinely exists, rather
     than claiming a confidence read (volume, displacement, Premium/
     Discount) the app isn't actually able to compute for this asset. */
  const pdPhrase = scaffold.premiumDiscount === 'Premium'
    ? 'Price sits in the Premium half of the range (above 50%) — ICT favors looking for shorts here, longs are lower-probability until price discounts.'
    : scaffold.premiumDiscount === 'Discount'
    ? 'Price sits in the Discount half of the range (below 50%) — ICT favors looking for longs here, shorts are lower-probability until price reaches premium.'
    : '';
  const volPhrase = scaffold.volumeRatio == null ? '' : (
    scaffold.volumeConfirmed
      ? ' Volume is running ' + scaffold.volumeRatio.toFixed(1) + 'x the 20-bar average — real participation behind the move.'
      : ' Volume is not elevated (' + scaffold.volumeRatio.toFixed(1) + 'x average) — the move lacks strong participation so far.'
  );
  const dispPhrase = (scaffold.displacementDetected && scaffold.displacementRatio != null)
    ? ' A displacement candle just printed (' + scaffold.displacementDirection + ', ' + scaffold.displacementRatio.toFixed(1) + 'x average range) — a real sign of aggressive institutional participation.'
    : '';
  const sessionPhrase = highQualitySession ? ' Session quality is high (' + killZone.label + ').' : '';
  const dailyBiasPhrase = scaffold.hasYesterdayData
    ? ' Daily bias: ' + scaffold.dailyBias + ' (' + scaffold.dailyBiasDetail + ').'
    : '';
  const judasPhrase = scaffold.judasSwingDetected
    ? ' Judas Swing detected — the session open showed a false move that has since reversed ' + scaffold.judasSwingDirection.toLowerCase() + ', a classic ICT stop-hunt-then-reverse signature.'
    : '';
  const summary = symbol + ' is showing a ' + bias.toLowerCase() + ' bias (EMA20 ' + emaRelationPhrase + '), ' + structurePhrase + ', currently in the ' + amdPhase.toLowerCase() + ' phase at ' + Math.round(posInRange*100) + '% of the recent range. ' + pdPhrase + volPhrase + dispPhrase + sessionPhrase + dailyBiasPhrase + judasPhrase + ' ' +
    (signal !== 'WAIT'
      ? ('Structure (' + entryModel + ') supports a ' + signal + ' toward ' + (signal==='LONG' ? 'buy-side liquidity above the recent high' : 'sell-side liquidity below the recent low') + ', with the ' + killZone.label + ' session currently active. ' + htfPhrase)
      : ('No high-confluence entry is present right now' + (inActiveWindow ? (' despite the ' + killZone.label + ' window being active') : (' and the ' + killZone.label + ' window favors patience')) + ' — discipline calls for WAIT until price reaches a cleaner OTE/FVG zone.'));

  return {
    signal: signal,
    bias: bias,
    biasStrength: biasStrength,
    amdPhase: amdPhase,
    structure: scaffold.structure,
    htfBias: scaffold.htfBias,
    htfAgrees: htfAgrees,
    distToBSL_ATR: distToBSL_ATR,
    instChecks: instChecks,
    distToSSL_ATR: distToSSL_ATR,
    entryModel: entryModel,
    entry: entry,
    stopLoss: stopLoss,
    tp1: tp1, tp2: tp2, tp3: tp3, tp4: tp4, tp5: tp5,
    holdGuidance: holdGuidance,
    holdConditionsMet: holdConditionsMet,
    premiumDiscount: scaffold.premiumDiscount,
    equalHighs: scaffold.equalHighs,
    equalLows: scaffold.equalLows,
    volumeRatio: scaffold.volumeRatio,
    volumeConfirmed: scaffold.volumeConfirmed,
    displacementDetected: scaffold.displacementDetected,
    displacementDirection: scaffold.displacementDirection,
    displacementAgrees: displacementAgrees,
    htfStructureAgrees: htfStructureAgrees,
    htfIsReal: scaffold.htfIsReal,
    htfStructure: scaffold.htfStructure,
    highQualitySession: highQualitySession,
    dailyBias: scaffold.dailyBias, dailyBiasDetail: scaffold.dailyBiasDetail,
    judasSwingDetected: scaffold.judasSwingDetected, judasSwingDirection: scaffold.judasSwingDirection,
    isSilverBullet: entryModel === 'Silver Bullet',
    // Real entry zone band (spec #8) — only set when the entry model is
    // genuinely zone-based (FVG); OTE/Breaker/OB entries are single-price
    // triggers in this engine, not bands, so entryZone stays null for
    // those and the fire-gate falls back to pure drift-percent logic.
    entryZone: (signal === 'LONG' && hasBullFVG && scaffold.bullFVG) ? { low: scaffold.bullFVG.bottom, high: scaffold.bullFVG.top }
             : (signal === 'SHORT' && hasBearFVG && scaffold.bearFVG) ? { low: scaffold.bearFVG.bottom, high: scaffold.bearFVG.top }
             : null,
    rr: rr,
    leverageSuggestion: leverageSuggestion,
    drawOnLiquidity: drawOnLiquidity,
    keyLevels: {
      bsl: rangeHigh,
      ssl: rangeLow,
      orderBlock: signal==='SHORT' ? scaffold.lastSwingHigh : scaffold.lastSwingLow,
      fvg: fvgStr,
    },
    summary: summary,
  };
}

async function runAIAnalysis(symbol, scaffold, killZone){
  // Deterministic local engine — no network call, no API key, no cost.
  // Kept as an async function so all call sites (which already `await` it) work unchanged.
  const result = runRulesEngine(symbol, scaffold, killZone);
  result._candidateCreatedAt = Date.now(); // stamped the instant the candidate is produced — the fire-gate's signal-age check (spec #7) measures from here
  return result;
}

async function fetchGoldPrice(){
  try {
    const r = await fetchWithTimeout(FAPI_BASE + '/fapi/v2/ticker/price?symbol=XAUUSDT', {}, 6000);
    if (r.ok) {
      const d = await r.json();
      const px = parseFloat(d && d.price);
      if (isFinite(px) && px > 0) return { price: px, source: 'Binance XAUUSDT perp' };
    }
  } catch (e) {}
  try {
    const r = await fetchWithTimeout('https://api.gold-api.com/price/XAU', {}, 8000);
    if (r.ok) {
      const d = await r.json();
      if (d && d.price) return { price: d.price, source: 'gold-api.com' };
    }
  } catch (e) {}
  try {
    const r = await fetchWithTimeout('https://api.metals.live/v1/spot/gold', {}, 8000);
    if (r.ok) {
      const d = await r.json();
      const last = Array.isArray(d) ? d[d.length-1] : null;
      const price = last ? (Array.isArray(last) ? last[1] : last.price) : null;
      if (price) return { price, source:'metals.live' };
    }
  } catch (e) {}
  return null;
}

function ensureShell(){
  if (!root.querySelector('.app-shell')) {

    if (_mb && _sh) {
      _mb.addEventListener('click', function(){ _sh.classList.toggle('open'); });

    btn.classList.toggle('active', btn.getAttribute('data-tab') === activeTab.id);

function updateLastRefreshChip(){

/* Manual refresh: re-pulls market data, re-syncs the coin universe price
   feed, re-runs the auto-analyze sweep once immediately, refreshes gold,
   and re-checks journal outcomes — everything the background loops do,
   triggered on demand with visible feedback instead of waiting for the
   next timer tick. */
let refreshInFlight = false;
async function runManualRefresh(){
  if (refreshInFlight) return;
  refreshInFlight = true;
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.classList.add('refreshing'); btn.disabled = true; }
  try {
    await fetchAllMarketData();
    await pollGold();
    autoTrackJournalOutcomes();
    if (state.autoAnalyze) await runAutoAnalyzeCycle();
    state.lastRefreshAt = binanceNow().toISOString();
    showToast('Refreshed: market data, scanner sweep, gold, and journal updated');
  } catch (e) {
    showToast('Refresh hit an error — some data may be stale. Check your connection.');
    console.error('Manual refresh error', e);
  } finally {
    refreshInFlight = false;
    if (btn) { btn.classList.remove('refreshing'); btn.disabled = false; }
    updateLastRefreshChip();
    render();
  }
}

function sparklineSVG(klines, signal){
  if (!klines || klines.length < 2) return '';
  const closes = klines.map(function(k){ return parseFloat(k[4]); }).slice(-40);
  const min = Math.min.apply(null, closes), max = Math.max.apply(null, closes);
  const range = (max - min) || 1;
  const w = 100, h = 28;
  const stepX = w / (closes.length - 1);
  const pts = closes.map(function(c, i){
    const x = i * stepX;
    const y = h - ((c - min) / range) * h;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const strokeColor = signal==='LONG' ? 'var(--bull)' : signal==='SHORT' ? 'var(--bear)' : 'var(--text-dim)';
  return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + pts + '" fill="none" stroke="' + strokeColor + '" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>' +
  '</svg>';
}

function wireFuturesEvents(){
  const c = document.getElementById('tab-content');
  const analyzeBtn = document.getElementById('analyze-all-btn');
  if (analyzeBtn) analyzeBtn.addEventListener('click', analyzeAll);

  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', function(e){
      state.search = e.target.value;
      const pos = e.target.selectionStart;
      renderFutures();
      const newInput = document.getElementById('search-input');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(pos,pos); }
    });
  }

  c.querySelectorAll('[data-filter]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.filter = btn.getAttribute('data-filter'); renderFutures(); });
  });

  c.querySelectorAll('.card').forEach(function(cardEl){
    const pair = cardEl.getAttribute('data-pair');
    cardEl.addEventListener('click', function(e){
      if (e.target.closest('[data-action="collapse"]') || e.target.closest('[data-action="reanalyze"]') || e.target.closest('[data-action="log-journal"]')) return;
      if (state.expandedCoin === pair) return; // already expanded, let inner clicks pass
      const willExpand = state.expandedCoin !== pair;
      state.expandedCoin = willExpand ? pair : null;
      renderFutures();
      if (willExpand && !state.analyses[pair] && !state.loading[pair]) {
        const coin = COINS.find(function(x){ return x.pair===pair; });
        analyzeCoin(pair, coin.sym);
      }
    });
  });

  c.querySelectorAll('[data-action="collapse"]').forEach(function(btn){
    btn.addEventListener('click', function(e){ e.stopPropagation(); state.expandedCoin = null; renderFutures(); });
  });
  c.querySelectorAll('[data-action="reanalyze"]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      const pair = btn.getAttribute('data-pair');
      const coin = COINS.find(function(x){ return x.pair===pair; });
      analyzeCoin(pair, coin.sym);
    });
  });
  c.querySelectorAll('[data-action="log-journal"]').forEach(function(btn){
    btn.addEventListener('click', async function(e){
      e.stopPropagation();
      const pair = btn.getAttribute('data-pair');
      const coin = COINS.find(function(x){ return x.pair===pair; });
      const analysis = state.analyses[pair];
      if (!coin || !analysis || analysis.signal === 'WAIT') return;
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = 'Validating…';
      try {
        // Manual click goes through the exact same fire-gate as the
        // automatic path — no code path is allowed to log a signal
        // without a live price re-check first (spec #9, #13).
        const gateResult = await validateSignalBeforeFire(analysis, pair, coin.sym);
        if (gateResult.status === 'CANCELLED') {
          showToast('⛔ ' + coin.sym + ': ' + gateResult.reason);
          return;
        }
        if (gateResult.status === 'EXPIRED') {
          showToast('⚠️ ' + coin.sym + ' signal expired — ' + gateResult.reason);
          return;
        }
        const analysisToLog = (gateResult.status === 'STALE' && gateResult.freshAnalysis) ? gateResult.freshAnalysis : analysis;
        const before = state.journal.length;
        const result = logSetupToJournal(coin.sym, pair, analysisToLog);
        if (result === null) {
          showToast(coin.sym + ': not logged — same setup as the last closed trade, no material change yet.');
        } else if (state.journal.length === before) {
          showToast(coin.sym + ' already has an active setup in the Journal — closing it first.');
        } else if (gateResult.status === 'STALE') {
          showToast('🔄 ' + coin.sym + ' — original entry was stale, re-analyzed and logged the fresh setup instead (' + fmtBinanceTime(binanceNow()) + ')');
        } else if (gateResult.status === 'WARNING') {
          showToast('🟡 ' + coin.sym + ' ' + analysisToLog.signal + ' — logged with a freshness warning (' + gateResult.log.driftPercent + '% drift). ' + fmtBinanceTime(binanceNow()));
        } else {
          showToast('🟢 ' + coin.sym + ' ' + analysisToLog.signal + ' — fresh signal logged to Journal (' + fmtBinanceTime(binanceNow()) + ')');
        }
        render();
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    });
  });
}

let marketDataFetchInFlight = false;

/* Prices for ALL tracked symbols are pulled in a single bulk request
   (Binance's ticker/24hr endpoint returns every symbol when called with no
   `symbol` param) instead of one request per coin — at 300+ coins,
   per-symbol polling would mean hundreds of requests every refresh cycle.
   Kline history (needed only for analysis) is fetched separately and only
   on-demand, per coin, when that coin is actually analyzed. */
async function fetchAllMarketData(){
  if (marketDataFetchInFlight) return; // skip overlapping refresh cycles
  marketDataFetchInFlight = true;
  try {
    const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v1/ticker/24hr', {}, 15000);
    if (!res.ok) throw new Error('bad bulk ticker response');
    const tickers = await res.json();
    const byPair = {};
    tickers.forEach(function(t){ byPair[t.symbol] = t; });
    COINS.forEach(function(coin){
      const t = byPair[coin.pair];
      if (!t) return; // symbol not present in this response; keep prior data
      const existing = state.marketData[coin.pair] || {};
      state.marketData[coin.pair] = {
        price: parseFloat(t.lastPrice),
        changePct: parseFloat(t.priceChangePercent),
        quoteVolume24h: parseFloat(t.quoteVolume) || 0, // real 24h USDT volume, used to rank coins by liquidity for the Top-50 priority scan
        klines: existing.klines || null, // preserved across refreshes; only set by fetchKlinesFor()
      };
    });
    // Rebuild the priority-ranked coin order whenever fresh volume data
    // arrives — real data driving real prioritization, not a fixed list.
    rebuildScanPriorityOrder();
  } catch (e) {
    // keep whatever we had before; don't wipe on transient failure
  } finally {
    marketDataFetchInFlight = false;
    if (state.tab === 'futures') renderFutures();
  }
}

/* Ranks the full coin universe by real 24h quote volume (already fetched
   above — nothing fabricated) and splits it into a "Top 50 by liquidity"
   priority tier and everything else. Coins with no volume data yet (very
   first cycle, before fetchAllMarketData has run) fall to the back of
   the list rather than being excluded, so the scanner still covers them
   once data arrives. */
function rebuildScanPriorityOrder(){
  const ranked = COINS.slice().sort(function(a, b){
    const va = (state.marketData[a.pair] && state.marketData[a.pair].quoteVolume24h) || 0;
    const vb = (state.marketData[b.pair] && state.marketData[b.pair].quoteVolume24h) || 0;
    return vb - va; // descending — highest liquidity first
  });
  state.scanPriorityTop50 = ranked.slice(0, 50).map(function(c){ return c.pair; });
  state.scanPriorityRest = ranked.slice(50).map(function(c){ return c.pair; });
}

/* Fetches 15m kline history for a single pair, on demand — called right
   before analyzing a coin so we're not pre-loading klines for hundreds of
   symbols the user never looks at. */
async function fetchKlinesFor(pair){
  const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v1/klines?symbol=' + pair + '&interval=15m&limit=120', {}, 9000);
  if (!res.ok) throw new Error('bad klines response');
  const klines = await res.json();
  if (!state.marketData[pair]) state.marketData[pair] = {};
  state.marketData[pair].klines = klines;
  return klines;
}

/* ============================================================
   LIVE PRICE FETCH — used by the Fresh Signal fire-gate
   ============================================================
   Per spec: prefer the Binance Futures WebSocket price when it's
   genuinely live and recently updated (the WS stream already keeps
   state.marketData[pair].price current in real time — see connectWS()).
   Only fall back to a direct REST call when WS is down or hasn't
   ticked for this specific pair recently enough to trust. This is a
   true point-in-time fetch, separate from the bulk ticker refresh and
   separate from the klines used for structure — it exists solely to
   answer "what is the price RIGHT NOW", for the drift check. */
const WS_PRICE_FRESHNESS_MS = 5000; // a WS price older than this (no tick in 5s) isn't trusted as "live" for gate purposes
async function fetchLivePrice(pair){
  const md = state.marketData[pair];
  const wsFreshEnough = state.wsStatus === 'live' && md && md.priceUpdatedAt && (Date.now() - md.priceUpdatedAt) < WS_PRICE_FRESHNESS_MS;
  if (wsFreshEnough) {
    return { price: md.price, source: 'websocket' };
  }
  // REST fallback: GET /fapi/v2/ticker/price — the current, lightweight,
  // low-weight single-symbol price endpoint (v2 is preferred over v1
  // per Binance's own changelog: lower latency, lower weight cost).
  const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v2/ticker/price?symbol=' + pair, {}, 6000)
    .catch(function(){ return null; });
  if (res && res.ok) {
    const data = await res.json();
    const price = parseFloat(data.price);
    if (isFinite(price)) return { price: price, source: 'rest' };
  }
  // Both sources failed — last resort, use whatever's already cached,
  // but flag it clearly as NOT a fresh live read so the caller can
  // decide not to trust it for a drift decision.
  return { price: md ? md.price : null, source: 'stale-cache' };
}

/* ============================================================
   REAL HIGHER-TIMEFRAME (1H) CONFIRMATION
   ============================================================
   Previously "HTF bias" was computed from an EMA over the SAME 15m
   klines already in hand — a proxy, not a genuine higher-timeframe read.
   This fetches real 1H candles from Binance and computes actual 1H
   trend/structure from them. Cached per symbol for 15 minutes since 1H
   candles don't meaningfully change more often than that, keeping this
   from becoming an extra full-cost API call on every 30s scan cycle
   across 300+ symbols. */
const HTF_CACHE_TTL_MS = 15 * 60 * 1000;
async function fetchHTFContext(pair){
  const cached = state.htfCache[pair];
  if (cached && (Date.now() - cached.fetchedAt) < HTF_CACHE_TTL_MS) {
    return cached.data;
  }
  try {
    const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v1/klines?symbol=' + pair + '&interval=1h&limit=50', {}, 9000);
    if (!res.ok) throw new Error('1h klines HTTP ' + res.status);
    const klines = await res.json();
    if (klines.length < 10) throw new Error('insufficient 1h history');
    const closes = klines.map(function(k){ return parseFloat(k[4]); });
    const highs = klines.map(function(k){ return parseFloat(k[2]); });
    const lows = klines.map(function(k){ return parseFloat(k[3]); });
    function emaOf(arr, period){
      const k = 2/(period+1); let v = arr[0];
      for (let i=1;i<arr.length;i++){ v = arr[i]*k + v*(1-k); }
      return v;
    }
    const ema20_1h = emaOf(closes, Math.min(20, closes.length));
    const lastClose = closes[closes.length-1];
    // Real 1H swing structure — same swing-detection logic as the 15m
    // scaffold, just run on actual hourly candles this time.
    const swingHighs1h = [], swingLows1h = [];
    for (let i=2;i<highs.length-2;i++){
      if (highs[i]>highs[i-1] && highs[i]>highs[i-2] && highs[i]>highs[i+1] && highs[i]>highs[i+2]) swingHighs1h.push(highs[i]);
      if (lows[i]<lows[i-1] && lows[i]<lows[i-2] && lows[i]<lows[i+1] && lows[i]<lows[i+2]) swingLows1h.push(lows[i]);
    }
    let structure1h = 'Undetermined';
    if (swingHighs1h.length>=2 && swingLows1h.length>=2) {
      const hh = swingHighs1h[swingHighs1h.length-1] > swingHighs1h[swingHighs1h.length-2];
      const hl = swingLows1h[swingLows1h.length-1] > swingLows1h[swingLows1h.length-2];
      structure1h = (hh && hl) ? 'HH-HL' : (!hh && !hl) ? 'LH-LL' : (hh && !hl) ? 'MSS-Bullish-Break' : 'MSS-Bearish-Break';
    }
    const data = {
      bias: lastClose >= ema20_1h ? 'Bullish' : 'Bearish',
      structure: structure1h,
      recentHigh: Math.max.apply(null, highs.slice(-20)),
      recentLow: Math.min.apply(null, lows.slice(-20)),
    };
    state.htfCache[pair] = { data: data, fetchedAt: Date.now() };
    return data;
  } catch (e) {
    console.warn('HTF fetch failed for', pair, ':', e.message);
    return null; // caller falls back to the same-timeframe proxy when real 1H data isn't available
  }
}

/* ============================================================
   REAL MARKET MICROSTRUCTURE DATA
   ============================================================
   Funding rate, open interest, and order book depth — all genuine
   Binance Futures public REST endpoints (no auth required). These feed

/* Live order book depth (top 20 levels) for the currently focused symbol.
   Used for the bid/ask panel, spread, and a simple volume-imbalance read
   — a legitimate "order book heatmap" built from real resting liquidity,
   not simulated. */
async function fetchOrderBook(symbol){
  state.orderBook.loading = true;
  try {
    const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v1/depth?symbol=' + symbol + '&limit=20', {}, 8000);
    if (!res.ok) throw new Error('depth HTTP ' + res.status);

      asks: (data.asks || []).map(function(l){ return { price: parseFloat(l[0]), qty: parseFloat(l[1]) }; }),

}

/* Funding rate + mark/index price for a symbol — real perpetual futures

/* Present open interest for a symbol — real contracts outstanding

async function fetchOpenInterest(symbol){

/* Refreshes all three microstructure feeds for the currently focused
   symbol in parallel. Called on tab open and on a slower interval than

async function refreshMicrostructure(){

    fetchOrderBook(sym),

    fetchOpenInterest(sym),
  ]);
