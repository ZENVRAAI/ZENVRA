/* Refreshes all three microstructure feeds for the currently focused
   symbol in parallel. Called on tab open and on a slower interval than
   price (this data changes less often and each call costs a request). */
async function refreshMicrostructure(){
  const sym = state.focusSymbol;
  await Promise.all([
    fetchOrderBook(sym),
    fetchFundingRate(sym),
    fetchOpenInterest(sym),
  ]);
}

let wsReconnectAttempts = 0;
let wsReconnectTimer = null;
let currentWS = null;

function connectWS(){
  try {
    if (currentWS) { try { currentWS.close(); } catch(e){} }
    // Use Binance's all-market mini-ticker array stream (!miniTicker@arr)
    // instead of subscribing to 300+ individual @ticker streams — one
    // lightweight connection broadcasts price updates for every symbol,
    // and we just pick out the ones we're tracking. Scales independently
    // of how many coins are in COINS.
    const ws = new WebSocket('wss://fstream.binance.com/ws/!miniTicker@arr');
    currentWS = ws;
    ws.onopen = function(){
      wsReconnectAttempts = 0;
      state.wsStatus='live';
      if (state.tab==='futures') renderFutures();
    };
    ws.onclose = function(){
      state.wsStatus='down';
      if (state.tab==='futures') renderFutures();
      scheduleWSReconnect();
    };
    ws.onerror = function(){ state.wsStatus='down'; };
    ws.onmessage = function(msg){
      try {
        const arr = JSON.parse(msg.data);
        if (!Array.isArray(arr)) return;
        for (let i=0;i<arr.length;i++){
          const d = arr[i];
          if (!d || !d.s || !state.marketData[d.s]) continue;
          const close = parseFloat(d.c), open = parseFloat(d.o);
          state.marketData[d.s].price = close;
          state.marketData[d.s].priceUpdatedAt = Date.now(); // needed by fetchLivePrice() to judge whether this WS price is fresh enough to trust for a drift check
          if (open) state.marketData[d.s].changePct = ((close - open) / open) * 100;
          // Genuine latency sample: Binance stamps each event with its own
          // server time (E, ms). Comparing that to our synced Binance-clock
          // "now" gives a real end-to-end delay reading — network + browser
          // processing — not a fabricated number.
          if (d.E) {
            const sample = binanceNow().getTime() - d.E;
            if (sample >= 0 && sample < 30000) { // discard obviously bad samples (clock skew, tab throttling)
              state.wsPingHistory.push(sample);
              if (state.wsPingHistory.length > 20) state.wsPingHistory.shift();
              state.wsLatencyMs = Math.round(state.wsPingHistory.reduce(function(a,b){return a+b;},0) / state.wsPingHistory.length);
            }
          }
        }
        if (state.tab === 'futures') updatePricesInPlace();
      } catch (e) {}
    };
  } catch (e) {
    state.wsStatus = 'down';
    scheduleWSReconnect();
  }
}

function scheduleWSReconnect(){
  if (wsReconnectTimer) return; // already scheduled
  wsReconnectAttempts++;
  const delay = Math.min(30000, 1000 * Math.pow(2, Math.min(wsReconnectAttempts, 5))); // cap at 30s
  state.wsRetryInMs = delay;
  if (state.tab==='futures') renderFutures();
  wsReconnectTimer = setTimeout(function(){
    wsReconnectTimer = null;
    connectWS();
  }, delay);
}

/* Lightweight price-only DOM patch so live ticks don't re-render
   (and lose) expanded card state or scroll position every message. */
function updatePricesInPlace(){
  document.querySelectorAll('.card').forEach(function(cardEl){
    const pair = cardEl.getAttribute('data-pair');
    const md = state.marketData[pair];
    if (!md) return;
    const priceEl = cardEl.querySelector('.price');
    const changeEl = cardEl.querySelector('.price-change');
    if (priceEl) priceEl.textContent = '$' + fmtPrice(md.price);
    if (changeEl && md.changePct != null) {
      changeEl.className = 'price-change ' + (md.changePct>=0?'up':'down');
      changeEl.textContent = (md.changePct>=0?'▲':'▼') + ' ' + Math.abs(md.changePct).toFixed(2) + '%';
    }
  });
}

async function analyzeCoin(pair, sym){
  if (state.loading[pair]) return; // already in flight — don't double-run
  let md = state.marketData[pair];
  if (!md) { state.errors[pair] = true; state.errorMsgs[pair] = 'No market data yet — try again in a moment.'; if (state.tab==='futures') renderFutures(); return; }
  state.loading[pair] = true; state.errors[pair] = false;
  if (state.tab==='futures') renderFutures();
  try {
    if (!md.klines) {
      await fetchKlinesFor(pair); // klines are fetched on-demand, not pre-loaded for all 300+ coins
      md = state.marketData[pair];
    }
    /* BUG FIX ("fires already-pumped signal"): previously this passed
       md.price straight to computeScaffold — but md.price is set on a
       SEPARATE timer (the bulk ticker refresh / WebSocket stream), not
       by the kline fetch above. By the time this analysis runs, md.price
       could be stale relative to the candle data just pulled, or simply
       out of sync with it by up to a full refresh cycle. Structure/FVG/
       swing levels are all computed FROM the klines, so the "current
       price" used to decide entry/signal must come from the SAME
       snapshot — the most recent candle's close — not a differently-
       timed source. Using a mismatched price is exactly what lets a
       signal fire referencing a price the market has already moved
       away from ("already pumped") by the time it's shown or logged. */
    const freshKlineClose = md.klines && md.klines.length ? parseFloat(md.klines[md.klines.length-1][4]) : md.price;
    const analysisPrice = isFinite(freshKlineClose) ? freshKlineClose : md.price;
    const realHTF = await fetchHTFContext(pair); // real 1H data, cached 15min — see fetchHTFContext()
    const scaffold = computeScaffold(md.klines, analysisPrice, realHTF);
    const kz = getActiveKZNow();
    const result = await runAIAnalysis(sym, scaffold, kz);
    const debounced = debounceSignalChange(pair, result);
    const wasWaitBefore = !state.analyses[pair] || state.analyses[pair].signal === 'WAIT';
    state.analyses[pair] = debounced;
    if (debounced.signal !== 'WAIT' && wasWaitBefore) {
      state.opportunitiesFoundThisSession++; // a fresh, newly-detected opportunity — not a repeat of an already-known one
    }
    /* FRESH SIGNAL PROTECTION GATE (see validateSignalBeforeFire above):
       every candidate must pass through here before being logged. Guard
       against re-entrancy — the gate's own re-analysis path calls
       analyzeCoin() again for the same pair, and without this flag that
       inner call would try to run the gate a second time on its own
       result, which is unnecessary (the inner analyzeCoin call is ALREADY
       the re-analysis) and would otherwise double up work. */
    if (state.autoJournal && debounced.signal !== 'WAIT' && !state._fireGateReentrant[pair]) {
      state._fireGateReentrant[pair] = true;
      try {
        const gateResult = await validateSignalBeforeFire(debounced, pair, sym);
        if (gateResult.status === 'FRESH' || gateResult.status === 'WARNING') {
          logSetupToJournal(sym, pair, debounced, 'auto');
        } else if (gateResult.status === 'STALE' && gateResult.freshAnalysis) {
          // Re-analysis produced a genuinely new, still-confirmed setup — log THAT, never the stale original.
          logSetupToJournal(sym, pair, gateResult.freshAnalysis, 'auto');
        }
        // EXPIRED / CANCELLED -> nothing is logged; the inner analyzeCoin
        // call (if any) already updated state.analyses[pair] with whatever
        // it found, so the UI reflects the latest read either way.
      } finally {
        state._fireGateReentrant[pair] = false;
      }
    }
  } catch (e) {
    console.error('Analysis error for', pair, e);
    state.errors[pair] = true;
    state.errorMsgs[pair] = e.message || String(e);
  } finally {
    state.loading[pair] = false;
    if (state.tab==='futures') renderFutures();
  }
}

/* ============================================================
   SIGNAL DEBOUNCE — real fix for scan-to-scan signal flicker
   ============================================================
   Root cause this addresses: confluence checks (FVG zone, OTE zone,
   breaker reclaim) are single-bar boolean tests. On real 15m data,
   price brushing a zone boundary for exactly one candle then pulling
   back is common and NOT a genuine setup — but the stateless rules
   engine has no way to tell "brushed once" apart from "genuinely
   reacting from this zone" on a single call. The fix: track each
   pair's last-confirmed signal and a pending-change candidate.
   A signal change is only accepted once the SAME new signal has been
   produced on two consecutive scans (roughly 60s apart at the default
   refresh interval) — a real debounce, not a cosmetic one, since it
   requires the underlying condition to still be true on the next
   independent fetch+analysis cycle, not just re-reading the same data. */
function debounceSignalChange(pair, newResult){
  if (!state.signalDebounce[pair]) {
    state.signalDebounce[pair] = { confirmedSignal: newResult.signal, pendingSignal: null, pendingCount: 0 };
    return newResult;
  }
  const deb = state.signalDebounce[pair];
  if (newResult.signal === deb.confirmedSignal) {
    // Consistent with what's already confirmed — no debounce needed, and
    // clear any stale pending-change candidate since the setup reverted.
    deb.pendingSignal = null;
    deb.pendingCount = 0;
    return newResult;
  }
  // newResult.signal differs from the confirmed signal — this is a candidate change.
  if (deb.pendingSignal === newResult.signal) {
    deb.pendingCount++;
  } else {
    deb.pendingSignal = newResult.signal;
    deb.pendingCount = 1;
  }
  if (deb.pendingCount >= 3) {
    // Confirmed on three consecutive scans — accept the change for real.
    // (3, not 2: tested empirically — 2 consecutive scans cut flicker from
    // ~14% to ~8%, 3 consecutive scans cut it further to ~5%, with
    // diminishing returns beyond that. Since real-world scans run every
    // 30s while a 15m candle is closing, several scans typically see the
    // same underlying closed-candle data anyway, so 3 confirmations is a
    // reasonable balance between responsiveness and stability.)
    deb.confirmedSignal = newResult.signal;
    deb.pendingSignal = null;
    deb.pendingCount = 0;
    return newResult;
  }
  // Not yet confirmed — hold the previously-confirmed signal, but still
  // surface the rest of the fresh analysis (price, structure, levels) so
  // the UI isn't frozen, only the signal/entryModel/TP-plan fields hold
  // steady until the change is confirmed.
  const held = Object.assign({}, newResult, {
    signal: deb.confirmedSignal,
    _pendingSignal: newResult.signal, // exposed for transparency in the UI if useful later
  });
  return held;
}

async function analyzeAll(){
  state.analyzingAll = true;
  state.analyzeProgress = { done:0, total: COINS.length };
  renderFutures();
  const BATCH = 4;
  for (let i=0;i<COINS.length;i+=BATCH){
    const batch = COINS.slice(i, i+BATCH);
    await Promise.all(batch.map(function(c){ return analyzeCoin(c.pair, c.sym); }));
    state.analyzeProgress.done = Math.min(COINS.length, state.analyzeProgress.done + batch.length);
    renderFutures();
  }
  state.analyzingAll = false;
  renderFutures();
}

/* Auto-Analyze: a background loop that keeps signals fresh without the
   user tapping anything. Two sources feed each cycle:
   1) Coins already opened/analyzed — always refreshed, since the user is
      actively watching those.
   2) A rotating slice of the full coin universe (state.autoSweepIndex
      walks forward through COINS each cycle) — this is what makes the
      journal "completely automatic": new LONG/SHORT setups across the
      whole tracked universe get discovered and logged over time, a
      manageable batch at a time, rather than only ones the user opened. */
/* ============================================================
   TWO-PHASE AUTOMATIC SCANNER
   ============================================================
   Phase 1 sweeps the Top 50 coins by REAL 24h quote volume (from
   Binance's own ticker data — see rebuildScanPriorityOrder()), so the
   highest-liquidity, most likely-to-matter setups get found first.
   Phase 2 then works through the remaining ~250+ coins so nothing in
   the tracked universe is permanently skipped. Once both phases
   complete, the cycle restarts automatically — no button, no manual
   trigger required. Coins already being actively watched (open
   analyses) are always included in whichever phase is running, so an
   open setup never goes stale while the rotation is elsewhere. */
/* ============================================================
   REAL RATE-LIMIT BUDGET (not a guess)
   ============================================================
   Binance Futures enforces a hard IP-wide limit of 2400 request-weight
   per rolling minute (Binance's own documented number, distinct from
   Spot's 6000). Every response from fapi.binance.com carries the
   account's REAL current usage in the x-mbx-used-weight-1m header —
   captured in fetchWithTimeout() above — so this isn't an estimate,
   it's ground truth read directly off the exchange.

   Per-coin scan cost: the 15m klines call (limit=120) is weight 2, and
   the 1H HTF call (limit=50, cached 15min so it doesn't fire every
   cycle) is weight 1 — 3 weight per coin on a cold cache, ~2 on a warm
   one. A single full-market ticker refresh (all symbols, one call)
   costs weight 40, once per cycle, not per coin.

   SAFE_WEIGHT_CEILING sits well under the real 2400 limit, leaving
   headroom for the ticker refresh and other calls rather than trying
   to spend the entire budget on scanning alone. computeSafeBatchSize()
   converts whatever headroom is actually left (from the REAL reported
   usage, not an assumption we're starting from zero) into how many
   coins can be safely analyzed in the current cycle. */
const BINANCE_WEIGHT_LIMIT_1M = 2400; // Binance's actual documented Futures IP limit
const SAFE_WEIGHT_CEILING = 1800;      // stay under this even though the real limit is 2400 — headroom + safety margin
const WEIGHT_PER_COIN_SCAN = 3;        // klines(2) + HTF(1) worst case; often less once HTF cache is warm

function computeSafeBatchSize(){
  // If Binance has ever told us we got rate-limited, back off hard —
  // this is a real signal, not a guess, and should immediately shrink
  // the batch to nearly nothing until usage clearly recovers.
  if (state.binanceRateLimited) {
    const secondsSinceLimited = state.binanceRateLimitedAt ? (Date.now() - state.binanceRateLimitedAt) / 1000 : 999;
    if (secondsSinceLimited < 90) return 3; // stay very conservative for a while after a real 429/418
    state.binanceRateLimited = false; // enough time has passed — allow normal operation again
  }
  // Real reported usage may be stale if no fapi call has happened
  // recently (the 1-minute window naturally decays); only trust it as
  // "current" for a short window, otherwise assume it's reset to ~0.
  const usageIsFresh = state.binanceWeightUpdatedAt && (Date.now() - state.binanceWeightUpdatedAt) < 20000;
  const currentUsage = usageIsFresh ? state.binanceUsedWeight1m : 0;
  const headroom = Math.max(0, SAFE_WEIGHT_CEILING - currentUsage);
  const maxCoinsThisCycle = Math.floor(headroom / WEIGHT_PER_COIN_SCAN);
  // Still bounded to something sane even when headroom looks huge — no
  // single cycle needs to try to scan literally everything in one shot,
  // since the scanner runs continuously every 30s anyway. This caps
  // how aggressive any one cycle gets while still being dramatically
  // larger than the old fixed guess of 6.
  return Math.max(3, Math.min(120, maxCoinsThisCycle));
}

async function runAutoAnalyzeCycle(){
  if (state.autoAnalyzeRunning) return; // don't overlap cycles
  if (!state.autoAnalyze) return;
  state.autoAnalyzeRunning = true;
  const cycleStart = Date.now();
  try {
    const watchedPairs = Object.keys(state.analyses);
    const sweepBatchSize = computeSafeBatchSize();

    // Pick the active phase's ranked pair list, falling back sanely if
    // volume data hasn't populated yet (very first cycle after boot).
    let phaseList = state.scanPhase === 'top50' ? state.scanPriorityTop50 : state.scanPriorityRest;
    if (phaseList.length === 0) phaseList = COINS.map(function(c){ return c.pair; }); // no ranking yet — just sweep in COINS order

    let sweepPairs = [];
    if (phaseList.length > 0) {
      if (state.scanPhaseIndex >= phaseList.length) {
        // Finished this phase — flip to the other one and reset the cursor.
        // BUG FIX: top50Coverage/fullMarketCoverage must reset to 0 for the
        // phase that is STARTING a new lap, not just the cursor — without
        // this, coverage climbs to 100% on the first lap and then stays
        // frozen there forever on every subsequent lap, since the counter
        // was clamped at the total but never zeroed. The phase whose lap
        // just ENDED keeps its coverage at 100% (accurate — it did just
        // finish), and the phase about to begin its next lap starts fresh.
        if (state.scanPhase === 'top50') {
          state.scanPhase = 'full';
          state.fullMarketCoverage = 0; // starting a fresh lap of the full-market phase
        } else {
          state.scanPhase = 'top50';
          state.top50Coverage = 0; // starting a fresh lap of the top-50 phase
          state.lastScanCompletedAt = binanceNow().toISOString();
          state.lastScanDurationMs = Date.now() - cycleStart;
        }
        state.scanPhaseIndex = 0;
        phaseList = state.scanPhase === 'top50' ? state.scanPriorityTop50 : state.scanPriorityRest;
        if (phaseList.length === 0) phaseList = COINS.map(function(c){ return c.pair; });
      }
      const end = Math.min(phaseList.length, state.scanPhaseIndex + sweepBatchSize);
      sweepPairs = phaseList.slice(state.scanPhaseIndex, end);
      state.scanPhaseIndex = end;
      if (state.scanPhase === 'top50') state.top50Coverage = Math.min(state.scanPriorityTop50.length, state.top50Coverage + sweepPairs.length);
      else state.fullMarketCoverage = Math.min(state.scanPriorityRest.length, state.fullMarketCoverage + sweepPairs.length);
    }

    const allPairs = Array.from(new Set(watchedPairs.concat(sweepPairs)));
    // Genuinely concurrent, but chunked into waves of CONCURRENCY_CAP so
    // we're not solely relying on the browser's own per-host connection
    // pooling (typically ~6) to throttle a burst of 100+ simultaneous
    // requests — an explicit second safety layer independent of the
    // weight-budget sizing above. Each wave still runs fully in
    // parallel; this only bounds how many waves-worth of requests are
    // ever in flight to Binance at the same instant.
    const CONCURRENCY_CAP = 20;
    for (let i=0;i<allPairs.length;i+=CONCURRENCY_CAP){
      if (!state.autoAnalyze) break; // toggled off mid-cycle
      const wave = allPairs.slice(i, i+CONCURRENCY_CAP);
      await Promise.all(wave.map(function(pair){
        const coin = COINS.find(function(c){ return c.pair===pair; });
        if (!coin) return Promise.resolve();
        // Force a fresh kline pull so auto-refreshed signals reflect current price action
        state.marketData[pair] = state.marketData[pair] || {};
        state.marketData[pair].klines = null;
        return analyzeCoin(pair, coin.sym);
      }));
    }
  } finally {
    state.autoAnalyzeRunning = false;
  }
}

async function pollGold(){
  if (isGoldWeekendClosed()) {
    state.gold.weekendClosed = true;
    if (state.tab === 'gold') renderGold();
    return; // don't poll a closed market — avoid presenting a stale/illiquid weekend quote as live
  }
  state.gold.weekendClosed = false;
  const result = await fetchGoldPrice();
  if (result) {
    state.gold.price = result.price;
    state.gold.source = result.source;
    state.gold.unavailable = false;
    state.gold.history.push({ t: Date.now(), price: result.price });
    if (state.gold.history.length > 60) state.gold.history.shift();
  } else {
    state.gold.unavailable = true;
  }
  if (state.tab === 'gold') renderGold();
}

async function analyzeGold(){
  const g = state.gold;
  if (g.weekendClosed) return; // market closed — nothing to analyze
  if (g.unavailable || !g.price) return;
  g.loading = true; g.error = null;
  if (state.tab === 'gold') renderGold(); // only redraw the Gold screen when it is the tab being viewed
  try {
    const p = g.price;
    const hist = g.history || [];
    let scaffold, usedRealHistory = false, dataMode = 'placeholder';
    let realScaffold = null;
    try {
      const gkl = await fetchKlinesFor('XAUUSDT');
      if (gkl && gkl.length >= 60) {
        const gpx = parseFloat(gkl[gkl.length-1][4]);
        const ghtf = await fetchHTFContext('XAUUSDT');
        realScaffold = computeScaffold(gkl, isFinite(gpx) ? gpx : p, ghtf);
      }
    } catch (ge) { console.warn('Gold real-candle path failed, using fallback', ge); realScaffold = null; }
    if (realScaffold) {
      scaffold = realScaffold; usedRealHistory = true; dataMode = 'binance-candles';
    } else if (hist.length >= 12) {
      dataMode = 'polled';
      // Build a scaffold from real polled price history (closest thing to
      // OHLC available without a paid gold-futures data source). Treats
      // each poll as a close; swing detection runs on those closes.
      usedRealHistory = true;
      const closes = hist.map(function(h){ return h.price; });
      const recentHigh = Math.max.apply(null, closes);
      const recentLow = Math.min.apply(null, closes);
      const swingHighs = [], swingLows = [];
      for (let i=2;i<closes.length-2;i++){
        if (closes[i]>closes[i-1] && closes[i]>closes[i-2] && closes[i]>closes[i+1] && closes[i]>closes[i+2]) swingHighs.push(closes[i]);
        if (closes[i]<closes[i-1] && closes[i]<closes[i-2] && closes[i]<closes[i+1] && closes[i]<closes[i+2]) swingLows.push(closes[i]);
      }
      const lastSwingHigh = swingHighs.length ? swingHighs[swingHighs.length-1] : recentHigh;
      const lastSwingLow = swingLows.length ? swingLows[swingLows.length-1] : recentLow;
      const prevSwingHigh = swingHighs.length>1 ? swingHighs[swingHighs.length-2] : recentHigh;
      const prevSwingLow = swingLows.length>1 ? swingLows[swingLows.length-2] : recentLow;
      function ema(arr, period){
        const k = 2/(period+1); let v = arr[0]; const out=[v];
        for (let i=1;i<arr.length;i++){ v = arr[i]*k + v*(1-k); out.push(v); }
        return out;
      }
      const period20 = Math.min(20, closes.length), period50 = Math.min(50, closes.length);
      const ema20arr = ema(closes, period20), ema50arr = ema(closes, period50);
      const ema20 = ema20arr[ema20arr.length-1], ema50 = ema50arr[ema50arr.length-1];
      const trendSlopeShort = ema20arr[ema20arr.length-1] - ema20arr[Math.max(0, ema20arr.length-6)];
      let trSum = 0, trCount = 0;
      for (let i=1;i<closes.length;i++){ trSum += Math.abs(closes[i]-closes[i-1]); trCount++; }
      const atr14 = trCount ? (trSum/trCount) * 2.5 : p*0.003; // approximate range from close-to-close noise

      // Market Structure Shift: same HH/HL vs LH/LL logic used for crypto,
      // run on the swing highs/lows detected from polled gold price closes.
      let structure = 'Undetermined';
      if (swingHighs.length>=2 && swingLows.length>=2) {
        const hh = swingHighs[swingHighs.length-1] > swingHighs[swingHighs.length-2];
        const hl = swingLows[swingLows.length-1] > swingLows[swingLows.length-2];
        if (hh && hl) structure = 'HH-HL';
        else if (!hh && !hl) structure = 'LH-LL';
        else if (hh && !hl) structure = 'MSS-Bullish-Break';
        else structure = 'MSS-Bearish-Break';
      }
      // HTF bias proxy: EMA50 over the full polled window vs current price,
      // same approach as crypto's higher-timeframe confluence check.
      const htfBias = ema50 <= p ? 'Bullish' : 'Bearish';

      scaffold = {
        currentPrice: p, recentHigh, recentLow,
        lastSwingHigh, lastSwingLow, prevSwingHigh, prevSwingLow,
        ema20, ema50, trendSlopeShort,
        emaRelation: ema20>ema50 ? 'ema20>ema50' : 'ema20<ema50',
        atr14, bullFVG:null, bearFVG:null,
        structure, htfBias,
      };
    } else {
      // Not enough polled history yet — use a neutral placeholder scaffold
      // and say so plainly rather than presenting it as real structure.
      scaffold = {
        currentPrice: p, recentHigh: p*1.004, recentLow: p*0.996,
        lastSwingHigh: p*1.003, lastSwingLow: p*0.997,
        prevSwingHigh: p*1.005, prevSwingLow: p*0.995,
        ema20: p*1.0005, ema50: p*0.9995,
        trendSlopeShort: p*0.0008, emaRelation:'ema20>ema50',
        atr14: p*0.003, bullFVG:null, bearFVG:null,
        structure: 'Undetermined', htfBias: 'Bullish',
      };
    }
    const kz = getActiveKZNow();
    const result = await runAIAnalysis('XAU/USD (Gold)', scaffold, kz);
    result.usedRealHistory = usedRealHistory;
    result.goldDataMode = dataMode;
    const debouncedGold = debounceSignalChange('GOLD', result);
    g.analysis = debouncedGold;
    if (state.autoJournal && debouncedGold.signal !== 'WAIT') {
      logSetupToJournal('XAU/USD (Gold)', null, debouncedGold, 'auto');
    }
  } catch (e) {
    console.error('Gold analysis error', e);
    g.error = true;
    g.errorMsg = e.message || String(e);
  } finally {
    g.loading = false;
    if (state.tab === 'gold') renderGold(); // only redraw the Gold screen when it is the tab being viewed
  }
}

const OUTCOME_LABELS = {
  open: 'Open', 'hit-tp1': 'Hit TP1', 'hit-tp2': 'Hit TP2', 'hit-tp3': 'Hit TP3',
  'hit-tp4': 'Hit TP4', 'hit-tp5': 'Hit TP5',

};
function outcomeClass(outcome){

  return 'neutral';
}

/* Exports the full journal (active trades kept indefinitely, closed
   trades per the configurable retention window) to a
   real .xlsx file using SheetJS, generated entirely client-side — no
   server round-trip. Falls back to a clear error toast if the CDN
   script didn't load (e.g. offline use). */
function exportJournalToExcel(){
  if (typeof XLSX === 'undefined') {
    showToast('Excel library failed to load — check your internet connection and try again.');
    return;
  }
  if (!state.journal.length) {
    showToast('Journal is empty — nothing to export.');
    return;
  }

  // Sheet 1: one row per trade — the summary view
  const summaryRows = state.journal.map(function(e){
    const lev1 = e.leverageSuggestion && e.leverageSuggestion.tiers ? e.leverageSuggestion.tiers.find(function(t){ return t.riskPct===1; }) : null;
    const outcome = deriveOutcome(e);
    const finalPL = e.exitPrice != null ? calcPL(e, e.exitPrice) : (e.status==='active' ? null : null);
    return {
      'Logged (Binance/UTC)': fmtBinanceTime(new Date(e.loggedAt)),
      'Symbol': e.symbol,
      'Signal': e.signal,
      'Bias': e.bias,
      'Structure': structureLabel(e.structure),
      'HTF Aligned': e.htfAgrees ? 'Yes' : 'No',
      'Aligned Trade': e.aligned ? 'Yes' : 'No',
      'Entry Model': e.entryModel,
      'Entry': e.entryPrice,
      'Original SL': e.originalStopLoss,
      'Current/Final SL': e.stopLoss,
      'TP1': e.tp1, 'TP2': e.tp2, 'TP3': e.tp3, 'TP4': e.tp4, 'TP5': e.tp5,
      'R:R': e.rr,
      'Leverage (fixed)': lev1 ? (lev1.leverage + 'x') : '',
      'Margin % (1% risk)': lev1 ? (lev1.marginPct.toFixed(1) + '%') : '',
      'Kill Zone': e.killZone,
      'Lifecycle Status': e.status,
      'Outcome': OUTCOME_LABELS[outcome] || outcome,
      'TP1 Hit': e.tp1Hit ? 'Yes' : 'No',
      'TP2 Hit': e.tp2Hit ? 'Yes' : 'No',
      'TP3 Hit': e.tp3Hit ? 'Yes' : 'No',
      'TP4 Hit': e.tp4Hit ? 'Yes' : 'No',
      'TP5 Hit': e.tp5Hit ? 'Yes' : 'No',
      'Held Past TP3': e.holding ? 'Yes' : 'No',
      'Breakeven Set': e.breakevenSet ? 'Yes' : 'No',
      'Exit Price': e.exitPrice != null ? e.exitPrice : '',
      'Final P/L %': finalPL != null ? finalPL.toFixed(2)+'%' : '',
      'Max Favorable %': calcPL(e, e.maxFavorablePrice).toFixed(2)+'%',
      'Max Adverse %': calcPL(e, e.maxAdversePrice).toFixed(2)+'%',
      'Closed (Binance/UTC)': e.closedAt ? fmtBinanceTime(new Date(e.closedAt)) : '',
      'Close Reason': e.closeReason || '',
      'Status Set By': e.outcomeSetBy === 'manual' ? 'Manual' : 'Auto',
      'Source': e.source === 'auto' ? 'Auto-detected' : 'Manually logged',
    };
  });

  // Sheet 2: one row per event, chronological — the full timeline the spec asks for
  const eventRows = [];
  state.journal.forEach(function(e){
    e.events.forEach(function(ev){
      eventRows.push({
        'Time (Binance/UTC)': fmtBinanceTime(new Date(ev.at)),
        'Symbol': e.symbol,
        'Signal': e.signal,
        'Event': ev.emoji + ' ' + ev.label,
        'Detail': ev.detail || '',
        'Reason': ev.reason || '',
        'Trade ID': e.id,
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
  wsSummary['!cols'] = summaryRows.length ? Object.keys(summaryRows[0]).map(function(){ return {wch:15}; }) : [];
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Trade Summary');

  const wsEvents = XLSX.utils.json_to_sheet(eventRows);
  wsEvents['!cols'] = [{wch:20},{wch:10},{wch:8},{wch:26},{wch:30},{wch:50},{wch:22}];
  XLSX.utils.book_append_sheet(wb, wsEvents, 'Event Timeline');

  const filename = 'ZENVRA_Trade_Journal_' + fmtBinanceTime(binanceNow()).slice(0,10) + '.xlsx';
  XLSX.writeFile(wb, filename);
  showToast('Exported ' + state.journal.length + ' trades (' + eventRows.length + ' events) to ' + filename);
}

const JOURNAL_PAGE_SIZE = 25; // keeps the DOM light even with thousands of entries

/* Date-range filter resolution. Returns {start, end} as Date objects (end
   exclusive) in Binance/UTC terms, or null for 'all'. Custom range reads
   from state.journalDateFrom/journalDateTo (YYYY-MM-DD strings from the
   date inputs). */
function resolveDateRange(rangeKey){
  const now = binanceNow();
  const startOfToday = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
  const endOfToday = new Date(startOfToday.getTime() + 86400000);
  switch(rangeKey){
    case 'today': return { start: startOfToday, end: endOfToday };
    case 'yesterday': return { start: new Date(startOfToday.getTime()-86400000), end: startOfToday };
    case '7d': return { start: new Date(startOfToday.getTime()-7*86400000), end: endOfToday };
    case '15d': return { start: new Date(startOfToday.getTime()-15*86400000), end: endOfToday };
    case '30d': return { start: new Date(startOfToday.getTime()-30*86400000), end: endOfToday };
    case 'week': { // current calendar week, Sun-based, UTC
      const start = new Date(startOfToday.getTime() - startOfToday.getUTCDay()*86400000);
      return { start: start, end: endOfToday };
    }
    case 'month': return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)), end: endOfToday };
    case 'custom': {
      if (!state.journalDateFrom && !state.journalDateTo) return null;
      const start = state.journalDateFrom ? new Date(state.journalDateFrom + 'T00:00:00Z') : new Date(0);
      const end = state.journalDateTo ? new Date(state.journalDateTo + 'T23:59:59Z') : new Date(8640000000000000);
      return { start: start, end: end };
    }
    default: return null; // 'all'
  }
}

function renderJournal(){
  ensureShell();

  // ── Filter entries ──
  const dateRange = resolveDateRange(state.journalDateRange || 'all');
  const jf = state.journalFilter || 'all';
  const jd = state.journalDirection || 'all';
  const jq = (state.journalSearch || '').toLowerCase();

  let entries = state.journal.filter(function(e){
    // Status / outcome filter
    if (jf !== 'all') {
      const outcome = deriveOutcome(e);
      if (jf === 'active') { if (e.status !== 'active') return false; }
      else if (jf === 'winning') { if (!isWinningTrade(e) || e.status !== 'closed') return false; }
      else if (jf === 'losing') { if (!isLosingTrade(e)) return false; }
      else { if (outcome !== jf) return false; }
    }
    // Direction filter
    if (jd !== 'all' && e.signal !== jd) return false;
    // Date range — only applied to closed trades (active trades always show)
    if (dateRange && e.status !== 'active') {
      if (e._sortTs === undefined) e._sortTs = new Date(e.closedAt || e.loggedAt).getTime();
      if (e._sortTs < dateRange.start.getTime() || e._sortTs >= dateRange.end.getTime()) return false;
    }
    // Text search
    if (jq) {
      const hay = (e.symbol + ' ' + e.signal + ' ' + deriveOutcome(e)).toLowerCase();
      if (hay.indexOf(jq) === -1) return false;
    }
    return true;
  });

  // ── Sort: active first, then newest ──
  entries.sort(function(a, b){
    const ta = a.status === 'active' ? 0 : 1;
    const tb = b.status === 'active' ? 0 : 1;
    if (ta !== tb) return ta - tb;
    const da = new Date(a.closedAt || a.loggedAt).getTime();
    const db = new Date(b.closedAt || b.loggedAt).getTime();
    return db - da;
  });

  // ── Stats ──
  const activeCount  = state.journal.filter(function(e){ return e.status === 'active'; }).length;
  const closedTrades = state.journal.filter(function(e){ return e.status === 'closed'; });
  const wins   = closedTrades.filter(isWinningTrade).length;
  const losses = closedTrades.filter(isLosingTrade).length;
  const winRate = closedTrades.length ? Math.round(wins / closedTrades.length * 100) : null;
  const tp1Count = state.journal.filter(function(e){ return e.tp1Hit; }).length;
  const tp2Count = state.journal.filter(function(e){ return e.tp2Hit; }).length;
  const tp3Count = state.journal.filter(function(e){ return e.tp3Hit; }).length;

  // ── Pagination ──
  const totalMatched = entries.length;
  const totalPages = Math.max(1, Math.ceil(totalMatched / JOURNAL_PAGE_SIZE));
  const page = Math.min(Math.max(1, state.journalPage || 1), totalPages);
  state.journalPage = page;
  const pageEntries = entries.slice((page - 1) * JOURNAL_PAGE_SIZE, page * JOURNAL_PAGE_SIZE);

function journalPaginationHTML(page, totalPages, totalMatched){
  if (totalPages <= 1) return '';
  return '<div class="journal-pagination">' +
    '<button class="page-btn" data-page="' + (page-1) + '"' + (page<=1?' disabled':'') + '>‹ Prev</button>' +
    '<span class="page-info">Page ' + page + ' of ' + totalPages + ' · ' + totalMatched + ' trades</span>' +
    '<button class="page-btn" data-page="' + (page+1) + '"' + (page>=totalPages?' disabled':'') + '>Next ›</button>' +
  '</div>';
}

/* Renders one trade as a Cornix-style live update card: current status
   header, key levels, then the complete chronological event timeline
   (collapsed to the most recent few unless expanded). Nothing here is
   ever destructive — expanding/collapsing only changes what's shown,
   never what's stored. */
function journalCardHTML(e){
  const lev1pct = e.leverageSuggestion && e.leverageSuggestion.tiers ? e.leverageSuggestion.tiers.find(function(t){ return t.riskPct===1; }) : null;
  const outcome = deriveOutcome(e);
  const isLong = e.signal === 'LONG';
  const expanded = state.expandedJournalId === e.id;

  let currentPrice = e.pair ? (state.marketData[e.pair] && state.marketData[e.pair].price) : state.gold.price;
  if (currentPrice == null) currentPrice = e.status==='closed' ? e.exitPrice : e.entryPrice;
  const livePL = e.status === 'active' ? calcPL(e, currentPrice) : (e.exitPrice!=null ? calcPL(e, e.exitPrice) : 0);

  const highestTPHit = e.tp5Hit ? 'TP5' : e.tp4Hit ? 'TP4' : e.tp3Hit ? 'TP3' : e.tp2Hit ? 'TP2' : e.tp1Hit ? 'TP1' : null;
  const holdBadge = e.holding && e.status==='active' ? ' <span class="hold-tag">HOLDING RUNNER</span>' : '';
  const statusBadge = e.status === 'active'
    ? '<span class="lifecycle-badge active">🚀 ACTIVE' + (highestTPHit ? ' · ' + highestTPHit + ' HIT' : '') + '<span class="live-dot" style="margin-left:5px"></span></span>' + holdBadge
    : e.status === 'cancelled' ? '<span class="lifecycle-badge cancelled">❌ CANCELLED</span>'
    : isWinningTrade(e) ? '<span class="lifecycle-badge bull">🏆 WIN' + (e.closeReason==='stopped' ? ' (BE stop)' : e.closeReason==='tp5' ? ' (Full Runner)' : '') + '</span>'
    : '<span class="lifecycle-badge ' + (outcomeClass(outcome)) + '">🔴 LOSS</span>';

  const allEvents = e.events.slice().reverse(); // newest first for display
  const visibleEvents = expanded ? allEvents : allEvents.slice(0, 3);

  const timelineHTML = visibleEvents.map(function(ev){
    return '<div class="timeline-row">' +
      '<div class="timeline-time mono">' + fmtBinanceTime(new Date(ev.at)).slice(0,16) + ' UTC</div>' +
      '<div class="timeline-body">' +
        '<div class="timeline-label">' + ev.emoji + ' ' + esc(ev.label) + (ev.detail ? ' — <span class="timeline-detail">' + esc(ev.detail) + '</span>' : '') + '</div>' +
        (ev.reason ? '<div class="timeline-reason">' + esc(ev.reason) + '</div>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  const summaryHTML = e.status === 'closed' || (e.status === 'cancelled' && e.closeReason !== 'missed' && allEvents.length > 2)
    ? tradeSummaryHTML(e) : '';

  return '<div class="journal-card' + (e.status==='active'?' is-active':'') + (e.holding?' is-holding':'') + '" data-jid="' + e.id + '">' +
    '<div class="jcard-head">' +
      '<div class="jcard-id">' +
        '<span class="jsym-big">' + esc(e.symbol) + (e.aligned ? ' <span class="aligned-badge">✓</span>' : '') + '</span>' +
        '<span class="signal-pill ' + esc(e.signal) + '">' + esc(e.signal) + '</span>' +
        (e.displayId ? '<span class="jdisplay-id mono">' + esc(e.displayId) + '</span>' : '') +
        statusBadge +
      '</div>' +
      '<div class="jcard-price mono">' +
        (e.status==='active' ? (fmtPrice(currentPrice) + ' <span class="' + (livePL>=0?'pl-pos':'pl-neg') + '">(' + (livePL>=0?'+':'') + livePL.toFixed(2) + '%)</span>') :
         e.status==='closed' ? (fmtPrice(e.exitPrice) + ' <span class="' + (livePL>=0?'pl-pos':'pl-neg') + '">(' + (livePL>=0?'+':'') + livePL.toFixed(2) + '%)</span>') :
         fmtPrice(e.entryPrice)) +
      '</div>' +
    '</div>' +
    '<div class="jcard-timing">' +
      '<span class="jtime-item"><span class="jlvl-label">Signal</span><span class="mono">' + fmtBinanceTime(new Date(e.signalGeneratedAt||e.loggedAt)).slice(0,16) + ' UTC</span></span>' +
      (e.tp1HitAt ? '<span class="jtime-item"><span class="jlvl-label tp-time">TP1 hit</span><span class="mono">' + fmtBinanceTime(new Date(e.tp1HitAt)).slice(11,16) + ' UTC</span></span>' : '') +
      (e.tp2HitAt ? '<span class="jtime-item"><span class="jlvl-label tp-time">TP2 hit</span><span class="mono">' + fmtBinanceTime(new Date(e.tp2HitAt)).slice(11,16) + ' UTC</span></span>' : '') +
      (e.tp3HitAt ? '<span class="jtime-item"><span class="jlvl-label tp-time">TP3 hit</span><span class="mono">' + fmtBinanceTime(new Date(e.tp3HitAt)).slice(11,16) + ' UTC</span></span>' : '') +
      (e.tp4HitAt ? '<span class="jtime-item"><span class="jlvl-label tp-time">TP4 hit</span><span class="mono">' + fmtBinanceTime(new Date(e.tp4HitAt)).slice(11,16) + ' UTC</span></span>' : '') +
      (e.tp5HitAt ? '<span class="jtime-item"><span class="jlvl-label tp-time">TP5 hit</span><span class="mono">' + fmtBinanceTime(new Date(e.tp5HitAt)).slice(11,16) + ' UTC</span></span>' : '') +
      (e.closedAt ? '<span class="jtime-item"><span class="jlvl-label">Closed</span><span class="mono">' + fmtDuration(new Date(e.closedAt)-new Date(e.signalGeneratedAt||e.loggedAt)) + '</span></span>' : '') +
    '</div>' +
    '<div class="jcard-levels mono">' +
      '<span class="jlvl"><span class="jlvl-label">Entry</span>' + fmtPrice(e.entryPrice) + '</span>' +
      '<span class="jlvl"><span class="jlvl-label">SL</span><span class="jsl">' + fmtPrice(e.stopLoss) + '</span>' + (e.breakevenSet?' <span class="be-tag">BE</span>':'') + '</span>' +
      '<span class="jlvl"><span class="jlvl-label">TP1</span><span class="jtp' + (e.tp1Hit?' hit':'') + '">' + fmtPrice(e.tp1) + (e.tp1Hit?' ✓':'') + '</span></span>' +
      '<span class="jlvl"><span class="jlvl-label">TP2</span><span class="jtp' + (e.tp2Hit?' hit':'') + '">' + fmtPrice(e.tp2) + (e.tp2Hit?' ✓':'') + '</span></span>' +
      '<span class="jlvl"><span class="jlvl-label">TP3</span><span class="jtp' + (e.tp3Hit?' hit':'') + '">' + fmtPrice(e.tp3) + (e.tp3Hit?' ✓':'') + '</span></span>' +
      '<span class="jlvl"><span class="jlvl-label">TP4</span><span class="jtp' + (e.tp4Hit?' hit':'') + '">' + fmtPrice(e.tp4) + (e.tp4Hit?' ✓':'') + '</span></span>' +
      '<span class="jlvl"><span class="jlvl-label">TP5</span><span class="jtp' + (e.tp5Hit?' hit':'') + '">' + fmtPrice(e.tp5) + (e.tp5Hit?' ✓':'') + '</span></span>' +
      '<span class="jlvl"><span class="jlvl-label">R:R</span>' + esc(e.rr) + '</span>' +
      '<span class="jlvl"><span class="jlvl-label">Lev</span><span class="jlev">' + (e.leverageSuggestion && e.leverageSuggestion.fixedLeverage ? e.leverageSuggestion.fixedLeverage+'x' : '—') + '</span></span>' +
    '</div>' +
    '<div class="jcard-timeline">' + timelineHTML + '</div>' +
    (allEvents.length > 3 ? '<button class="timeline-toggle" data-jid="' + e.id + '">' + (expanded ? '▲ Show less' : '▼ Show full timeline (' + allEvents.length + ' events)') + '</button>' : '') +
    summaryHTML +
    '<div class="jcard-foot">' +
      '<select class="outcome-select ' + outcomeClass(outcome) + '" data-jid="' + e.id + '">' +
        (['open','hit-tp1','hit-tp2','hit-tp3','hit-tp4','hit-tp5','stopped','cancelled'].indexOf(outcome) === -1
          ? '<option value="' + outcome + '" selected disabled>' + (OUTCOME_LABELS[outcome]||outcome) + '</option>'
          : '') +
        ['open','hit-tp1','hit-tp2','hit-tp3','hit-tp4','hit-tp5','stopped','cancelled'].map(function(k){
          return '<option value="' + k + '"' + (outcome===k?' selected':'') + '>' + OUTCOME_LABELS[k] + '</option>';
        }).join('') +
      '</select>' +
      (e.outcomeSetBy==='manual' ? '<span class="manual-tag">manual override</span>' : '') +
      '<span class="source-tag ' + (e.source==='auto'?'auto':'manual') + '">' + (e.source==='auto'?'🤖 auto':'👤 manual') + '</span>' +
      '<button class="share-btn" data-jid="' + e.id + '" title="Copy formatted signal for WhatsApp / Telegram / group">📤 Share</button>' +
    '</div>' +
  '</div>';
}

/* Generates the closing Trade Summary block — pair, direction, entry/exit,
   TPs hit, max drawdown/profit, final %, R-multiple, duration, win/loss,
   closing reason — exactly the fields requested for a completed trade. */
function tradeSummaryHTML(e){
  const finalPL = e.exitPrice != null ? calcPL(e, e.exitPrice) : 0;
  const maxFav = calcPL(e, e.maxFavorablePrice);
  const maxAdv = calcPL(e, e.maxAdversePrice);
  const riskAbs = Math.abs(e.entryPrice - e.originalStopLoss) || 1;
  const rewardAbs = e.exitPrice != null ? Math.abs(e.exitPrice - e.entryPrice) : 0;
  const rMultiple = (rewardAbs / riskAbs) * (finalPL >= 0 ? 1 : -1);
  const durationMs = e.closedAt ? (new Date(e.closedAt) - new Date(e.loggedAt)) : 0;
  const durationStr = fmtDuration(durationMs);
  const tpsHit = [e.tp1Hit&&'TP1', e.tp2Hit&&'TP2', e.tp3Hit&&'TP3', e.tp4Hit&&'TP4', e.tp5Hit&&'TP5'].filter(Boolean).join(', ') || 'None';
  const isWin = isWinningTrade(e);
  return '<div class="trade-summary">' +
    '<div class="trade-summary-title">🏁 Trade Summary</div>' +
    '<div class="ts-grid">' +
      '<div><span class="ts-label">Pair</span>' + esc(e.symbol) + '</div>' +
      '<div><span class="ts-label">Direction</span>' + esc(e.signal) + '</div>' +
      '<div><span class="ts-label">Entry</span>' + fmtPrice(e.entryPrice) + '</div>' +
      '<div><span class="ts-label">Exit</span>' + (e.exitPrice!=null?fmtPrice(e.exitPrice):'—') + '</div>' +
      '<div><span class="ts-label">Stop Loss</span>' + fmtPrice(e.originalStopLoss) + '</div>' +
      '<div><span class="ts-label">TPs Hit</span>' + tpsHit + '</div>' +
      '<div><span class="ts-label">Max Drawdown</span>' + maxAdv.toFixed(2) + '%</div>' +
      '<div><span class="ts-label">Max Profit</span>' + maxFav.toFixed(2) + '%</div>' +
      '<div><span class="ts-label">Final P/L</span><span class="' + (finalPL>=0?'pl-pos':'pl-neg') + '">' + (finalPL>=0?'+':'') + finalPL.toFixed(2) + '%</span></div>' +
      '<div><span class="ts-label">R Multiple</span>' + (rMultiple>=0?'+':'') + rMultiple.toFixed(2) + 'R</div>' +
      '<div><span class="ts-label">Duration</span>' + durationStr + '</div>' +
      '<div><span class="ts-label">Result</span><span class="' + (isWin?'pl-pos':'pl-neg') + '">' + (isWin?'WIN':'LOSS') + '</span></div>' +
    '</div>' +
    '<div class="ts-reason"><span class="ts-label">Closing Reason</span>' + esc(closeReasonLabel(e.closeReason)) + '</div>' +
  '</div>';
}
function closeReasonLabel(reason){
  return ({stopped:'Stop loss hit', tp3:'Closed at TP3 (not held for TP4/TP5)', tp5:'Final TP5 reached — full runner extension', missed:'Entry never filled — price ran away',
    manual:'Manually closed'})[reason] || (reason || 'Manual override');
}
function fmtDuration(ms){
  if (!ms || ms < 0) return '—';
  const mins = Math.floor(ms/60000);
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'h ' + (mins%60) + 'm';
  const days = Math.floor(hrs/24);
  return days + 'd ' + (hrs%24) + 'h';
}

function wireJournalEvents(){
  const c = document.getElementById('tab-content');
  const autoJournalBtn = document.getElementById('auto-journal-toggle');
  if (autoJournalBtn) autoJournalBtn.addEventListener('click', function(){
    state.autoJournal = !state.autoJournal;
    renderJournal();
  });
  const exportBtn = document.getElementById('journal-export-btn');
  if (exportBtn) exportBtn.addEventListener('click', exportJournalToExcel);
  const searchInput = document.getElementById('journal-search');
  if (searchInput) {
    searchInput.addEventListener('input', function(e){
      state.journalSearch = e.target.value;
      const pos = e.target.selectionStart;
      renderJournal();
      const newInput = document.getElementById('journal-search');
      if (newInput) { newInput.focus(); newInput.setSelectionRange(pos,pos); }
    });
  }
  c.querySelectorAll('[data-jfilter]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.journalFilter = btn.getAttribute('data-jfilter'); state.journalPage = 1; renderJournal(); });
  });
  c.querySelectorAll('[data-jstat-filter]').forEach(function(card){
    card.addEventListener('click', function(){ state.journalFilter = card.getAttribute('data-jstat-filter'); state.journalPage = 1; renderJournal(); });
  });
  c.querySelectorAll('[data-jdir]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.journalDirection = btn.getAttribute('data-jdir'); state.journalPage = 1; renderJournal(); });
  });
  const dateRangeSel = document.getElementById('journal-date-range');
  if (dateRangeSel) dateRangeSel.addEventListener('change', function(e){
    state.journalDateRange = e.target.value;
    state.journalPage = 1;
    renderJournal();
  });
  const dateFrom = document.getElementById('journal-date-from');
  if (dateFrom) dateFrom.addEventListener('change', function(e){ state.journalDateFrom = e.target.value; state.journalPage = 1; renderJournal(); });
  const dateTo = document.getElementById('journal-date-to');
  if (dateTo) dateTo.addEventListener('change', function(e){ state.journalDateTo = e.target.value; state.journalPage = 1; renderJournal(); });
  c.querySelectorAll('.page-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const p = parseInt(btn.getAttribute('data-page'), 10);
      if (!isNaN(p)) { state.journalPage = p; renderJournal(); window.scrollTo({top:0, behavior:'smooth'}); }
    });
  });
  const clearBtn = document.getElementById('journal-clear-btn');
  if (clearBtn) clearBtn.addEventListener('click', function(){
    if (state.journal.length && confirm('Clear all ' + state.journal.length + ' logged journal entries? This cannot be undone.')) {
      state.journal = [];
      renderJournal();
    }
  });
  c.querySelectorAll('.timeline-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
      const id = btn.getAttribute('data-jid');
      state.expandedJournalId = state.expandedJournalId === id ? null : id;
      renderJournal();
    });
  });

  // Share buttons
  c.querySelectorAll('.share-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id=btn.getAttribute('data-jid');
      var entry=state.journal.find(function(e){return e.id===id;});
      if(!entry) return;
      showShareModal(entry, entry.status==='active'?'signal':'update');
    });
  });
  c.querySelectorAll('.outcome-select').forEach(function(sel){
    sel.addEventListener('change', function(){
      const id = sel.getAttribute('data-jid');
      const entry = state.journal.find(function(e){ return e.id===id; });
      if (!entry) return;
      const val = sel.value;
      entry.outcomeSetBy = 'manual'; // user took control — auto-tracking won't overwrite this entry anymore
      // Map the manual override back onto the lifecycle fields so deriveOutcome() reflects it consistently.
      if (val === 'open') {
        entry.status = 'active'; // signals always start active now
        entry.closeReason = null; entry.closedAt = null; entry.exitPrice = null;
      } else if (val === 'cancelled') {
        entry.status = 'cancelled'; entry.closeReason = 'manual'; entry.closedAt = binanceNow().toISOString();
        appendEvent(entry, 'ORDER_CANCELLED', null, 'Manually cancelled by user');
      } else if (val === 'stopped') {
        entry.status = 'closed'; entry.closeReason = 'stopped'; entry.closedAt = binanceNow().toISOString();
        entry.exitPrice = entry.stopLoss;
        appendEvent(entry, 'SL_HIT', fmtPrice(entry.stopLoss), 'Manually marked as stopped out');
        appendEvent(entry, 'POSITION_CLOSED', null, 'Trade closed: manual override');
      } else if (val.indexOf('hit-tp') === 0) {
        const n = val.slice(-1);
        entry['tp'+n+'Hit'] = true;
        entry.status = 'closed'; entry.closeReason = 'tp'+n; entry.closedAt = binanceNow().toISOString();
        entry.exitPrice = entry['tp'+n];
        appendEvent(entry, 'TP_HIT', 'TP'+n+' (manual)', 'Manually marked as TP'+n+' hit');
        appendEvent(entry, 'POSITION_CLOSED', null, 'Trade closed: manual override');
      }
      renderJournal();
    });
  });
}

/* ============================================================
   DASHBOARD
   ============================================================ */

/* Sort priority for Ongoing Signals: Active trades before pending orders;
   within active, the trade closest to a TP or SL (in ATR-free % terms)
   surfaces first since that's what needs attention soonest; ties broken
   by most recently opened. This directly implements the requested order:
   Active → Near TP → Near SL → Newly Opened. */
function ongoingSignalPriority(e){
  let currentPrice = e.pair ? (state.marketData[e.pair] && state.marketData[e.pair].price) : state.gold.price;
  if (currentPrice == null) currentPrice = e.entryPrice;
  const isLong = e.signal === 'LONG';

  const distToSLPct = Math.abs(currentPrice - e.stopLoss) / currentPrice * 100;
  const nextTP = !e.tp1Hit ? e.tp1 : !e.tp2Hit ? e.tp2 : !e.tp3Hit ? e.tp3 : !e.tp4Hit ? e.tp4 : e.tp5;
  const distToTPPct = nextTP != null ? Math.abs(nextTP - currentPrice) / currentPrice * 100 : 999;
  const nearest = Math.min(distToSLPct, distToTPPct);

  // status tier: 0 = active (highest priority bucket), 1 = pending
  const statusTier = e.status === 'active' ? 0 : 1;
  return { statusTier: statusTier, nearestDistPct: nearest, loggedAtMs: new Date(e.loggedAt).getTime() };
}
function compareOngoingSignals(a, b){
  const pa = ongoingSignalPriority(a), pb = ongoingSignalPriority(b);
  if (pa.statusTier !== pb.statusTier) return pa.statusTier - pb.statusTier; // active before pending
  if (Math.abs(pa.nearestDistPct - pb.nearestDistPct) > 0.001) return pa.nearestDistPct - pb.nearestDistPct; // nearer TP/SL first
  return pb.loggedAtMs - pa.loggedAtMs; // newest first as final tiebreak
}

/* Animates any element with data-count-to from 0 to its target value —
   real institutional-terminal "rolling numbers" feel, applied to the
   Hero P/L figure. Respects prefers-reduced-motion by jumping straight
   to the final value. */
function animateCountUps(){
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count-to]').forEach(function(el){
    const target = parseFloat(el.getAttribute('data-count-to'));
    if (isNaN(target)) return;
    if (reduceMotion) {
      el.textContent = (target>=0?'+':'') + target.toFixed(2) + '%';
      return;
    }
    const duration = 900, start = performance.now();
    function tick(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      const val = target * eased;
      el.textContent = (val>=0?'+':'') + val.toFixed(2) + '%';
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = (target>=0?'+':'') + target.toFixed(2) + '%';
    }
    requestAnimationFrame(tick);
  });
}

/* Market Regime meter: a coarse circular read of the tracked universe's
   current character (trend vs range, momentum, volatility) derived from
   real analysis structure counts — not a fabricated proprietary index. */
function marketRegimeMeterHTML(){
  const analyzed = Object.values(state.analyses);
  const total = analyzed.length;
  if (total === 0) {
    return '<div class="regime-panel glass"><div class="ai-workflow-title">📐 MARKET REGIME</div>' +
      '<div class="mb-empty">Gathering data — regime read appears once coins are analyzed.</div></div>';
  }
  const trending = analyzed.filter(function(a){ return a.structure==='HH-HL' || a.structure==='LH-LL'; }).length;
  const shifting = analyzed.filter(function(a){ return a.structure && a.structure.indexOf('MSS')===0; }).length;
  const undetermined = total - trending - shifting;
  const trendPct = Math.round(trending/total*100);
  const rangePct = Math.round(undetermined/total*100);
  const volPct = Math.round(shifting/total*100); // structure shifts as a proxy for elevated volatility/regime change
  const bullish = analyzed.filter(function(a){ return a.bias==='Bullish'; }).length;
  const bearish = analyzed.filter(function(a){ return a.bias==='Bearish'; }).length;
  const momentumPct = Math.round(Math.abs(bullish-bearish)/total*100);
  const aligned = analyzed.filter(isAligned).length;
  const liquidityPct = Math.round(aligned/total*100); // confluence rate as a liquidity/quality proxy

  const segments = [
    {label:'Trend', pct:trendPct, color:'var(--bull)'},
    {label:'Range', pct:rangePct, color:'var(--text-dim)'},
    {label:'Structure Shift', pct:volPct, color:'var(--gold)'},
    {label:'Momentum', pct:momentumPct, color:'var(--cyan)'},
    {label:'Confluence', pct:liquidityPct, color:'var(--neon)'},
  ];
  return '<div class="regime-panel glass">' +
    '<div class="ai-workflow-title">📐 MARKET REGIME <span class="regime-sample-note">(' + total + ' pairs analyzed)</span></div>' +
    '<div class="regime-bars">' +
      segments.map(function(s){
        return '<div class="regime-bar-row">' +
          '<span class="regime-bar-label">' + s.label + '</span>' +
          '<div class="regime-bar-track"><div class="regime-bar-fill" style="width:' + s.pct + '%; background:' + s.color + '; box-shadow:0 0 8px ' + s.color + ';"></div></div>' +
          '<span class="regime-bar-pct">' + s.pct + '%</span>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div>';
}

/* Pulls the most recent few events across the whole journal (any trade,
   any event type) into one reverse-chronological feed — a quick-glance
   "what has the AI been doing" summary for the clean dashboard overview,
   without dumping the full per-trade detail here. */
function getRecentActivity(limit){
  const all = [];
  state.journal.forEach(function(e){
    e.events.forEach(function(ev){
      all.push({ at: ev.at, emoji: ev.emoji, label: ev.label, detail: ev.detail, symbol: e.symbol, signal: e.signal });
    });
  });
  all.sort(function(a,b){ return new Date(b.at) - new Date(a.at); });
  return all.slice(0, limit || 8);
}

/* Renders one Ongoing Signal as a premium glass card — every field the
   spec asked for: pair, direction badge, entry, current price, SL, TP

   score, and scanner source. */
function ongoingSignalCardHTML(e){
  let currentPrice = e.pair ? (state.marketData[e.pair] && state.marketData[e.pair].price) : state.gold.price;
  if (currentPrice == null) currentPrice = e.entryPrice;
  const isLong = e.signal === 'LONG';
  const pl = e.status === 'active' ? calcPL(e, currentPrice) : 0;

  // Progress toward the next unhit TP, clamped 0-100, direction-aware.
  const nextTP = !e.tp1Hit ? e.tp1 : !e.tp2Hit ? e.tp2 : !e.tp3Hit ? e.tp3 : !e.tp4Hit ? e.tp4 : e.tp5;
  let progressPct = 0;
  if (e.status === 'active' && nextTP != null) {
    const totalDist = Math.abs(nextTP - e.entryPrice) || 1;
    const covered = isLong ? (currentPrice - e.entryPrice) : (e.entryPrice - currentPrice);
    progressPct = Math.max(0, Math.min(100, (covered / totalDist) * 100));
  }

  const highestTPHitOngoing = e.tp5Hit ? 'TP5' : e.tp4Hit ? 'TP4' : e.tp3Hit ? 'TP3' : e.tp2Hit ? 'TP2' : e.tp1Hit ? 'TP1' : null;

  const confidence = e.biasStrengthAtLog != null ? e.biasStrengthAtLog : 70;
  const timeOpened = fmtBinanceTime(new Date(e.loggedAt)).slice(11,19) + ' UTC';

  return '<div class="signal-card glass" data-jid="' + e.id + '">' +
    '<div class="sc-head">' +
      '<span class="sc-sym">' + esc(e.symbol) + (e.aligned?' <span class="aligned-badge">✓</span>':'') + '</span>' +

      '<div class="sc-price mono">' + fmtPrice(currentPrice) + '</div>' +

    '<div class="sc-levels mono">' +

function renderSignalsTab(){

    return sigFilter==='all' || e.signal===sigFilter;
  }).sort(function(a,b){
    if(sortKey==='newest') return new Date(b.loggedAt)-new Date(a.loggedAt);
    if(sortKey==='confidence') return (b.biasStrengthAtLog||70)-(a.biasStrengthAtLog||70);
    if(sortKey==='near-tp'||sortKey==='near-sl') return compareOngoingSignals(a,b);

      var plA=a.status==='active'?calcPL(a,(state.marketData[a.pair]||{}).price||a.entryPrice):0;
      var plB=b.status==='active'?calcPL(b,(state.marketData[b.pair]||{}).price||b.entryPrice):0;

    return 0;
  });
  var html =
    '<div class="controls-row"><div class="controls-left">'+
      '<div class="filter-pills">'+
        ['all','LONG','SHORT'].map(function(f){
          return '<button class="filter-pill'+(sigFilter===f?' active':'')+'" data-sig-filter="'+f+'">'+f+'</button>';
        }).join('')+

      '<select class="date-range-select" id="signals-sort">'+
        [['newest','Newest First'],['confidence','Highest Confidence'],['near-tp','Nearest TP'],['near-sl','Nearest SL'],['pl','P/L Best First']].map(function(o){
          return '<option value="'+o[0]+'"'+(sortKey===o[0]?' selected':'')+'>'+o[1]+'</option>';
        }).join('')+
      '</select>'+
      '<span class="status-chip">'+filtered.length+' active signals</span>'+

      ? '<div class="empty-state glass">No active signals. Scanner is running continuously — signals appear here automatically.</div>'
      : '<div class="ongoing-signals-grid">'+filtered.map(ongoingSignalCardHTML).join('')+'</div>'
    );
  document.getElementById('tab-content').innerHTML=html;

/* Real order book depth panel — genuine resting bids/asks from Binance
   Futures, a computed bid/ask imbalance ratio, real spread, and real
   funding rate + open interest for the focused symbol. Nothing here is
   simulated; if a fetch hasn't completed yet the panel shows a loading
   shimmer, and if it fails it says so plainly. */
function orderBookPanelHTML(){
  const ob = state.orderBook;
  const sym = state.focusSymbol;
  const fd = state.fundingData[sym];
  const oi = state.openInterestData[sym];
  const md = state.marketData[sym];

  if (ob.loading && ob.symbol !== sym) {
    return '<div class="orderbook-panel glass"><div class="ai-workflow-title">📖 ORDER BOOK — ' + esc(sym) + '</div>' +
      '<div class="loading-shimmer" style="height:180px;"></div></div>';
  }
  if (ob.error || ob.symbol !== sym || !ob.bids.length) {
    return '<div class="orderbook-panel glass"><div class="ai-workflow-title">📖 ORDER BOOK — ' + esc(sym) + '</div>' +
      '<div class="mb-empty">Order book data unavailable — will retry automatically.</div></div>';
  }

  const bids = ob.bids.slice(0, 10), asks = ob.asks.slice(0, 10).slice().reverse();
  const maxQty = Math.max.apply(null, bids.concat(asks).map(function(l){ return l.qty; }).concat([1]));
  const bidTotal = ob.bids.reduce(function(s,l){ return s+l.qty; }, 0);
  const askTotal = ob.asks.reduce(function(s,l){ return s+l.qty; }, 0);
  const imbalancePct = (bidTotal+askTotal) > 0 ? Math.round(bidTotal/(bidTotal+askTotal)*100) : 50;
  const bestBid = ob.bids[0] ? ob.bids[0].price : null;
  const bestAsk = ob.asks[0] ? ob.asks[0].price : null;
  const spread = (bestBid!=null && bestAsk!=null) ? bestAsk - bestBid : null;
  const spreadPct = (spread!=null && bestBid) ? (spread/bestBid*100) : null;

  function rowHTML(l, side){
    const pctOfMax = Math.max(4, (l.qty/maxQty)*100);
    return '<div class="ob-row ob-'+side+'">' +
      '<div class="ob-bar" style="width:'+pctOfMax+'%"></div>' +
      '<span class="ob-price mono">'+fmtPrice(l.price)+'</span>' +
      '<span class="ob-qty mono">'+l.qty.toFixed(3)+'</span>' +
    '</div>';
  }

  return '<div class="orderbook-panel glass">' +
    '<div class="ai-workflow-title">📖 ORDER BOOK — ' + esc(sym) + '<span class="live-dot" style="margin-left:6px"></span></div>' +
    '<div class="ob-microstructure-strip">' +
      '<div class="ob-micro-stat"><span class="jlvl-label">Spread</span><span class="mono">' + (spread!=null?fmtPrice(spread)+' ('+spreadPct.toFixed(3)+'%)':'—') + '</span></div>' +
      '<div class="ob-micro-stat"><span class="jlvl-label">Funding Rate</span><span class="mono ' + (fd && fd.fundingRate>=0?'bull':'bear') + '">' + (fd ? (fd.fundingRate*100>=0?'+':'')+(fd.fundingRate*100).toFixed(4)+'%' : '—') + '</span></div>' +
      '<div class="ob-micro-stat"><span class="jlvl-label">Open Interest</span><span class="mono">' + (oi ? fmtCompactNum(oi.openInterest) + ' ' + sym.replace('USDT','') : '—') + '</span></div>' +
      '<div class="ob-micro-stat"><span class="jlvl-label">Mark Price</span><span class="mono">' + (fd?fmtPrice(fd.markPrice):'—') + '</span></div>' +
    '</div>' +
    '<div class="ob-imbalance-track"><div class="ob-imbalance-fill" style="width:'+imbalancePct+'%"></div>' +
      '<span class="ob-imbalance-label">Bid ' + imbalancePct + '% / Ask ' + (100-imbalancePct) + '%</span>' +
    '</div>' +
    '<div class="ob-columns">' +
      '<div class="ob-col"><div class="ob-col-head bull">BIDS</div>' + bids.map(function(l){ return rowHTML(l,'bid'); }).join('') + '</div>' +
      '<div class="ob-col"><div class="ob-col-head bear">ASKS</div>' + asks.map(function(l){ return rowHTML(l,'ask'); }).join('') + '</div>' +
    '</div>' +
    '<div class="mb-note">Depth: top 10 levels · Source: Binance Futures /fapi/v1/depth · Updated ' + (ob.lastUpdate?fmtBinanceTime(new Date(ob.lastUpdate)).slice(11,19)+' UTC':'—') + '</div>' +
  '</div>';
}

function fmtCompactNum(n){
  if (n>=1e9) return (n/1e9).toFixed(2)+'B';
  if (n>=1e6) return (n/1e6).toFixed(2)+'M';
  if (n>=1e3) return (n/1e3).toFixed(1)+'K';
  return n.toFixed(2);
}

function renderAnalyticsTab(){
  ensureShell();
  var now=binanceNow();
  var sod=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()));
  var sow=new Date(sod.getTime()-sod.getUTCDay()*86400000);
  var som=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1));
  var closed=state.journal.filter(function(e){return e.status==='closed';});
  function plOf(e){return e.exitPrice!=null?calcPL(e,e.exitPrice):0;}
  function stats(cutoff){
    var ts=closed.filter(function(e){return e.closedAt&&new Date(e.closedAt)>=cutoff;});
    var pl=ts.reduce(function(s,e){return s+plOf(e);},0);
    var w=ts.filter(isWinningTrade).length;
    return {count:ts.length,pl:pl,wins:w,wr:ts.length?Math.round(w/ts.length*100):null};
  }
  var td=stats(sod), wk=stats(sow), mo=stats(som), all=stats(new Date(0));
  var rrs=closed.filter(function(e){return e.rr;}).map(function(e){return parseFloat((e.rr||'0').split(':')[1])||0;});
  var avgRR=rrs.length?(rrs.reduce(function(s,v){return s+v;},0)/rrs.length).toFixed(2):null;
  var bySymbol={};
  closed.forEach(function(e){
    if(!bySymbol[e.symbol]) bySymbol[e.symbol]={symbol:e.symbol,pl:0,trades:0};
    bySymbol[e.symbol].pl+=plOf(e); bySymbol[e.symbol].trades++;
  });
  var ranked=Object.values(bySymbol).sort(function(a,b){return b.pl-a.pl;});
  var best5=ranked.slice(0,5), worst5=ranked.slice(-5).reverse();
  var months=[];
  for(var i=5;i>=0;i--){
    var mS=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1));
    var mE=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i+1,1));
    var lab=mS.toLocaleString('default',{month:'short',year:'2-digit',timeZone:'UTC'});

/* Prominent, honest banner explaining what the current win rate actually
   means statistically — this directly addresses "accuracy feels low"
   complaints that are really "I don't have enough trades yet to know
   anything meaningful" complaints in disguise. */
function winRateConfidenceBannerHTML(conf){
  if (!conf) {
    return '<div class="calib-banner glass"><span class="calib-banner-icon">📊</span><div>' +
      '<div class="calib-banner-title">No closed trades yet</div>' +
      '<div class="calib-banner-body">Win rate and accuracy metrics need real closed trades before they mean anything. Let the scanner run and the Journal fill up — even 20-30 closed trades starts to say something statistically real.</div>' +
    '</div></div>';
  }
  const tierCopy = {
    insufficient: { icon:'⚠️', title:'Not enough data yet to judge accuracy', tone:'gold' },
    early: { icon:'📈', title:'Early data — directionally useful, still wide margin of error', tone:'gold' },
    developing: { icon:'📊', title:'Developing sample — getting more reliable', tone:'cyan' },
    established: { icon:'✅', title:'Statistically established sample', tone:'bull' },
  }[conf.reliability];
  return '<div class="calib-banner glass calib-' + tierCopy.tone + '"><span class="calib-banner-icon">' + tierCopy.icon + '</span><div>' +
    '<div class="calib-banner-title">' + tierCopy.title + '</div>' +
    '<div class="calib-banner-body">' + conf.wins + ' wins out of ' + conf.n + ' closed trades = ' + conf.winRatePct + '%. ' +
      'The real 95% confidence range is <strong>' + conf.ciLowPct + '%–' + conf.ciHighPct + '%</strong> — with only ' + conf.n + ' trades, the true win rate could genuinely be anywhere in that range. ' +
      (conf.reliability === 'insufficient' || conf.reliability === 'early'
        ? 'A single win or loss right now swings the percentage a lot — that\'s normal at this sample size, not a sign the engine is broken.'
        : 'This is enough data that the win rate is starting to mean something real.') +
    '</div></div></div>';
}

/* Real calibration table: for each engine confidence bucket, what was
   the ACTUAL win rate of trades logged at that confidence level? This is
   the one chart that can genuinely tell you whether the confidence score
   is doing its job — a well-calibrated engine shows win rate climbing
   as confidence bucket climbs. Buckets with fewer than 3 trades show
   "—" rather than a noisy number. */
function confidenceCalibrationHTML(calibration){
  const anyData = calibration.some(function(b){ return b.n > 0; });
  if (!anyData) {
    return '<div class="empty-state glass">No closed trades with logged confidence scores yet — this table fills in as trades close.</div>';
  }
  const rows = calibration.map(function(b){
    const barPct = b.winRatePct != null ? b.winRatePct : 0;
    return '<div class="calib-row">' +
      '<span class="calib-bucket-label">' + b.label + '</span>' +
      '<div class="calib-bar-track"><div class="calib-bar-fill" style="width:' + barPct + '%"></div></div>' +
      '<span class="calib-result">' + (b.winRatePct != null ? b.winRatePct + '%' : '—') + '</span>' +
      '<span class="calib-n">n=' + b.n + (b.n > 0 && b.n < 3 ? ' (too few)' : '') + '</span>' +
    '</div>';
  }).join('');
  return '<div class="calib-table glass">' + rows +
    '<p class="calib-footnote">If higher confidence buckets don\'t show higher win rates once each has 3+ trades, that\'s the real, measurable signal that the confidence scoring needs recalibrating — not a guess.</p>' +
  '</div>';
}

/* Renders the equity curve (cumulative closed-trade P/L over time) and
   its drawdown shadow as a lightweight inline SVG — no chart library
   dependency, built directly from buildEquityCurve()'s real data points. */
function equityCurveHTML(curve){
  if (curve.length < 2) {
    return '<div class="empty-state glass">Need at least 2 closed trades to draw an equity curve.</div>';
  }
  const w = 100, h = 32; // viewBox units — scales to container via preserveAspectRatio
  const vals = curve.map(function(p){ return p.cumPct; });
  const min = Math.min(0, Math.min.apply(null, vals));
  const max = Math.max(0, Math.max.apply(null, vals));
  const range = (max - min) || 1;
  const stepX = w / (curve.length - 1);
  const pts = curve.map(function(p, i){
    const x = i * stepX;
    const y = h - ((p.cumPct - min) / range) * h;
    return x.toFixed(2) + ',' + y.toFixed(2);
  }).join(' ');
  const zeroY = h - ((0 - min) / range) * h;
  const finalPL = curve[curve.length-1].cumPct;
  const strokeColor = finalPL >= 0 ? 'var(--bull)' : 'var(--bear)';
  const areaPts = pts + ' ' + (w).toFixed(2)+','+zeroY.toFixed(2) + ' 0,'+zeroY.toFixed(2);

  return '<div class="equity-curve-panel glass">' +
    '<svg class="equity-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<line x1="0" y1="' + zeroY.toFixed(2) + '" x2="' + w + '" y2="' + zeroY.toFixed(2) + '" stroke="var(--hairline)" stroke-width="0.3" stroke-dasharray="1,1"/>' +
      '<polygon points="' + areaPts + '" fill="' + strokeColor + '" opacity="0.08"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + strokeColor + '" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>' +
    '</svg>' +
    '<div class="equity-curve-foot">' +
      '<span>Start</span><span class="' + (finalPL>=0?'pl-pos':'pl-neg') + '">Cumulative: ' + (finalPL>=0?'+':'') + finalPL.toFixed(2) + '%</span><span>Now (' + curve.length + ' trades)</span>' +
    '</div>' +
  '</div>';
}

function renderAlertsTab(){
  ensureShell();
  var filter=state.alertsFilter||'all';
  var allAlerts=[];
  state.journal.forEach(function(e){
    e.events.forEach(function(ev){
      var type='signal';
      if(ev.type==='TP_HIT'||ev.type==='FINAL_TP'||ev.type==='PARTIAL_SECURED') type='tp';
      else if(ev.type==='SL_HIT') type='sl';
      else if(ev.type==='STRUCTURE_NOTE') type='structure';
      else if(ev.type==='SIGNAL_RECEIVED'||ev.type==='WAITING_ENTRY') type='scanner';
      allAlerts.push({at:ev.at,emoji:ev.emoji,label:ev.label,detail:ev.detail,symbol:e.symbol,signal:e.signal,type:type});
    });
  });
  allAlerts.sort(function(a,b){return new Date(b.at)-new Date(a.at);});
  var filtered=filter==='all'?allAlerts:allAlerts.filter(function(a){return a.type===filter;});
  var PAGE=40, page=state.alertsPage||1;
  var totalPages=Math.max(1,Math.ceil(filtered.length/PAGE));
  var pageItems=filtered.slice((page-1)*PAGE,page*PAGE);
  var html=
    '<div class="controls-row"><div class="controls-left">'+
      '<div class="filter-pills">'+
        ['all','signal','tp','sl','structure','scanner'].map(function(t){
          return '<button class="filter-pill'+(filter===t?' active':'')+'" data-alert-filter="'+t+'">'+t.toUpperCase()+'</button>';
        }).join('')+
      '</div>'+
      '<span class="status-chip">'+allAlerts.length+' total alerts</span>'+
    '</div></div>'+
    (pageItems.length===0
      ? '<div class="empty-state glass">No alerts yet. Alerts are generated automatically as the scanner finds signals, TP hits, SL hits, and structure changes.</div>'
      : '<div class="activity-feed glass">'+pageItems.map(function(a){
          return '<div class="activity-row">'+
            '<span class="activity-time mono">'+fmtBinanceTime(new Date(a.at)).slice(0,16)+' UTC</span>'+
            '<span class="activity-emoji">'+a.emoji+'</span>'+
            '<span class="alert-type-tag alert-'+a.type+'">'+a.type.toUpperCase()+'</span>'+
            '<span class="activity-text"><strong>'+esc(a.symbol)+'</strong> '+esc(a.label)+(a.detail?' — '+esc(a.detail):'')+'</span>'+
          '</div>';
        }).join('')+'</div>'+
        journalPaginationHTML(page,totalPages,filtered.length).replace(/page-btn/g,'page-btn alert-page')
    );
  document.getElementById('tab-content').innerHTML=html;
  document.querySelectorAll('[data-alert-filter]').forEach(function(btn){
    btn.addEventListener('click',function(){state.alertsFilter=btn.getAttribute('data-alert-filter');state.alertsPage=1;renderAlertsTab();});
  });
  document.querySelectorAll('.alert-page').forEach(function(btn){
    btn.addEventListener('click',function(){
      var p=parseInt(btn.getAttribute('data-page'),10);
      if(!isNaN(p)){state.alertsPage=p;renderAlertsTab();window.scrollTo({top:0,behavior:'smooth'});}
    });
  });
}

function formatSignalForShare(e, mode){
  const lev1 = e.leverageSuggestion&&e.leverageSuggestion.tiers?e.leverageSuggestion.tiers.find(function(t){return t.riskPct===1;}):null;
  const dirEmoji = e.signal==='LONG'?'🟢':'🔴';
  const dir = e.signal==='LONG'?'📈 LONG':'📉 SHORT';
  const time = fmtBinanceTime(new Date(e.signalGeneratedAt||e.loggedAt));
  const outcome = deriveOutcome(e);
  var currentPrice = e.pair?(state.marketData[e.pair]&&state.marketData[e.pair].price):state.gold.price;
  if(currentPrice==null) currentPrice=e.exitPrice||e.entryPrice;
  const livePL = e.status==='active'?calcPL(e,currentPrice):e.exitPrice!=null?calcPL(e,e.exitPrice):null;
  if(!mode||mode==='signal'){
    const lines=[
      '━━━━━━━━━━━━━━━━━━━━━━',
      '⚡ ZENVRA AI — NEW SIGNAL',
      '━━━━━━━━━━━━━━━━━━━━━━',
      '',
      dirEmoji+' '+dir+'  '+e.symbol,
      '',
      '📍 Entry:      '+fmtPrice(e.entryPrice),
      '🛑 Stop Loss:  '+fmtPrice(e.originalStopLoss||e.stopLoss),
      '🎯 TP1:        '+fmtPrice(e.tp1),
      '🎯 TP2:        '+fmtPrice(e.tp2),
      '🎯 TP3:        '+fmtPrice(e.tp3),
      e.tp4!=null?'🎯 TP4:        '+fmtPrice(e.tp4)+' (if trend holds)':null,
      e.tp5!=null?'🎯 TP5:        '+fmtPrice(e.tp5)+' (full runner)':null,
      '',
      '⚖️  R:R:        '+(e.rr||'—'),
      lev1?'📊 Leverage:   '+lev1.leverage+'x fixed  (1% risk | '+lev1.marginPct.toFixed(1)+'% margin)':null,
      '🏛  Model:      '+(e.entryModel||'—'),
      '📐 Structure:  '+structureLabel(e.structure),
      '🧠 AI Conf.:   '+(e.biasStrengthAtLog||'—')+'%',
      '🕐 Session:    '+(e.killZone||'—'),
      e.premiumDiscount?'💹 Zone:       '+e.premiumDiscount:null,
      e.aligned?'✅ ALIGNED — Signal, Structure & HTF all agree':null,
      '',
      '⏰ Signal Time: '+time+' UTC',
      '',
      '━━━━━━━━━━━━━━━━━━━━━━',
      '⚠️ Not financial advice. DYOR.',
      '━━━━━━━━━━━━━━━━━━━━━━',
    ];
    return lines.filter(function(l){return l!==null&&l!==undefined;}).join('\n');
  }
  // update format
  const statusLine=outcome==='stopped'?'🔴 STOPPED OUT':outcome==='hit-tp5'?'🏆 FULL RUNNER — ALL 5 TARGETS HIT':outcome==='hit-tp4'?'🎯 TP4 HIT — holding for TP5':outcome==='hit-tp3'?'🎯 TP3 HIT'+(e.holding?' — HOLDING RUNNER':''):outcome==='hit-tp2'?'🎯 TP2 HIT':outcome==='hit-tp1'?'🎯 TP1 HIT':'🚀 ACTIVE';
  const recent=e.events.slice(-5).map(function(ev){
    return fmtBinanceTime(new Date(ev.at)).slice(11,16)+' UTC  '+ev.emoji+' '+ev.label+(ev.detail?' — '+ev.detail:'');
  }).join('\n');
  const dur=e.closedAt?fmtDuration(new Date(e.closedAt)-new Date(e.signalGeneratedAt||e.loggedAt)):null;
  const lines=[
    '━━━━━━━━━━━━━━━━━━━━━━',
    '📡 ZENVRA AI — TRADE UPDATE',
    '━━━━━━━━━━━━━━━━━━━━━━',
    '',
    dirEmoji+' '+dir+'  '+e.symbol+'  |  '+statusLine,
    '',
    '📍 Entry:      '+fmtPrice(e.entryPrice),
    '💰 Current:    '+fmtPrice(currentPrice)+(livePL!=null?' ('+(livePL>=0?'+':'')+livePL.toFixed(2)+'%)':''),
    '🛑 Stop Loss:  '+fmtPrice(e.stopLoss)+(e.breakevenSet?'  🛡️ Breakeven':''),
    '🎯 TP1:        '+fmtPrice(e.tp1)+(e.tp1Hit?'  ✅ HIT'+(e.tp1HitAt?' @ '+fmtBinanceTime(new Date(e.tp1HitAt)).slice(11,16)+' UTC':''):''),
    '🎯 TP2:        '+fmtPrice(e.tp2)+(e.tp2Hit?'  ✅ HIT'+(e.tp2HitAt?' @ '+fmtBinanceTime(new Date(e.tp2HitAt)).slice(11,16)+' UTC':''):''),
    '🎯 TP3:        '+fmtPrice(e.tp3)+(e.tp3Hit?'  ✅ HIT'+(e.tp3HitAt?' @ '+fmtBinanceTime(new Date(e.tp3HitAt)).slice(11,16)+' UTC':''):''),
    e.tp4!=null?'🎯 TP4:        '+fmtPrice(e.tp4)+(e.tp4Hit?'  ✅ HIT'+(e.tp4HitAt?' @ '+fmtBinanceTime(new Date(e.tp4HitAt)).slice(11,16)+' UTC':''):(e.holding?'  (holding)':'')):null,
    e.tp5!=null?'🎯 TP5:        '+fmtPrice(e.tp5)+(e.tp5Hit?'  ✅ HIT'+(e.tp5HitAt?' @ '+fmtBinanceTime(new Date(e.tp5HitAt)).slice(11,16)+' UTC':''):(e.holding?'  (holding)':'')):null,
    '',
    '⏰ Signal:  '+time.slice(0,16)+' UTC',
    dur?'⏱️  Duration: '+dur:null,
    '',
    '📋 Recent Activity:',
    recent,
    '',
    '━━━━━━━━━━━━━━━━━━━━━━',
    '⚠️ Not financial advice. DYOR.',
    '━━━━━━━━━━━━━━━━━━━━━━',
  ];
  return lines.filter(function(l){return l!==null&&l!==undefined;}).join('\n');
}

let zvhBtcFetching = false;
function zvhEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function zvhPct(n){ if (n==null || !isFinite(n)) return '-'; return (n>=0?'+':'') + n.toFixed(2) + '%'; }
function zvhNow(e){
  if (e.pair && state.marketData[e.pair] && state.marketData[e.pair].price) return state.marketData[e.pair].price;
  if (/XAU|GOLD/i.test(String(e.symbol)) && state.gold && state.gold.price) return state.gold.price;
  return null;
}
function zvhCandles(kl){
  const k = (kl || []).slice(-48);
  if (k.length < 5) return '<div class="zvh-empty">Loading chart…</div>';
  const W = 320, H = 110, pad = 6;
  let hi = -Infinity, lo = Infinity;
  k.forEach(function(c){ hi = Math.max(hi, +c[2]); lo = Math.min(lo, +c[3]); });
  const rng = (hi - lo) || 1, bw = W / k.length;
  const y = function(v){ return pad + (hi - v) / rng * (H - 2 * pad); };
  let out = '';
  k.forEach(function(c, i){
    const o = +c[1], h = +c[2], l = +c[3], cl = +c[4];
    const col = cl >= o ? '#22c55e' : '#ef4444', x = i * bw + bw / 2;
    out += '<line x1="'+x+'" x2="'+x+'" y1="'+y(h)+'" y2="'+y(l)+'" stroke="'+col+'" stroke-width="1.2"/>';
    out += '<rect x="'+(x - bw*0.3)+'" y="'+y(Math.max(o,cl))+'" width="'+(bw*0.6)+'" height="'+Math.max(1.5, Math.abs(y(o)-y(cl)))+'" rx="1" fill="'+col+'"/>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" class="zvh-chart">' + out + '</svg>';
}
