<div id="boot-error" class="boot-error"></div>
<div id="toast" class="toast"></div>
<noscript><div style="padding:40px;color:#E8EAED;font-family:sans-serif;">This app requires JavaScript to be enabled in your browser.</div></noscript>
<div id="root"></div>
<script>
'use strict';

/* Global error visibility — if anything throws during boot, SHOW it
   instead of leaving a blank page. This is the #1 fix for the
   "blank page, no console" failure mode. */
window.addEventListener('error', function(e){
  showBootError('Script error: ' + (e.message || 'unknown') + (e.filename ? ('\nFile: ' + e.filename + ':' + e.lineno) : ''));
});
window.addEventListener('unhandledrejection', function(e){
  showBootError('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
});
function showBootError(msg){
  const el = document.getElementById('boot-error');
  if (!el) return;
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

/* ============================================================
   CONFIG
   ============================================================ */
let COINS = []; // populated dynamically from Binance exchangeInfo at boot — see loadCoinUniverse()
/* ============================================================
   GOLD MARKET HOURS (weekend gap)
   ============================================================ */
/* Spot/futures gold trading closes for the weekend: roughly Friday 21:00
   UTC (NY close) through Sunday 22:00 UTC (Sydney/Asia open). Outside
   that window the "price" from any feed is stale/illiquid, so polling
   and analysis are paused rather than presenting a misleading live read. */
function isGoldWeekendClosed(d){
  d = d || new Date();
  const day = d.getUTCDay(); // 0=Sun..6=Sat
  const hour = d.getUTCHours() + d.getUTCMinutes()/60;
  if (day === 6) return true; // all of Saturday UTC
  if (day === 5 && hour >= 21) return true; // Friday from 21:00 UTC
  if (day === 0 && hour < 22) return true; // Sunday before 22:00 UTC
  return false;
}
function nextGoldOpenLabel(d){
  d = d || new Date();
  const day = d.getUTCDay();
  const hour = d.getUTCHours();
  if (day === 0) { // Sunday
    const hoursLeft = Math.max(0, 22 - (hour + d.getUTCMinutes()/60));
    return 'Opens today ~22:00 UTC (' + (hoursLeft < 1 ? 'under 1 hr' : Math.ceil(hoursLeft) + ' hrs') + ')';
  }
  return 'Opens Sunday ~22:00 UTC';
}

const FAPI_BASE = 'https://fapi.binance.com';

/* Syncs to Binance's server clock so journal timestamps reflect Binance
   time specifically, not just whatever clock the user's device happens to
   have (which can drift, or sit in a different timezone display setting). */
async function syncBinanceServerTime(){
  try {
    const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v1/time', {}, 8000);
    if (!res.ok) throw new Error('bad time response');
    const data = await res.json();
    state.binanceServerTimeOffsetMs = data.serverTime - Date.now();
  } catch (e) {
    state.binanceServerTimeOffsetMs = 0; // fall back to local clock if sync fails
  }
}
function binanceNow(){
  return new Date(Date.now() + state.binanceServerTimeOffsetMs);
}
function fmtBinanceTime(d){
  // YYYY-MM-DD HH:MM:SS UTC — Binance's server clock runs in UTC
  const pad = function(n){ return String(n).padStart(2,'0'); };
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()) + ' ' +
    pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds()) + ' UTC';
}

/* ============================================================
   TRADE JOURNAL
   ============================================================ */
/* Logs a signal/trade setup snapshot into the journal with a Binance-clock
   timestamp. Stores the data needed to review the call later: symbol,
   signal, entry/SL/TP, R:R, structure/HTF confluence, and the leverage/
   margin suggestion that was shown at the time.

   Dedup: if the same symbol already has an OPEN entry with the same
   signal direction and entry price, we don't log a duplicate — repeated
   auto-analysis of an unchanged setup shouldn't flood the journal. A
   genuinely new setup (different entry/SL or a flipped signal) still logs. */
/* ============================================================
   TRADE JOURNAL — ZENVRA AI Trade Tracker
   ============================================================
   Every journal entry is an append-only event timeline, not a single
   overwritable status. `events[]` grows chronologically as the trade
   progresses; `status` is the current lifecycle stage derived from the
   latest event. Nothing already logged is ever edited or removed —
   new information is always a new event appended to the array. */

const EVENT_TYPES = {
  SIGNAL_RECEIVED:   {emoji:'🟢', label:'Signal Received'},
  WAITING_ENTRY:     {emoji:'⏳', label:'Waiting for Entry'},
  ENTRY_FILLED:      {emoji:'✅', label:'Entry Filled'},
  MISSED_ENTRY:      {emoji:'⚠️', label:'Missed Entry'},
  ORDER_CANCELLED:   {emoji:'❌', label:'Order Cancelled'},
  APPROACHING_ENTRY: {emoji:'📍', label:'Price Approaching Entry'},
  TRADE_ACTIVE:      {emoji:'🚀', label:'Trade Activated'},
  BREAKEVEN:         {emoji:'🛡️', label:'Stop Moved to Breakeven'},
  SL_TIGHTENED:      {emoji:'🔒', label:'Stop Loss Tightened'},
  TP_HIT:            {emoji:'🎯', label:'Take Profit Hit'},
  PARTIAL_SECURED:   {emoji:'💰', label:'Partial Profit Secured'},
  FINAL_TP:          {emoji:'🏁', label:'Final Take Profit Hit'},
  SL_HIT:            {emoji:'🔴', label:'Stop Loss Hit'},
  TRAILING_TRIGGERED:{emoji:'📉', label:'Trailing Stop Triggered'},
  CLOSED_EARLY:      {emoji:'⏹️', label:'Closed Early'},
  POSITION_CLOSED:   {emoji:'🏆', label:'Position Closed'},
  STRUCTURE_NOTE:    {emoji:'🔄', label:'Market Structure Update'},
};

function appendEvent(entry, type, detail, reason){
  const def = EVENT_TYPES[type] || {emoji:'•', label:type};
  entry.events.push({
    at: binanceNow().toISOString(),
    type: type,
    emoji: def.emoji,
    label: def.label,
    detail: detail || null,
    reason: reason || null,
  });
}

/* Logs a signal/trade setup as a new journal entry with its first event
   already appended (Signal Received).

   Duplicate / freshness protection (per spec):
   1) If the symbol already has ANY active or pending entry — regardless
      of direction or exact entry price — do not log a second one. Only
      one open setup per symbol at a time; the existing one must close
      first. This is stricter than the previous version, which only
      blocked a near-identical entry price and could let a second signal
      through if price had moved even slightly.
   2) A brand-new signal is checked against the most recently CLOSED
      trade for the same symbol+direction: if the structure classification
      and entry model are identical to that last trade, the new one is
      only accepted once the market has genuinely moved (a materially
      different entry price) — this stops the same stale read from being
      re-logged as if it were a fresh detection immediately after a close. */
function isMaterialSetupChange(symbol, analysis){
  const lastClosedSame = state.journal
    .filter(function(e){ return e.symbol === symbol && e.signal === analysis.signal && e.status !== 'active'; })
    .sort(function(a,b){ return new Date(b.loggedAt) - new Date(a.loggedAt); })[0];
  if (!lastClosedSame) return true; // no prior history for this symbol+direction — inherently fresh
  const sameStructure = lastClosedSame.structure === analysis.structure;
  const sameModel = lastClosedSame.entryModel === analysis.entryModel;
  const entryMoved = Math.abs(analysis.entry - lastClosedSame.entryPrice) > (analysis.entry * 0.003); // >0.3% real price movement
  if (sameStructure && sameModel && !entryMoved) return false; // looks like the same setup being re-served, not a new detection
  return true;
}

/* ============================================================
   FRESH SIGNAL PROTECTION — CENTRAL FIRE GATE
   ============================================================
   Every signal candidate MUST pass through validateSignalBeforeFire()
   before being logged to the journal / shown as a fresh signal. This
   is the ONE place drift, age, entry-zone, and two-phase re-validation
   are enforced — no other code path is allowed to log a signal without
   going through this gate first.

   Flow implemented (per spec):
     CANDIDATE -> VALIDATING -> [PRICE DRIFT CHECK] -> re-analyze if
     needed -> [PHASE-2 FINAL CHECK immediately before firing] -> FIRED
     or SKIPPED, never a silent pass-through of a stale price.

   Returns a result object with one of these statuses:
     FRESH      — drift within warning threshold, fire as-is
     WARNING    — drift above warning but within max-entry threshold,
                  fire but the analysis carries a recorded warning
     STALE      — drift exceeded max-entry threshold; re-analysis was
                  attempted and produced a valid fresh setup — FIRE the
                  NEW setup, never the old one
     EXPIRED    — drift hit the hard-expiry threshold, or signal age
                  exceeded the max, or re-analysis found no valid setup
                  (price moved too far to maintain valid R:R) — SKIPPED,
                  nothing is fired
     CANCELLED  — phase-2 check (immediately before firing) found the
                  price moved further during validation itself — fire
                  is cancelled and must be revalidated from scratch */
async function validateSignalBeforeFire(candidateAnalysis, pair, symbol){
  const log = { symbol: symbol, direction: candidateAnalysis.signal, plannedEntry: candidateAnalysis.entry };

  function driftPercentFor(direction, plannedEntry, currentPrice){
    return direction === 'LONG'
      ? ((currentPrice - plannedEntry) / plannedEntry) * 100
      : ((plannedEntry - currentPrice) / plannedEntry) * 100;
  }

  // ── Signal age check (spec #7) — independent of price drift ──
  const ageMs = Date.now() - (candidateAnalysis._candidateCreatedAt || Date.now());
  const ageSeconds = ageMs / 1000;
  log.signalAgeSec = Math.round(ageSeconds * 10) / 10;
  if (ageSeconds > signalFreshnessConfig.maxSignalAgeSeconds) {
    log.status = 'EXPIRED';
    log.reason = 'Signal candidate exceeded max age (' + log.signalAgeSec + 's > ' + signalFreshnessConfig.maxSignalAgeSeconds + 's) before reaching the fire gate.';
    console.log('[FreshSignal]', log);
    return { status: 'EXPIRED', reason: log.reason, freshAnalysis: null, log: log };
  }

  // ── PHASE 1: live price check + drift calculation (spec #1, #2) ──
  const live1 = await fetchLivePrice(pair);
  if (live1.price == null || !isFinite(live1.price)) {
    log.status = 'EXPIRED';
    log.reason = 'Could not obtain a live price (WS down, REST failed) — refusing to fire blind.';
    console.log('[FreshSignal]', log);
    return { status: 'EXPIRED', reason: log.reason, freshAnalysis: null, log: log };
  }
  const drift1 = driftPercentFor(candidateAnalysis.signal, candidateAnalysis.entry, live1.price);
  log.livePrice = live1.price; log.priceSource = live1.source; log.driftPercent = Math.round(drift1*100)/100;

  // ── Entry zone check (spec #8): if the entry model implies a zone
  //    (FVG/OTE both carry an explicit top/bottom band), treat price
  //    inside that band as valid regardless of the raw drift number —
  //    only treat it as missed once price is genuinely outside the zone. */
  const zone = candidateAnalysis.entryZone; // {low, high} — set by the caller when available (FVG/OTE bands)
  const insideZone = zone && live1.price != null ? (live1.price >= zone.low && live1.price <= zone.high) : null;

  const absDrift = Math.abs(drift1);

  // ── CASE D: hard expiry (spec Case D, >= 1.00%) ──
  if (absDrift >= signalFreshnessConfig.hardExpiryDriftPercent && insideZone !== true) {
    log.status = 'EXPIRED';
    log.reason = 'Price moved ' + (drift1>=0?'+':'') + log.driftPercent + '% since candidate was calculated — hard expiry threshold (' + signalFreshnessConfig.hardExpiryDriftPercent + '%) breached. Running fresh analysis, not chasing the old entry.';
    console.log('[FreshSignal]', log);
    const fresh = await reanalyzeForFreshSignal(pair, symbol, candidateAnalysis.signal);
    return { status: 'EXPIRED', reason: log.reason, freshAnalysis: fresh, log: log };
  }

  // ── CASE C: stale, needs re-analysis (spec Case C, > 0.50%) ──
  if (absDrift > signalFreshnessConfig.maxEntryDriftPercent && insideZone !== true) {
    log.status = 'STALE';
    log.reason = 'Price moved ' + (drift1>=0?'+':'') + log.driftPercent + '% — beyond max entry drift (' + signalFreshnessConfig.maxEntryDriftPercent + '%). Re-analyzing before deciding whether to fire.';
    console.log('[FreshSignal]', log);
    const fresh = await reanalyzeForFreshSignal(pair, symbol, candidateAnalysis.signal);
    if (!fresh) {
      log.status = 'EXPIRED';
      log.reason += ' No valid fresh setup found — SKIPPED, not chasing price.';
      console.log('[FreshSignal]', log);
      return { status: 'EXPIRED', reason: log.reason, freshAnalysis: null, log: log };
    }
    return { status: 'STALE', reason: log.reason, freshAnalysis: fresh, log: log };
  }

  // ── CASE B: warning zone, one extra live re-check (spec Case B, 0.30%-0.50%) ──
  let usedWarningRecheck = false;
  if (absDrift > signalFreshnessConfig.warningDriftPercent && insideZone !== true) {
    usedWarningRecheck = true;
    log.warning = 'Drift ' + (drift1>=0?'+':'') + log.driftPercent + '% exceeds warning threshold (' + signalFreshnessConfig.warningDriftPercent + '%) — performing one additional live-price validation before firing.';
    console.log('[FreshSignal]', log);
    const live1b = await fetchLivePrice(pair);
    const drift1b = driftPercentFor(candidateAnalysis.signal, candidateAnalysis.entry, live1b.price);
    if (Math.abs(drift1b) > signalFreshnessConfig.maxEntryDriftPercent) {
      // Confirmed on re-check — escalate to Case C behavior
      log.status = 'STALE';
      log.reason = 'Re-check confirmed drift ' + (drift1b>=0?'+':'') + (Math.round(drift1b*100)/100) + '% — escalating to re-analysis.';
      console.log('[FreshSignal]', log);
      const fresh = await reanalyzeForFreshSignal(pair, symbol, candidateAnalysis.signal);
      if (!fresh) {
        return { status: 'EXPIRED', reason: log.reason + ' No valid fresh setup found.', freshAnalysis: null, log: log };
      }
      return { status: 'STALE', reason: log.reason, freshAnalysis: fresh, log: log };
    }
    // Re-check came back within tolerance — safe to proceed, recompute R:R stays valid since price re-settled
  }

  // ── PHASE 2: final live check immediately before firing (spec #16) ──
  // Re-fetch one more time — this is deliberately a SEPARATE call from
  // phase 1 above, even though it may return the same cached WS value,
  // because the point is to catch price movement that happens DURING
  // whatever validation work occurred between phase 1 and now.
  const live2 = await fetchLivePrice(pair);
  const drift2 = live2.price != null ? driftPercentFor(candidateAnalysis.signal, candidateAnalysis.entry, live2.price) : drift1;
  const additionalMovement = Math.abs(drift2 - drift1);
  log.phase2LivePrice = live2.price; log.phase2DriftPercent = Math.round(drift2*100)/100; log.additionalMovementBetweenPhases = Math.round(additionalMovement*100)/100;

  if (additionalMovement > signalFreshnessConfig.phase2MaxAdditionalDriftPercent) {
    log.status = 'CANCELLED';
    log.reason = 'Price moved an additional ' + log.additionalMovementBetweenPhases + '% between phase-1 and phase-2 checks — firing cancelled, must revalidate.';
    console.log('[FreshSignal]', log);
    return { status: 'CANCELLED', reason: log.reason, freshAnalysis: null, log: log };
  }

  log.status = usedWarningRecheck ? 'WARNING' : 'FRESH';
  log.reason = usedWarningRecheck
    ? 'Fired with a recorded warning — drift was above the warning threshold but confirmed within tolerance on re-check.'
    : 'Drift within tolerance (' + log.driftPercent + '% <= ' + signalFreshnessConfig.warningDriftPercent + '%) — firing as fresh.';
  console.log('[FreshSignal]', log);
  return { status: log.status, reason: log.reason, freshAnalysis: null, log: log };
}

/* Re-analysis per spec #5 — full recalculation, not a patched-up old
   setup. Reuses the existing analyzeCoin() pipeline (real klines, real
   HTF, real structure/FVG/OTE/displacement/volume, real quality gate)
   since that IS "recalculate indicators, trend, momentum, S/R,
   volatility, entry, SL, TP1-5, R:R, confidence" — analyzeCoin already
   does all of that from scratch on every call. Returns the fresh
   analysis only if it still confirms the SAME direction as the
   original candidate (spec: "revalidate the original LONG/SHORT
   direction") and is not itself a WAIT — otherwise returns null,
   meaning no valid fresh setup exists and the caller must skip. */
async function reanalyzeForFreshSignal(pair, symbol, originalDirection){
  if (state.marketData[pair]) state.marketData[pair].klines = null; // force truly fresh candles, not the cached ones that produced the stale candidate
  await analyzeCoin(pair, symbol);
  const fresh = state.analyses[pair];
  if (!fresh || fresh.signal === 'WAIT') return null; // no valid setup remains — do not chase price
  if (fresh.signal !== originalDirection) return null; // direction itself no longer confirmed — do not force the old bias
  return fresh;
}

/* Human-readable signal display ID per spec section 5:
   #ZENVRA-YYYYMMDD-NNN — a fresh sequence number per UTC day, purely
   additive alongside the existing internal .id (which stays the real
   lookup key everywhere else in the app; changing that format would
   ripple through every place that references it). This ID's only job
   is to give a stale-vs-fresh signal a visibly DIFFERENT identifier
   when re-analysis produces a new setup, matching the spec's example
   of #...-001 expiring and #...-002 replacing it. */
function nextSignalDisplayId(){
  const now = binanceNow();
  const dayStr = now.getUTCFullYear() + String(now.getUTCMonth()+1).padStart(2,'0') + String(now.getUTCDate()).padStart(2,'0');
  if (state._signalIdCounter.day !== dayStr) {
    state._signalIdCounter.day = dayStr;
    state._signalIdCounter.n = 0;
  }
  state._signalIdCounter.n++;
  return '#ZENVRA-' + dayStr + '-' + String(state._signalIdCounter.n).padStart(3,'0');
}

function logSetupToJournal(symbol, pair, analysis, source){
  const anyActiveForSymbol = state.journal.find(function(e){
    return e.symbol === symbol && (e.status === 'pending' || e.status === 'active');
  });
  if (anyActiveForSymbol) return anyActiveForSymbol; // this symbol already has an open setup — must close before a new one is logged

  if (!isMaterialSetupChange(symbol, analysis)) return null; // not materially different from the last closed setup — don't log a recycled signal

  const entry = {
    id: 'jrn_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
    displayId: nextSignalDisplayId(), // human-readable #ZENVRA-YYYYMMDD-NNN form, per Fresh Signal spec — the internal .id above remains the real lookup key, unchanged
    loggedAt: binanceNow().toISOString(),
    signalGeneratedAt: binanceNow().toISOString(),
    isFreshSignal: true, // every logged signal is, by construction, freshly analyzed at log time — see isMaterialSetupChange() gate above
    tp1HitAt: null, tp2HitAt: null, tp3HitAt: null, tp4HitAt: null, tp5HitAt: null,
    symbol: symbol,
    pair: pair || null,
    signal: analysis.signal,
    bias: analysis.bias,
    structure: analysis.structure,
    htfAgrees: analysis.htfAgrees,
    aligned: isAligned(analysis),
    entryModel: analysis.entryModel,
    entryPrice: analysis.entry,
    stopLoss: analysis.stopLoss,
    originalStopLoss: analysis.stopLoss, // preserved even after breakeven/tightening moves the live stopLoss
    tp1: analysis.tp1, tp2: analysis.tp2, tp3: analysis.tp3, tp4: analysis.tp4, tp5: analysis.tp5,
    holdGuidanceAtLog: analysis.holdGuidance || null, // the hold-vs-close read captured at signal time, for reference
    premiumDiscount: analysis.premiumDiscount || null,
    volumeConfirmedAtLog: !!analysis.volumeConfirmed,
    rr: analysis.rr,
    leverageSuggestion: analysis.leverageSuggestion || null,
    biasStrengthAtLog: analysis.biasStrength != null ? Math.round(analysis.biasStrength) : null, // confidence/AI score, captured at signal time
    killZone: getActiveKZNow().label,
    source: source || 'manual', // 'manual' = user tapped Log to Journal, 'auto' = auto-logged on signal detection
    outcomeSetBy: 'auto', // 'manual' once the user overrides via the dropdown — protects the entry from further auto-tracking
    status: 'active', // active | closed | cancelled  (signals start active — market execution at detection time)
    breakevenSet: false,
    tp1Hit: false, tp2Hit: false, tp3Hit: false, tp4Hit: false, tp5Hit: false,
    holding: false, // true once TP3 hit AND the engine chose to hold the runner toward TP4/TP5 instead of closing
    maxFavorablePrice: analysis.entry, // best price seen in the trade's favor, for max-profit/drawdown stats
    maxAdversePrice: analysis.entry,
    closeReason: null,
    closedAt: null,
    exitPrice: null,
    events: [],
  };
  appendEvent(entry, 'SIGNAL_RECEIVED',
    entry.signal + ' ' + entry.symbol + ' @ ' + fmtPrice(entry.entryPrice) + ' (' + entry.entryModel + ')',
    entry.structure + ' · HTF ' + (entry.htfAgrees?'aligned':'mixed') + ' · ' + entry.killZone + ' · AI ' + (entry.biasStrengthAtLog||'—') + '% · ' + (entry.premiumDiscount||'—'));
  appendEvent(entry, 'ENTRY_FILLED',
    'Executed @ ' + fmtPrice(entry.entryPrice),
    'Signal detected — entry treated as market-executed at current price');
  appendEvent(entry, 'TRADE_ACTIVE',
    'SL ' + fmtPrice(entry.stopLoss) + ' | TP1 ' + fmtPrice(entry.tp1) + ' | TP2 ' + fmtPrice(entry.tp2) + ' | TP3 ' + fmtPrice(entry.tp3) + ' | TP4 ' + fmtPrice(entry.tp4) + ' | TP5 ' + fmtPrice(entry.tp5),
    'Monitoring active — checked every ' + (REFRESH_MS/1000) + 's');

  state.journal.unshift(entry); // newest first
  pruneJournalToRetention();
  return entry;
}

/* outcome is kept as a derived read-only label for backward-compatible
   filtering/export — always computed from status + latest event, never
   stored or edited directly.

   BUG FIX: previously this only reported 'hit-tp1'/'hit-tp2'/'hit-tp3' for
   CLOSED trades — an active trade that had already hit TP1 (with the
   remainder still running toward TP2/TP3) was reported as plain 'open',
   so it never matched the TP1/TP2/TP3 filter pills or showed a hit
   badge until the whole trade eventually closed. TP-hit status is now
   read from the tp1Hit/tp2Hit/tp3Hit flags directly, independent of
   whether the trade has closed yet — an active trade reports its
   highest TP hit so far, with '(live)' distinguished from a closed
   trade's final outcome by e.status elsewhere in the UI. */
function deriveOutcome(e){
  if (e.status === 'cancelled') return 'cancelled';
  if (e.status === 'closed' && e.closeReason === 'stopped') return 'stopped';
  if (e.tp5Hit) return 'hit-tp5';
  if (e.tp4Hit) return 'hit-tp4';
  if (e.tp3Hit) return 'hit-tp3';
  if (e.tp2Hit) return 'hit-tp2';
  if (e.tp1Hit) return 'hit-tp1';
  if (e.status === 'active') return 'open';
  if (e.status === 'closed') return 'closed';
  return 'open';
}

/* A trade counts as a WIN the moment it hits any take-profit level — TP1,
   TP2, or TP3 — regardless of how it eventually closes. This matters
   because a common ICT/SMC outcome is: TP1 hits, stop moves to breakeven,
   then price reverses and stops the remainder at breakeven. The final
   exit P/L in that case is ~0%, and closeReason reads "stopped", but the
   trade was still a genuine win — partial profit was locked in and the
   loser-only outcome was avoided entirely. Classifying by exit P/L sign
   alone (the old approach) miscounted these as losses.

   IMPORTANT (per spec): an ACTIVE trade is NEVER counted as a win or
   loss, even if it has already hit a TP — only a CLOSED trade's final
   result counts. Every current call site already pre-filters to closed
   trades before calling this, but the check is enforced here directly
   too so a future caller can't accidentally leak an active trade's
   in-progress TP hit into the win/loss statistics. */
function isWinningTrade(e){
  if (e.status !== 'closed') return false;
  return !!(e.tp1Hit || e.tp2Hit || e.tp3Hit || e.tp4Hit || e.tp5Hit);
}
/* A trade only counts as a pure loss if it closed via stop-loss AND never
   touched any TP level first. Also enforces closed-only, per spec. */
function isLosingTrade(e){
  return e.status === 'closed' && e.closeReason === 'stopped' && !isWinningTrade(e);
}

/* Retention policy, split by trade status — this matters because the
   two have fundamentally different lifetimes:
     - An ACTIVE trade must NEVER be pruned by age. It has to stay in
       the journal and keep being tracked until it genuinely closes —
       hits a TP, hits SL, or is cancelled. A trade sitting active for
       4 days is not stale data to garbage-collect, it's a live position.
     - A CLOSED (or cancelled) trade is historical record once it's
       done, and doesn't need to live forever — kept for a much shorter
       window (default 3 days) so the journal doesn't grow unbounded,
       while still leaving enough history to review recent performance.
   Previously a single 90-day cutoff applied to everything regardless of
   status, which is far longer than needed for closed trades and, more
   importantly, gave no special protection to active ones — an active
   trade would only have been pruned once it aged past 90 days, which
   in practice never happened, but the logic didn't actually GUARANTEE
   that the way it does now. */
const CLOSED_TRADE_RETENTION_MS = 3 * 24 * 60 * 60 * 1000; // 3 days for closed/cancelled trades — adjustable via state.closedRetentionDays
function pruneJournalToRetention(){
  const retentionMs = (state.closedRetentionDays || 3) * 24 * 60 * 60 * 1000;
  const cutoff = Date.now() - retentionMs;
  const before = state.journal.length;
  state.journal = state.journal.filter(function(e){
    if (e.status === 'active') return true; // NEVER pruned by age — only removed by actually closing
    const referenceTime = e.closedAt ? new Date(e.closedAt).getTime() : new Date(e.loggedAt).getTime();
    return referenceTime >= cutoff;
  });
  return before - state.journal.length; // number pruned
}

/* ============================================================
   AUTONOMOUS TRADE MONITORING
   ============================================================
   Runs every refresh cycle against every pending/active journal entry.
   This is the core "continuously monitor and update" loop: it checks
   live price against entry/SL/TP/breakeven thresholds AND re-derives a
   coarse market-structure read for the symbol, appending a reasoned
   event any time something material changes. Manual overrides
   (outcomeSetBy === 'manual') stop this loop from touching that entry. */
function autoTrackJournalOutcomes(){
  let changed = false;
  state.journal.forEach(function(e){
    if (e.status === 'closed' || e.status === 'cancelled') return; // nothing left to track
    if (e.outcomeSetBy === 'manual') return; // respect user override

    let currentPrice = null;
    let liveKlines = null;
    if (e.pair) {
      const md = state.marketData[e.pair];
      if (md && md.price) currentPrice = md.price;
      if (md && md.klines) liveKlines = md.klines;
    } else {
      if (state.gold.price) currentPrice = state.gold.price;
      if (state.gold.history && state.gold.history.length) {
        liveKlines = null; // gold doesn't have OHLC klines, only polled closes — structure re-check skipped for gold
      }
    }
    if (currentPrice == null) return; // no live price yet — leave as-is

    const isLong = e.signal === 'LONG';

    // All signals start as 'active' (market-executed at detection time).
    // There is no pending/limit-order stage — this eliminates the bug
    // where every signal was immediately marked "missed entry".

    // ---- Active trade — TP/SL/breakeven/structure tracking ----
    if (e.status === 'active') {
      // Track running max favorable/adverse excursion for the final summary's drawdown/max-profit stats
      if (isLong ? currentPrice > e.maxFavorablePrice : currentPrice < e.maxFavorablePrice) e.maxFavorablePrice = currentPrice;
      if (isLong ? currentPrice < e.maxAdversePrice : currentPrice > e.maxAdversePrice) e.maxAdversePrice = currentPrice;

      // SL check first — risk management priority
      if (isLong ? currentPrice <= e.stopLoss : currentPrice >= e.stopLoss) {
        e.status = 'closed'; e.closeReason = 'stopped';
        e.closedAt = binanceNow().toISOString(); e.exitPrice = e.stopLoss;
        const dur = fmtDuration(new Date(e.closedAt) - new Date(e.signalGeneratedAt||e.loggedAt));
        appendEvent(e, 'SL_HIT',
          fmtPrice(e.stopLoss) + ' @ ' + fmtBinanceTime(binanceNow()).slice(11,16) + ' UTC',
          (e.breakevenSet ? 'Stopped at breakeven — no net loss' : 'Stop loss reached') + ' · Duration: ' + dur);
        appendEvent(e, 'POSITION_CLOSED', 'Closed @ ' + fmtPrice(e.stopLoss) + ' · ' + dur, 'Trade closed: stop loss');
        changed = true; return;
      }

      // TP1 → partial + breakeven
      if (!e.tp1Hit && e.tp1 != null && (isLong ? currentPrice >= e.tp1 : currentPrice <= e.tp1)) {
        e.tp1Hit = true; e.tp1HitAt = binanceNow().toISOString();
        const pl1 = calcPL(e, e.tp1);
        const dur1 = fmtDuration(new Date(e.tp1HitAt) - new Date(e.signalGeneratedAt||e.loggedAt));
        appendEvent(e, 'TP_HIT',
          'TP1 @ ' + fmtPrice(e.tp1) + ' · ' + fmtBinanceTime(new Date(e.tp1HitAt)).slice(11,16) + ' UTC · P/L: ' + (pl1>=0?'+':'') + pl1.toFixed(2) + '%',
          '~33% position closed · Duration to TP1: ' + dur1);
        appendEvent(e, 'PARTIAL_SECURED', '~33% at TP1', 'First scale-out per plan');
        if (!e.breakevenSet) {
          e.breakevenSet = true; e.stopLoss = e.entryPrice;
          appendEvent(e, 'BREAKEVEN', 'Stop → ' + fmtPrice(e.entryPrice), 'Risk-free — remaining position has zero downside');
        }
        changed = true;
      }
      // TP2
      if (!e.tp2Hit && e.tp2 != null && (isLong ? currentPrice >= e.tp2 : currentPrice <= e.tp2)) {
        e.tp2Hit = true; e.tp2HitAt = binanceNow().toISOString();
        const pl2 = calcPL(e, e.tp2);
        const dur2 = fmtDuration(new Date(e.tp2HitAt) - new Date(e.signalGeneratedAt||e.loggedAt));
        appendEvent(e, 'TP_HIT',
          'TP2 @ ' + fmtPrice(e.tp2) + ' · ' + fmtBinanceTime(new Date(e.tp2HitAt)).slice(11,16) + ' UTC · P/L: ' + (pl2>=0?'+':'') + pl2.toFixed(2) + '%',
          '~33% position closed · Duration to TP2: ' + dur2);
        appendEvent(e, 'PARTIAL_SECURED', '~33% at TP2', 'Second scale-out per plan');
        if (e.tp1 != null) {
          const tightened = isLong ? Math.max(e.stopLoss, e.tp1) : Math.min(e.stopLoss, e.tp1);
          if (tightened !== e.stopLoss) {
            e.stopLoss = tightened;
            appendEvent(e, 'SL_TIGHTENED', 'Stop → TP1 level ' + fmtPrice(e.stopLoss), 'Locks in TP1 profit on remaining position');
          }
        }
        changed = true;
      }
      // TP3 → re-evaluate LIVE (not the stale signal-time read) whether
      // to hold the runner toward TP4/TP5 or take full profit here. Needs
      // fresh klines to re-check structure/HTF/volume; if unavailable
      // (e.g. gold), default to closing at TP3 — the safer choice when
      // the engine can't re-verify its own hold conditions live.
      if (!e.tp3Hit && e.tp3 != null && (isLong ? currentPrice >= e.tp3 : currentPrice <= e.tp3)) {
        e.tp3Hit = true; e.tp3HitAt = binanceNow().toISOString();
        const pl3 = calcPL(e, e.tp3);
        const dur3 = fmtDuration(new Date(e.tp3HitAt) - new Date(e.signalGeneratedAt||e.loggedAt));
        appendEvent(e, 'TP_HIT',
          'TP3 @ ' + fmtPrice(e.tp3) + ' · ' + fmtBinanceTime(new Date(e.tp3HitAt)).slice(11,16) + ' UTC · P/L: ' + (pl3>=0?'+':'') + pl3.toFixed(2) + '%',
          '~33% position closed · Duration to TP3: ' + dur3);
        appendEvent(e, 'PARTIAL_SECURED', '~33% at TP3', 'Third scale-out per plan');

        let liveHoldOk = false;
        if (liveKlines && liveKlines.length > 30) {
          try {
            const fresh = computeScaffold(liveKlines, currentPrice);
            const structureStillAgrees = isLong
              ? (fresh.structure === 'HH-HL' || fresh.structure === 'MSS-Bullish-Break')
              : (fresh.structure === 'LH-LL' || fresh.structure === 'MSS-Bearish-Break');
            const htfStillAgrees = fresh.htfBias === (isLong ? 'Bullish' : 'Bearish');
            liveHoldOk = structureStillAgrees && htfStillAgrees && fresh.volumeConfirmed;
          } catch(err) { liveHoldOk = false; }
        }

        if (liveHoldOk && e.tp4 != null) {
          e.holding = true;
          const tightened = isLong ? Math.max(e.stopLoss, e.tp2) : Math.min(e.stopLoss, e.tp2);
          if (tightened !== e.stopLoss) e.stopLoss = tightened;
          appendEvent(e, 'STRUCTURE_NOTE',
            'HOLD — structure, HTF, and volume still confirm the ' + e.signal,
            'Trend intact after TP3: trailing stop to TP2 (' + fmtPrice(e.stopLoss) + ') and holding the runner toward TP4/TP5 instead of closing');
          changed = true;
          // do NOT return — trade stays active, continues to TP4/TP5 checks below
        } else {
          e.status = 'closed'; e.closeReason = 'tp3';
          e.closedAt = e.tp3HitAt; e.exitPrice = e.tp3;
          appendEvent(e, 'FINAL_TP', 'Full profit taken at TP3', liveKlines ? 'Hold conditions not confirmed live — closing rather than risking the runner' : 'No live structure data to re-verify a hold — closing at TP3 by default');
          appendEvent(e, 'POSITION_CLOSED', 'Closed @ ' + fmtPrice(e.tp3) + ' · ' + dur3, 'Trade closed: TP3 (full profit, not held)');
          changed = true; return;
        }
      }

      // TP4 — only reachable if the trade is holding past TP3
      if (e.holding && !e.tp4Hit && e.tp4 != null && (isLong ? currentPrice >= e.tp4 : currentPrice <= e.tp4)) {
        e.tp4Hit = true; e.tp4HitAt = binanceNow().toISOString();
        const pl4 = calcPL(e, e.tp4);
        appendEvent(e, 'TP_HIT',
          'TP4 @ ' + fmtPrice(e.tp4) + ' · ' + fmtBinanceTime(new Date(e.tp4HitAt)).slice(11,16) + ' UTC · P/L: ' + (pl4>=0?'+':'') + pl4.toFixed(2) + '%',
          'Runner extending — ~25% of remainder closed at TP4');
        const tightened4 = isLong ? Math.max(e.stopLoss, e.tp3) : Math.min(e.stopLoss, e.tp3);
        if (tightened4 !== e.stopLoss) {
          e.stopLoss = tightened4;
          appendEvent(e, 'SL_TIGHTENED', 'Stop → TP3 level ' + fmtPrice(e.stopLoss), 'Locks in TP3 profit on the final runner toward TP5');
        }
        changed = true;
      }
      // TP5 — final target, closes the trade
      if (e.holding && !e.tp5Hit && e.tp5 != null && (isLong ? currentPrice >= e.tp5 : currentPrice <= e.tp5)) {
        e.tp5Hit = true; e.tp5HitAt = binanceNow().toISOString();
        const pl5 = calcPL(e, e.tp5);
        e.status = 'closed'; e.closeReason = 'tp5';
        e.closedAt = e.tp5HitAt; e.exitPrice = e.tp5;
        const dur5 = fmtDuration(new Date(e.tp5HitAt) - new Date(e.signalGeneratedAt||e.loggedAt));
        appendEvent(e, 'TP_HIT',
          'TP5 @ ' + fmtPrice(e.tp5) + ' · ' + fmtBinanceTime(new Date(e.tp5HitAt)).slice(11,16) + ' UTC · Final P/L: ' + (pl5>=0?'+':'') + pl5.toFixed(2) + '%',
          'Final runner target reached · Total duration: ' + dur5);
        appendEvent(e, 'FINAL_TP', 'All 5 targets hit — full position closed', 'TP5 complete, maximum extension of the held runner');
        appendEvent(e, 'POSITION_CLOSED', 'Closed @ ' + fmtPrice(e.tp5) + ' · ' + dur5, 'Trade closed: final TP5');
        changed = true; return;
      }

      // Lightweight structure re-check on active trades with live klines:
      // if the symbol's structure has flipped against the trade direction
      // since entry, flag it as a reasoned note (does not auto-close —
      // mirrors "explain why" requirement without overriding the user's
      // own TP/SL plan).
      if (liveKlines && liveKlines.length > 30) {
        try {
          const freshScaffold = computeScaffold(liveKlines, currentPrice);
          const structureNowAdverse = isLong
            ? (freshScaffold.structure === 'LH-LL' || freshScaffold.structure === 'MSS-Bearish-Break')
            : (freshScaffold.structure === 'HH-HL' || freshScaffold.structure === 'MSS-Bullish-Break');
          if (structureNowAdverse && !e.structureWarningGiven) {
            e.structureWarningGiven = true;
            appendEvent(e, 'STRUCTURE_NOTE', freshScaffold.structure, 'Structure has shifted against the original ' + e.signal + ' bias — consider tightening risk manually; trade left open per existing TP/SL plan');
            changed = true;
          } else if (!structureNowAdverse) {
            e.structureWarningGiven = false; // structure recovered — allow a fresh warning if it flips again later
          }
        } catch(err) { /* structure re-check is best-effort, never block tracking on it */ }
      }
    }
  });
  if (changed && state.tab === 'journal') renderJournal();
  return changed;
}

/* % P/L from entry to a given price, direction-aware. */
function calcPL(entry, atPrice){
  const isLong = entry.signal === 'LONG';
  return isLong
    ? ((atPrice - entry.entryPrice) / entry.entryPrice) * 100
    : ((entry.entryPrice - atPrice) / entry.entryPrice) * 100;
}

/* ============================================================
   INSTITUTIONAL PERFORMANCE METRICS
   ============================================================
   Every number below is computed directly from the trades actually
   logged in state.journal — nothing here is simulated or assumed. With
   too few closed trades some of these (especially Sharpe) are
   statistically meaningless, so each figure is paired with a sample-size
   check and the UI shows "insufficient data" rather than a misleading
   number when the trade count is too low. */

function closedTradesWithPL(){
  return state.journal
    .filter(function(e){ return e.status === 'closed' && e.exitPrice != null; })
    .map(function(e){ return { entry: e, pl: calcPL(e, e.exitPrice) }; });
}

/* R-multiple: realized P/L expressed as a multiple of the ORIGINAL risk
   (entry-to-stop distance). +2R means the trade made twice what was risked. */
function rMultipleOf(e){
  const riskAbs = Math.abs(e.entryPrice - e.originalStopLoss) || (e.entryPrice * 0.001);
  const realizedAbs = e.exitPrice != null ? Math.abs(e.exitPrice - e.entryPrice) : 0;
  const pl = calcPL(e, e.exitPrice != null ? e.exitPrice : e.entryPrice);
  return (realizedAbs / riskAbs) * (pl >= 0 ? 1 : -1);
}

/* Profit Factor = gross profit / gross loss. >1 means the system is net
   profitable; industry convention treats >1.5 as solid, >2 as strong.
   Returns null if there's no loss data yet (undefined ratio) or no trades. */
function computeProfitFactor(){
  const trades = closedTradesWithPL();
  if (trades.length === 0) return null;
  const grossProfit = trades.filter(function(t){ return t.pl > 0; }).reduce(function(s,t){ return s+t.pl; }, 0);
  const grossLoss = Math.abs(trades.filter(function(t){ return t.pl < 0; }).reduce(function(s,t){ return s+t.pl; }, 0));
  if (grossLoss === 0) return grossProfit > 0 ? Infinity : null;
  return grossProfit / grossLoss;
}

/* Expectancy = average P/L per trade (in %). The single most honest
   "is this system worth trading" number. */
function computeExpectancy(){
  const trades = closedTradesWithPL();
  if (trades.length === 0) return null;
  return trades.reduce(function(s,t){ return s+t.pl; }, 0) / trades.length;
}

/* ============================================================
   WIN-RATE STATISTICAL CONFIDENCE
   ============================================================
   A raw win-rate percentage is meaningless without knowing how many
   trades it's based on — 1/3 (33%) and 100/300 (33%) look identical as
   a bare number but carry wildly different confidence. This computes a
   real Wilson score confidence interval (the standard method for
   proportions with small samples — more honest than a normal
   approximation when n is small) so the UI can show something like
   "33% (n=3, 95% CI: 6%–79%)" instead of a bare, misleading percentage.
   Also returns a plain-language reliability tier so it's legible at a
   glance without needing to parse a confidence interval. */
function computeWinRateConfidence(){
  const closed = state.journal.filter(function(e){ return e.status === 'closed'; });
  const n = closed.length;
  if (n === 0) return null;
  const wins = closed.filter(isWinningTrade).length;
  const p = wins / n;
  // Wilson score interval, 95% confidence (z = 1.96)
  const z = 1.96;
  const denom = 1 + (z*z)/n;
  const center = p + (z*z)/(2*n);
  const margin = z * Math.sqrt((p*(1-p))/n + (z*z)/(4*n*n));
  const low = Math.max(0, (center - margin) / denom);
  const high = Math.min(1, (center + margin) / denom);
  let reliability;
  if (n < 10) reliability = 'insufficient';       // not enough data to trust the number at all
  else if (n < 30) reliability = 'early';          // directionally useful, still wide error bars
  else if (n < 100) reliability = 'developing';    // reasonably informative
  else reliability = 'established';                 // statistically solid
  return {
    n: n, wins: wins, winRatePct: Math.round(p*100),
    ciLowPct: Math.round(low*100), ciHighPct: Math.round(high*100),
    reliability: reliability,
  };
}

/* ============================================================
   SPEC-EXACT PERFORMANCE SUMMARY
   ============================================================
   Computes every figure the performance-dashboard spec calls for, using
   only real, stored signal history — never projected/unrealized values:
     Total Signals, Active Signals, Completed Signals, Winning Signals,
     Losing Signals, Win Ratio %, Loss Ratio %, Total Realized Profit %,
     Total Realized Loss %, Net Performance %.
   Rules enforced: active trades excluded from win/loss and from realized
   P/L; cancelled/invalidated trades excluded from win/loss ratios (but
   still counted in Total Signals, since they are real recorded signals);
   nothing here is ever double-counted since each journal entry
   contributes to exactly one bucket based on its current, single status. */
function computeSpecPerformanceSummary(){
  const all = state.journal;
  const totalSignals = all.length;
  const active = all.filter(function(e){ return e.status === 'active'; }).length;
  const cancelled = all.filter(function(e){ return e.status === 'cancelled'; }).length;
  const closed = all.filter(function(e){ return e.status === 'closed'; });
  const completed = closed.length;
  const wins = closed.filter(isWinningTrade).length;
  const losses = closed.filter(isLosingTrade).length;
  // A closed trade that isn't a clean win (any TP hit) or a clean loss
  // (stopped with no TP hit) doesn't exist under this engine's own status
  // model today, but the check is kept explicit rather than assuming
  // wins+losses always equals completed, so the arithmetic stays honest
  // even if a new close reason is added later.
  const unclassifiedClosed = completed - wins - losses;
  const winRatioPct = completed > 0 ? (wins / completed * 100) : null;
  const lossRatioPct = completed > 0 ? (losses / completed * 100) : null;
  // Realized profit/loss: ONLY from closed trades' actual exit price —
  // never from projected TP levels or from trades still active.
  const realizedProfitPct = closed.reduce(function(s, e){
    if (e.exitPrice == null) return s;
    const pl = calcPL(e, e.exitPrice);
    return s + (pl > 0 ? pl : 0);
  }, 0);
  const realizedLossPct = closed.reduce(function(s, e){
    if (e.exitPrice == null) return s;
    const pl = calcPL(e, e.exitPrice);
    return s + (pl < 0 ? Math.abs(pl) : 0);
  }, 0);
  const netPerformancePct = realizedProfitPct - realizedLossPct;
  return {
    totalSignals: totalSignals, activeSignals: active, cancelledSignals: cancelled,
    completedSignals: completed, winningSignals: wins, losingSignals: losses,
    unclassifiedClosed: unclassifiedClosed,
    winRatioPct: winRatioPct, lossRatioPct: lossRatioPct,
    realizedProfitPct: realizedProfitPct, realizedLossPct: realizedLossPct,
    netPerformancePct: netPerformancePct,
  };
}

/* Confidence calibration check: does the engine's OWN biasStrength score
   at signal time actually correlate with real outcomes? Buckets closed
   trades by their logged confidence and reports the real win rate in
   each bucket. If a well-calibrated engine says "80% confidence" trades
   should win noticeably more often than "40% confidence" trades — if
   they don't (or the relationship inverts), that's a genuine, measurable
   sign the confidence score itself needs recalibrating, as opposed to
   guessing at engine parameters with no ground truth. Needs real trade
   volume to say anything meaningful — returns null buckets below a
   minimum sample count rather than a noisy figure. */
function computeConfidenceCalibration(){
  const closed = state.journal.filter(function(e){ return e.status === 'closed' && e.biasStrengthAtLog != null; });
  const buckets = [
    { label: '40-55%', min: 40, max: 55, trades: [] },
    { label: '55-70%', min: 55, max: 70, trades: [] },
    { label: '70-85%', min: 70, max: 85, trades: [] },
    { label: '85-95%', min: 85, max: 95, trades: [] },
  ];
  closed.forEach(function(e){
    const b = buckets.find(function(b){ return e.biasStrengthAtLog >= b.min && e.biasStrengthAtLog < b.max; });
    if (b) b.trades.push(e);
  });
  return buckets.map(function(b){
    const n = b.trades.length;
    const wins = b.trades.filter(isWinningTrade).length;
    return {
      label: b.label, n: n,
      winRatePct: n >= 3 ? Math.round(wins/n*100) : null, // need at least 3 in a bucket to show anything
    };
  });
}

/* Sharpe-style ratio computed on the actual sequence of closed-trade
   returns (not annualized against a benchmark — there's no portfolio
   NAV time series here, just discrete trade outcomes). This is a
   trade-level risk-adjusted-return measure: mean return / stdev of
   returns. Requires at least 5 closed trades to be remotely meaningful;
   below that, returns null rather than a noisy, misleading figure. */
function computeSharpeLike(){
  const trades = closedTradesWithPL();
  if (trades.length < 5) return null;
  const returns = trades.map(function(t){ return t.pl; });
  const mean = returns.reduce(function(a,b){ return a+b; }, 0) / returns.length;
  const variance = returns.reduce(function(s,r){ return s + Math.pow(r-mean,2); }, 0) / returns.length;
  const stdev = Math.sqrt(variance);
  if (stdev === 0) return null;
  return mean / stdev;
}

/* Max drawdown across the closed-trade equity curve (cumulative % return,
   trade by trade, in chronological order) — the largest peak-to-trough
   decline actually experienced. */
function computeMaxDrawdown(){
  const trades = closedTradesWithPL()
    .filter(function(t){ return t.entry.closedAt; })
    .sort(function(a,b){ return new Date(a.entry.closedAt) - new Date(b.entry.closedAt); });
  if (trades.length === 0) return null;
  let equity = 0, peak = 0, maxDD = 0;
  trades.forEach(function(t){
    equity += t.pl;
    if (equity > peak) peak = equity;
    const dd = peak - equity;
    if (dd > maxDD) maxDD = dd;
  });
  return maxDD;
}

/* Average R-multiple and average hold time across closed trades. */
function computeAvgRMultiple(){
  const trades = state.journal.filter(function(e){ return e.status==='closed' && e.exitPrice!=null; });
  if (trades.length === 0) return null;
  return trades.reduce(function(s,e){ return s + rMultipleOf(e); }, 0) / trades.length;
}
function computeAvgHoldTime(){
  const trades = state.journal.filter(function(e){ return e.status==='closed' && e.closedAt; });
  if (trades.length === 0) return null;
  const totalMs = trades.reduce(function(s,e){ return s + (new Date(e.closedAt) - new Date(e.signalGeneratedAt||e.loggedAt)); }, 0);
  return totalMs / trades.length;
}

/* Builds the equity curve as an array of {t, cumPct} points in
   chronological order — used to draw the equity/drawdown curve panel. */
function buildEquityCurve(){
  const trades = closedTradesWithPL()
    .filter(function(t){ return t.entry.closedAt; })
    .sort(function(a,b){ return new Date(a.entry.closedAt) - new Date(b.entry.closedAt); });
  let cum = 0;
  return trades.map(function(t){
    cum += t.pl;
    return { t: t.entry.closedAt, cumPct: cum, symbol: t.entry.symbol, pl: t.pl };
  });
}

   ============================================================
   Single source of truth for every threshold used by the fire-gate
   below (validateSignalBeforeFire). Nothing else in the app hardcodes

  maxEntryDriftPercent: 0.50,   // drift above this triggers a mandatory re-validation pass before firing

  maxSignalAgeSeconds: 60,      // a candidate older than this when it reaches the fire gate is treated as stale regardless of price drift
  phase2MaxAdditionalDriftPercent: 0.20, // how much MORE the price is allowed to move between phase-1 and phase-2 checks before firing is cancelled outright

/* Pulls the full live list of active USDT-margined perpetual contracts from
   Binance Futures. Replaces a hardcoded coin list so new listings (and
   delistings) are reflected automatically without editing code. Falls back
   to a small safe default set (6 majors) only if the live fetch genuinely
   fails after retries — and when that happens, the reason is captured and
   surfaced in the UI rather than silently showing the fallback as if it
   were the full universe. Retries with backoff since a single transient
   network blip or a momentary rate-limit shouldn't permanently strand the
   app on 6 coins for the rest of the session. */
async function loadCoinUniverse(){
  const FALLBACK = [
    {sym:'BTC', pair:'BTCUSDT'}, {sym:'ETH', pair:'ETHUSDT'}, {sym:'SOL', pair:'SOLUSDT'},
    {sym:'BNB', pair:'BNBUSDT'}, {sym:'XRP', pair:'XRPUSDT'}, {sym:'DOGE', pair:'DOGEUSDT'},
  ];
  const MAX_ATTEMPTS = 3;
  let lastError = null;
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    try {
      const res = await fetchWithTimeout(FAPI_BASE + '/fapi/v1/exchangeInfo', {}, 12000);
      if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      const data = await res.json();
      const list = (data.symbols || [])
        .filter(function(s){
          return s.contractType === 'PERPETUAL' &&
                 s.quoteAsset === 'USDT' &&
                 s.status === 'TRADING';
        })
        .map(function(s){ return { sym: s.baseAsset, pair: s.symbol }; })
        .sort(function(a,b){ return a.sym.localeCompare(b.sym); });
      if (list.length === 0) throw new Error('exchangeInfo returned zero tradable USDT perpetuals — unexpected response shape');
      COINS = list;
      state.coinUniverseError = false;
      state.coinUniverseErrorDetail = null;
      state.coinUniverseLoaded = true;
      return; // success — done, no fallback needed
    } catch (e) {
      lastError = e;
      console.error('loadCoinUniverse attempt ' + attempt + '/' + MAX_ATTEMPTS + ' failed:', e.message);
      if (attempt < MAX_ATTEMPTS) {
        await new Promise(function(resolve){ setTimeout(resolve, attempt * 1500); }); // 1.5s, then 3s backoff
      }
    }
  }
  // All attempts exhausted — fall back, but make the failure visible rather
  // than silently presenting 6 coins as if nothing went wrong.
  console.error('Failed to load live coin universe after ' + MAX_ATTEMPTS + ' attempts, using fallback set:', lastError);
  COINS = FALLBACK;
  state.coinUniverseError = true;
  state.coinUniverseErrorDetail = lastError ? lastError.message : 'Unknown error';
  state.coinUniverseLoaded = true;
}

/* A setup counts as "aligned" when the signal direction, the higher-
   timeframe bias, and the market structure all agree — i.e. nothing in
   the analysis is fighting the trade. This is the highest-conviction
   subset of LONG/SHORT signals, not a separate signal type. */
function isAligned(a){
  if (!a || a.signal === 'WAIT') return false;
  if (!a.htfAgrees) return false;
  if (a.signal === 'LONG') return a.structure === 'HH-HL' || a.structure === 'MSS-Bullish-Break';
  if (a.signal === 'SHORT') return a.structure === 'LH-LL' || a.structure === 'MSS-Bearish-Break';
  return false;
}

/* ============================================================
   UTIL
   ============================================================ */
function fetchWithTimeout(url, opts, ms){
  opts = opts || {}; ms = ms || 9000;
  const controller = new AbortController();
  const timer = setTimeout(function(){ controller.abort('Request timed out after ' + ms + 'ms'); }, ms);
  return fetch(url, Object.assign({}, opts, { signal: controller.signal }))
    .then(function(res){
      // Binance returns the IP's REAL current weight usage on every
      // response via this header — not an estimate, the exchange's own
      // ground truth. Only applies to fapi.binance.com calls; other
      // fetches (CoinGecko, Fear&Greed) won't have this header and are
      // simply ignored here.
      const usedWeight = res.headers && res.headers.get && res.headers.get('x-mbx-used-weight-1m');
      if (usedWeight != null) {
        state.binanceUsedWeight1m = parseInt(usedWeight, 10) || state.binanceUsedWeight1m;
        state.binanceWeightUpdatedAt = Date.now();
      }
      if (res.status === 429 || res.status === 418) {
        state.binanceRateLimited = true;
        state.binanceRateLimitedAt = Date.now();
      }
      return res;
    })
    .catch(function(e){
      if (e && e.name === 'AbortError') {
        throw new Error('Timed out: ' + url.split('?')[0]);
      }
      throw e;
    })
    .finally(function(){ clearTimeout(timer); });
}
function fmtPrice(p){
  if (p == null || isNaN(p)) return '—';
  if (p >= 1000) return Number(p).toLocaleString(undefined, {maximumFractionDigits:2});
  if (p >= 1) return Number(p).toFixed(3);
  if (p >= 0.01) return Number(p).toFixed(5);
  return Number(p).toFixed(6);
}
function esc(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

  return ({

    'MSS-Bullish-Break':'MSS ↑', 'MSS-Bearish-Break':'MSS ↓',
    'Undetermined':'STRUCT —',
  })[structure] || 'STRUCT —';
}

  if (structure==='HH-HL') return 'bull';
  if (structure==='LH-LL') return 'bear';
  if (structure==='MSS-Bullish-Break') return 'shift-bull';
  if (structure==='MSS-Bearish-Break') return 'shift-bear';
  return 'neutral';
}

/* Renders the leverage/margin position-sizing table for an analysis.
   Defensive against missing data (e.g. analyses logged before this
   feature existed, or a WAIT signal's reference plan). */
function leverageTableHTML(lev){
  if (!lev || !lev.tiers) return '<p class="lev-empty">Position sizing unavailable for this analysis.</p>';
  const rows = lev.tiers.map(function(t){
    return '<tr><td class="label">' + t.riskPct + '% risk</td>' +
      '<td class="val lev-val">' + t.leverage + 'x</td>' +
      '<td class="val lev-val">' + t.marginPct.toFixed(1) + '%</td></tr>';
  }).join('');
  return '<div class="lev-stop-dist mono">Stop distance: ' + lev.stopDistancePct.toFixed(2) + '% from entry</div>' +
    '<table class="levels-table lev-table"><thead><tr><th>Risk tier</th><th>Leverage</th><th>Margin %</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="lev-note">' + esc(lev.note) + '</p>';
}

function el(html){
