<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENVRA AI Trade Tracker</title>
<meta name="theme-color" content="#EDE9FB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --obsidian:#08090B;
    --panel:#12151A;
    --panel-raised:#171B21;
    --panel-deep:#0D0F13;
    --hairline:#23272E;
    --hairline-soft:#1B1F26;
    --text-hi:#EDEFF2;
    --text-mid:#9098A6;
    --text-dim:#5B6270;
    --bull:#3DDC97;
    --bull-dim:#1F3D33;
    --bear:#E5533D;
    --bear-dim:#3D2622;
    --wait:#9098A6;
    --wait-dim:#262A30;
    --gold:#C9A14A;
    --gold-dim:#3A2F1A;
    --focus:#5B9FE5;
    --cyan:#4DE8F0;
    --cyan-dim:#173238;
    --cyan-glow:rgba(77,232,240,.18);
    /* Neon-green AI accent — distinct from --bull (which means "price up")
       so it can be used purely for AI/engine chrome (workflow stages,
       scanning states, AI badges) without implying a bullish signal. */
    --neon:#39FF9E;
    --neon-dim:#12291D;
    --neon-glow:rgba(57,255,158,.22);
    /* Deep glass shadow layers for the institutional-terminal depth pass */
    --shadow-deep:0 24px 60px -20px rgba(0,0,0,.85);
    --shadow-soft:0 10px 28px -16px rgba(0,0,0,.6);
    --border-glow-cyan:0 0 0 1px rgba(77,232,240,.15), 0 0 24px -8px rgba(77,232,240,.35);
    --border-glow-neon:0 0 0 1px rgba(57,255,158,.15), 0 0 24px -8px rgba(57,255,158,.35);
    --border-glow-gold:0 0 0 1px rgba(201,161,74,.15), 0 0 24px -8px rgba(201,161,74,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1400px 700px at 50% -12%, rgba(77,232,240,.06), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 100%, rgba(57,255,158,.03), transparent 55%),
      linear-gradient(rgba(77,232,240,.025) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, rgba(77,232,240,.02) 1px, transparent 1px) 0 0/40px 100%,
      var(--obsidian);
    color:var(--text-hi);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes shimmer{0%{background-position:-200% 0;} 100%{background-position:200% 0;}}
  @keyframes glow-pulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
  @keyframes count-in{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
  @keyframes radar-sweep-rotate{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
  .loading-shimmer{
    background:linear-gradient(90deg, var(--hairline-soft) 25%, var(--hairline) 50%, var(--hairline-soft) 75%);
    background-size:200% 100%; animation:shimmer 1.6s ease-in-out infinite; border-radius:6px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  ::selection{background:var(--bull-dim);}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

  /* ===== Glassmorphism foundation =====
     Frosted "crystal" panels: translucent fill + backdrop blur + a thin
     light-catching top edge + a soft ambient glow. Applied selectively to
     dashboard surfaces (status cards, summary cards, signal cards) rather
     than everywhere, so it reads as a deliberate premium material rather
     than a blanket filter. */
  .glass{
    background:linear-gradient(165deg, rgba(23,27,33,.72), rgba(19,22,27,.6));
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      0 1px 0 rgba(77,232,240,.04),
      0 16px 40px -24px rgba(0,0,0,.65);
    transition:transform 220ms cubic-bezier(.2,.8,.2,1), box-shadow 220ms ease, border-color 220ms ease;
  }
  .glass:hover{
    border-color:rgba(77,232,240,.22);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 0 0 1px rgba(77,232,240,.08),
      0 18px 44px -22px rgba(0,0,0,.7);
  }
  @media (prefers-reduced-motion: reduce){
    .glass{transition:none;}
  }
  /* Fallback for browsers without backdrop-filter support (mostly older
     Android WebViews) — keeps the panel readable, just without the blur. */
  @supports not (backdrop-filter: blur(1px)){
    .glass{background:linear-gradient(165deg, rgba(23,27,33,.94), rgba(19,22,27,.92));}
  }

  /* Premium variants for hero/signature panels — layered on top of .glass,
     never replacing it, so every existing .glass usage is untouched. */
  .glass-hero{
    background:linear-gradient(155deg, rgba(23,27,33,.85), rgba(13,15,19,.75));
    border:1px solid rgba(77,232,240,.14);
    box-shadow:var(--shadow-deep), inset 0 1px 0 rgba(255,255,255,.07), 0 0 60px -30px rgba(77,232,240,.25);
  }
  .glass-neon{border-color:rgba(57,255,158,.18); box-shadow:var(--border-glow-neon), var(--shadow-soft);}
  .glass-gold-edge{border-color:rgba(201,161,74,.2); box-shadow:var(--border-glow-gold), var(--shadow-soft);}


  /* ===== App shell ===== */
  /* ===== Shell layout: sidebar (desktop) + bottom nav (mobile) ===== */
  .app-shell{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:220px;flex-shrink:0;height:100vh;position:sticky;top:0;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(13,16,20,.96),rgba(11,13,16,.98));
    border-right:1px solid var(--hairline);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    z-index:100;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 16px 16px;border-bottom:1px solid var(--hairline-soft);}
  .sidebar-brand .brand-text h1{font-size:13px;margin:0;font-weight:800;letter-spacing:.02em;
    background:linear-gradient(90deg,var(--text-hi),var(--cyan) 160%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sidebar-brand .brand-text p{font-size:9px;margin:2px 0 0;color:var(--text-dim);letter-spacing:.08em;}
  .sidebar-nav{flex:1;overflow-y:auto;padding:10px 8px;}
  .nav-item{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;border-radius:10px;border:none;cursor:pointer;
    background:transparent;color:var(--text-dim);font-size:12.5px;font-weight:500;
    text-align:left;transition:all 200ms cubic-bezier(.2,.8,.2,1);margin-bottom:2px;
  }
  .nav-item:hover{background:rgba(255,255,255,.04);color:var(--text-hi);}
  .nav-item.active{background:rgba(77,232,240,.1);color:var(--cyan);border:1px solid rgba(77,232,240,.2);
    box-shadow:0 0 12px -4px rgba(77,232,240,.3);}
  .nav-icon{font-size:16px;flex-shrink:0;width:22px;text-align:center;}
  .nav-label{flex:1;}
  .sidebar-foot{padding:14px;border-top:1px solid var(--hairline-soft);display:flex;flex-direction:column;gap:7px;}

  /* Main content column */
  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:16px 24px;border-bottom:1px solid var(--hairline);
    background:rgba(11,13,16,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    position:sticky;top:0;z-index:50;
  }
  .topbar-title{font-size:18px;font-weight:700;letter-spacing:-.01em;
    background:linear-gradient(90deg,var(--text-hi),var(--cyan) 200%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tab-content-area{flex:1;padding:24px;max-width:1400px;width:100%;}
  .footer-note{font-size:11px;color:var(--text-dim);padding:16px 24px;border-top:1px solid var(--hairline-soft);font-family:'JetBrains Mono',monospace;line-height:1.5;}

  /* Bottom nav (mobile only) */
  .bottom-nav{display:none;}

  /* ===== New tab component CSS ===== */

  /* Activity feed (dashboard + alerts) */
  .activity-feed{padding:0;overflow:hidden;}
  .activity-row{
    display:flex;align-items:flex-start;gap:10px;padding:11px 16px;
    border-bottom:1px solid var(--hairline-soft);font-size:12.5px;
  }
  .activity-row:last-child{border-bottom:none;}
  .activity-time{min-width:132px;color:var(--text-dim);font-size:11px;}
  .activity-emoji{flex-shrink:0;}
  .activity-text{color:var(--text-mid);line-height:1.4;}

  /* Link button */
  .link-btn{background:none;border:none;color:var(--cyan);font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer;padding:0;}
  .link-btn:hover{text-decoration:underline;}

  /* Market analysis */
  .market-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
  .market-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px;}
  .market-block{padding:18px;}
  .market-block h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0 0 14px;display:flex;align-items:center;gap:6px;}
  .market-block h4::before{content:'';width:3px;height:11px;background:var(--cyan);border-radius:1px;opacity:.6;}
  .market-block-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--hairline-soft);font-size:12.5px;}
  .market-block-row:last-child{border-bottom:none;}
  .mb-label{color:var(--text-dim);font-size:11px;}
  .mb-empty{color:var(--text-dim);font-size:12px;font-style:italic;padding:8px 0;}
  .mb-note{font-size:10px;color:var(--text-dim);margin-top:8px;}
  .fg-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:42px;margin:8px 0 4px;}
  .fg-label{font-size:14px;font-weight:600;color:var(--text-hi);}

  /* Performance analytics */
  .perf-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .perf-card{padding:16px;text-align:center;}
  .perf-label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .perf-pl{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;}
  .perf-meta{font-size:11px;color:var(--text-dim);margin-top:4px;}

  /* Win-rate confidence banner */
  .calib-banner{
    display:flex;gap:14px;align-items:flex-start;padding:16px 20px;margin-bottom:18px;
    border-left:3px solid var(--text-dim);
  }
  .calib-banner.calib-gold{border-left-color:var(--gold);}
  .calib-banner.calib-cyan{border-left-color:var(--cyan);}
  .calib-banner.calib-bull{border-left-color:var(--bull);}
  .calib-banner-icon{font-size:22px;flex-shrink:0;}
  .calib-banner-title{font-size:13.5px;font-weight:700;color:var(--text-hi);margin-bottom:5px;}
  .calib-banner-body{font-size:12px;color:var(--text-mid);line-height:1.6;}

  /* Confidence calibration table */
  .calib-table{padding:18px 20px;margin-bottom:18px;}
  .calib-row{display:grid;grid-template-columns:70px 1fr 50px 90px;align-items:center;gap:12px;padding:8px 0;}
  .calib-bucket-label{font-size:11.5px;font-family:'JetBrains Mono',monospace;color:var(--text-mid);}
  .calib-bar-track{height:8px;border-radius:4px;background:var(--hairline-soft);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .calib-bar-fill{height:100%;border-radius:4px;background:var(--gold);box-shadow:0 0 8px rgba(201,161,74,.4);transition:width 500ms ease;}
  .calib-result{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:700;color:var(--text-hi);text-align:right;}
  .calib-n{font-size:10.5px;color:var(--text-dim);text-align:right;}
  .calib-footnote{font-size:11px;color:var(--text-dim);font-style:italic;margin:12px 0 0;line-height:1.5;}

  /* Spec-exact performance summary */
  .spec-summary{padding:20px 24px;}
  .spec-summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;}
  .spec-stat{text-align:center;padding:10px 6px;background:var(--hairline-soft);border-radius:8px;}
  .spec-stat-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;}
  .spec-stat-val.bull{color:var(--bull);}
  .spec-stat-val.bear{color:var(--bear);}
  .spec-stat-val.gold{color:var(--gold);}
  .spec-stat-val.cyan{color:var(--cyan);}
  .spec-stat-val.neutral{color:var(--text-hi);}
  .spec-stat-label{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-top:5px;}

  /* Real-time scanner status panel */
  .scanner-realtime-panel{padding:20px 24px;}
  .scanner-rt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;}
  .scanner-rt-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--hairline-soft);border-radius:8px;}
  .scanner-rt-icon{font-size:14px;flex-shrink:0;}
  .scanner-rt-label{font-size:11px;color:var(--text-dim);flex:1;}
  .scanner-rt-value{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;color:var(--text-hi);text-align:right;white-space:nowrap;}
  .scanner-rt-value.good{color:var(--bull);}
  .scanner-rt-value.bear{color:var(--bear);}
  .scanner-rt-value.gold{color:var(--gold);}
  .scanner-rt-value.cyan{color:var(--cyan);}

  .monthly-chart{padding:20px;}
  .monthly-bars{display:flex;justify-content:space-around;align-items:flex-end;height:110px;gap:8px;}
  .monthly-bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
  .monthly-bar-wrap{height:80px;display:flex;align-items:flex-end;width:100%;}
  .monthly-bar{width:100%;border-radius:4px 4px 0 0;transition:height 400ms ease;}
  .monthly-bar.bull{background:var(--bull);box-shadow:0 0 8px rgba(61,220,151,.3);}
  .monthly-bar.bear{background:var(--bear);box-shadow:0 0 8px rgba(229,83,61,.3);}
  .monthly-bar-label{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .monthly-bar-pl{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:600;}
  .rank-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--hairline-soft);font-size:12.5px;}
  .rank-row:last-child{border-bottom:none;}
  .rank-num{color:var(--text-dim);font-family:'JetBrains Mono',monospace;min-width:22px;}
  .rank-sym{font-weight:700;flex:1;}
  .rank-pl{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .rank-trades{font-size:11px;color:var(--text-dim);}

  /* AI Scanner */
  .scanner-metrics{padding:20px;margin-bottom:18px;}
  .scanner-metrics h3{font-size:13px;margin:0 0 16px;color:var(--text-hi);}
  .scanner-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px;}
  .scanner-stat{background:var(--hairline-soft);border-radius:8px;padding:12px 14px;}
  .ss-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .ss-val{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text-hi);}
  .ss-val.good{color:var(--bull);}
  .ss-val.bear{color:var(--bear);}
  .scanner-progress-wrap{margin-top:4px;}
  .scanner-progress-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .scanner-progress-pct{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:5px;}
  .scanner-log{padding:0;overflow:hidden;}
  .scanner-log-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--hairline-soft);font-size:12px;}
  .scanner-log-row:last-child{border-bottom:none;}
  .scanner-log-sym{font-weight:700;min-width:60px;}
  .scanner-log-model{color:var(--text-dim);flex:1;}
  .scanner-log-conf{font-family:'JetBrains Mono',monospace;color:var(--gold);}

  /* Alerts */
  .alert-type-tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;font-weight:700;border-radius:8px;padding:2px 7px;flex-shrink:0;}
  .alert-signal{background:rgba(77,232,240,.1);color:var(--cyan);}
  .alert-tp{background:var(--bull-dim);color:var(--bull);}
  .alert-sl{background:var(--bear-dim);color:var(--bear);}
  .alert-structure{background:rgba(201,161,74,.1);color:var(--gold);}
  .alert-scanner{background:var(--hairline-soft);color:var(--text-mid);}

  /* Coin database */
  .coin-table-wrap{overflow-x:auto;border-radius:12px;}
  .coin-table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
  .coin-table thead th{
    text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan);
    font-weight:600;padding:11px 14px;background:rgba(23,27,33,.9);border-bottom:1px solid rgba(77,232,240,.15);
    position:sticky;top:0;
  }
  .coin-table tbody td{padding:10px 14px;border-bottom:1px solid var(--hairline-soft);color:var(--text-mid);}
  .coin-table tbody tr:last-child td{border-bottom:none;}
  .coin-table tbody tr:hover{background:rgba(77,232,240,.03);}

  /* Settings */
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;}
  .settings-section{padding:20px;}
  .settings-section h3{font-size:13px;margin:0 0 16px;color:var(--text-hi);font-weight:700;}
  .setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--hairline-soft);}
  .setting-row:last-child{border-bottom:none;}
  .setting-label{font-size:13px;color:var(--text-hi);font-weight:500;margin-bottom:3px;}
  .setting-desc{font-size:11px;color:var(--text-dim);line-height:1.4;}
  .setting-badge{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-mid);
    background:var(--hairline-soft);border-radius:6px;padding:4px 9px;white-space:nowrap;}

  /* ===== Resources & Tools tab ===== */
  .resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:24px;}
  .resource-card{
    display:block;padding:16px;text-decoration:none;color:inherit;cursor:pointer;
    transition:transform 180ms ease,border-color 180ms ease;
  }
  .resource-card:hover{transform:translateY(-2px);border-color:rgba(77,232,240,.3);}
  .resource-card-internal{border-color:rgba(61,220,151,.25);}
  .resource-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
  .resource-name{font-size:13.5px;font-weight:700;color:var(--text-hi);}
  .resource-ext-tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;color:var(--cyan);border:1px solid rgba(77,232,240,.3);border-radius:8px;padding:2px 7px;white-space:nowrap;}
  .resource-internal-tag{font-size:9.5px;font-family:'JetBrains Mono',monospace;color:var(--bull);border:1px solid var(--bull-dim);border-radius:8px;padding:2px 7px;white-space:nowrap;}
  .resource-desc{font-size:11.5px;color:var(--text-mid);line-height:1.5;margin:0;}
  .toggle-btn{
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
    background:var(--panel-raised);border:1px solid var(--hairline);color:var(--text-dim);
    border-radius:7px;padding:7px 16px;cursor:pointer;transition:all 200ms ease;white-space:nowrap;
  }
  .toggle-btn.active{background:rgba(61,220,151,.1);border-color:var(--bull-dim);color:var(--bull);}

  /* Responsive breakpoints */
  @media (max-width:1024px){
    .sidebar{width:180px;}
    .market-grid-2{grid-template-columns:1fr;}
    .market-grid-3{grid-template-columns:1fr 1fr;}
    .perf-row{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:768px){
    .sidebar{display:none;}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:200;
      background:rgba(11,13,16,.96);border-top:1px solid var(--hairline);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      overflow-x:auto;-webkit-overflow-scrolling:touch;
    }
    .bottom-nav-item{
      flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;
      gap:3px;padding:10px 6px;border:none;background:transparent;
      color:var(--text-dim);font-size:9.5px;font-weight:500;cursor:pointer;
      transition:color 200ms ease;
    }
    .bottom-nav-item.active{color:var(--cyan);}
    .bn-icon{font-size:18px;}
    .bn-label{font-size:9px;white-space:nowrap;}
    .main-col{padding-bottom:70px;}
    .tab-content-area{padding:16px;}
    .market-grid-2,.market-grid-3{grid-template-columns:1fr;}
    .perf-row{grid-template-columns:1fr 1fr;}
    .settings-grid{grid-template-columns:1fr;}
    .dash-cards-grid{grid-template-columns:repeat(2,1fr);}
    .ongoing-signals-grid{grid-template-columns:1fr;}
  }
  @media (max-width:480px){
    .perf-row{grid-template-columns:1fr;}
    .dash-cards-grid{grid-template-columns:repeat(2,1fr);}
    .topbar{padding:12px 16px;}
  }

  /* ===== Terminal Status Ticker ===== */
  .terminal-ticker{
    overflow:hidden; white-space:nowrap; background:var(--panel-deep);
    border-bottom:1px solid var(--hairline-soft); padding:7px 0;
  }
  .ticker-scroll{display:inline-flex; animation:ticker-scroll 45s linear infinite;}
  @keyframes ticker-scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  .ticker-item{display:inline-flex; align-items:center; gap:6px; padding:0 18px; font-size:11px; font-family:'JetBrains Mono',monospace; border-right:1px solid var(--hairline-soft);}
  .ticker-icon{font-size:11px;}
  .ticker-label{color:var(--text-dim); letter-spacing:.03em;}
  .ticker-value{color:var(--text-hi); font-weight:600;}
  .ticker-value.good{color:var(--bull);}
  .ticker-value.bad{color:var(--bear);}
  @media (prefers-reduced-motion: reduce){ .ticker-scroll{animation:none;} }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding-bottom:16px; margin-bottom:18px;
    border-bottom:1px solid var(--hairline);
    position:relative;
  }
  .topbar::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.5; animation:topbar-sweep 6s ease-in-out infinite;
  }
  @keyframes topbar-sweep{
    0%,100%{opacity:.15;} 50%{opacity:.6;}
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px;height:34px; border-radius:8px;
    background:linear-gradient(160deg,var(--bull) 0%, #1f8f63 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:14px; color:#06120c;
    flex-shrink:0; position:relative;
    box-shadow:0 0 0 1px rgba(77,232,240,.3), 0 0 18px rgba(77,232,240,.25), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .brand-mark::after{
    content:''; position:absolute; inset:-1px; border-radius:9px;
    border:1px solid var(--cyan); opacity:.4; animation:brand-pulse 2.4s ease-in-out infinite;
  }
  @keyframes brand-pulse{
    0%,100%{opacity:.15; transform:scale(1);} 50%{opacity:.55; transform:scale(1.06);}
  }
  .brand-text h1{
    font-size:15px; margin:0; letter-spacing:.03em; font-weight:700;
    background:linear-gradient(90deg, var(--text-hi), var(--cyan) 140%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-text p{font-size:11px; margin:1px 0 0; color:var(--text-dim); font-family:'JetBrains Mono',monospace; letter-spacing:.04em;}

  .topbar-right{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .status-chip{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-mid);
    background:var(--panel); border:1px solid var(--hairline); border-radius:20px;
    padding:5px 10px 5px 8px;
  }
  .dot{width:7px;height:7px;border-radius:50%; background:var(--text-dim); flex-shrink:0;}
  .dot.live{background:var(--bull); box-shadow:0 0 0 0 rgba(61,220,151,.5); animation:pulse 2s infinite;}
  .dot.down{background:var(--bear);}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(61,220,151,.45);}
    70%{box-shadow:0 0 6px rgba(61,220,151,0);}
    100%{box-shadow:0 0 0 0 rgba(61,220,151,0);}
  }

  /* ===== Session ribbon (signature element: live kill-zone radar) ===== */
  .ribbon-wrap{
    background:linear-gradient(180deg, var(--panel), var(--panel-raised));
    border:1px solid var(--hairline); border-radius:10px;
    padding:14px 16px 12px; margin-bottom:20px;
    position:relative; overflow:hidden;
    box-shadow:0 0 0 1px rgba(77,232,240,.04), 0 12px 28px -16px rgba(0,0,0,.6);
  }
  .ribbon-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
  .ribbon-title{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan); font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .ribbon-title::before{
    content:''; width:6px; height:6px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 8px var(--cyan); animation:radar-blip 1.8s ease-in-out infinite;
  }
  @keyframes radar-blip{0%,100%{opacity:.4;} 50%{opacity:1;}}
  .ribbon-now{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-mid);}
  .ribbon-now span{color:var(--text-hi); font-weight:600;}
  .ribbon-track{
    position:relative; height:36px; border-radius:6px; overflow:hidden;
    background:repeating-linear-gradient(90deg, var(--hairline-soft) 0, var(--hairline-soft) 1px, transparent 1px, transparent calc(100%/24));
    border:1px solid var(--hairline-soft);
  }
  .ribbon-track::before{
    /* radar sweep beam — ties the HUD motif directly to the literal
       "kill zone" concept: a moving window scanning across the day */
    content:''; position:absolute; top:0; bottom:0; width:18%;
    background:linear-gradient(90deg, transparent, rgba(77,232,240,.16), transparent);
    animation:radar-sweep 7s linear infinite; pointer-events:none; z-index:3;
  }
  @keyframes radar-sweep{
    0%{left:-20%;} 100%{left:100%;}
  }
  .kz-seg{
    position:absolute; top:0; bottom:0; display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.05em; font-weight:600;
    color:var(--text-dim); white-space:nowrap; overflow:hidden;
    border-right:1px solid var(--hairline); transition:background .3s ease, color .3s ease;
  }
  .kz-seg.active{color:#06140e; font-weight:700; box-shadow:inset 0 0 14px rgba(255,255,255,.18);}
  .kz-seg[data-kz="asia"]{background:rgba(91,159,229,.08);}
  .kz-seg[data-kz="london"]{background:rgba(201,161,74,.08);}
  .kz-seg[data-kz="ny-am"]{background:rgba(61,220,151,.10);}
  .kz-seg[data-kz="ny-lunch"]{background:rgba(144,152,166,.06);}
  .kz-seg[data-kz="ny-pm"]{background:rgba(61,220,151,.06);}
  .kz-seg.active[data-kz="asia"]{background:#5B9FE5;}
  .kz-seg.active[data-kz="london"]{background:var(--gold);}
  .kz-seg.active[data-kz="ny-am"]{background:var(--bull);}
  .kz-seg.active[data-kz="ny-pm"]{background:#2bb37e;}
  .now-marker{
    position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--cyan);
    box-shadow:0 0 10px var(--cyan), 0 0 2px var(--cyan); z-index:5;
  }
  .now-marker::after{
    content:''; position:absolute; top:-4px; left:-3px; width:8px; height:8px;
    background:var(--cyan); border-radius:50%; box-shadow:0 0 10px var(--cyan);
  }
  .ribbon-legend{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .legend-dot{width:7px;height:7px;border-radius:2px;}

  /* ===== Controls row ===== */
  .controls-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .controls-left{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .btn{
    font-family:'IBM Plex Sans',sans-serif; font-size:13px; font-weight:600;
    border-radius:8px; padding:10px 18px; cursor:pointer; border:1px solid transparent;
    transition:all .15s ease; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{background:var(--bull); color:#06140e; box-shadow:0 0 0 1px rgba(61,220,151,.25), 0 4px 14px -6px rgba(61,220,151,.5);}
  .btn-primary:hover{background:#34c389; box-shadow:0 0 0 1px rgba(61,220,151,.4), 0 6px 18px -6px rgba(61,220,151,.6);}
  .btn-primary:disabled{background:var(--wait-dim); color:var(--text-dim); cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:transparent; border-color:var(--hairline); color:var(--text-mid);}
  .btn-ghost:hover{color:var(--text-hi); border-color:var(--text-dim);}
  .btn-gold{background:var(--gold); color:#1f1605; box-shadow:0 0 0 1px rgba(201,161,74,.25), 0 4px 14px -6px rgba(201,161,74,.5);}
  .btn-gold:hover{background:#d6ae57; box-shadow:0 0 0 1px rgba(201,161,74,.4), 0 6px 18px -6px rgba(201,161,74,.6);}
  .btn-gold:disabled{background:var(--wait-dim); color:var(--text-dim); cursor:not-allowed; box-shadow:none;}
  .btn-toggle{background:transparent; border:1px solid var(--hairline); color:var(--text-dim);}
  .btn-toggle:hover{color:var(--text-hi); border-color:var(--text-dim);}
  .btn-toggle.active{border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); box-shadow:0 0 12px -4px var(--cyan);}

  .search-input{
    background:var(--panel); border:1px solid var(--hairline); border-radius:8px;
    padding:9px 12px; color:var(--text-hi); font-size:13px; font-family:'JetBrains Mono',monospace;
    min-width:170px; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-input::placeholder{color:var(--text-dim);}
  .search-input:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-glow);}

  .filter-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .filter-pill{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    background:transparent; border:1px solid var(--hairline); color:var(--text-dim);
    border-radius:14px; padding:5px 11px; cursor:pointer; transition:all .15s ease;
  }
  .filter-pill.active{border-color:var(--bull-dim); color:var(--bull); background:rgba(61,220,151,.06);}
  .filter-pill.aligned-pill{border-color:var(--gold-dim); color:var(--gold);}
  .filter-pill.aligned-pill.active{background:rgba(201,161,74,.1); border-color:var(--gold);}

  /* ===== Grid ===== */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px;
  }

  .card{
    background:linear-gradient(165deg, var(--panel-raised), var(--panel));
    border:1px solid var(--hairline); border-radius:11px;
    padding:14px; cursor:pointer; transition:border-color .2s ease, box-shadow .2s ease, transform .12s ease;
    position:relative; isolation:isolate;
  }
  .card::before{
    /* corner HUD accents — subtle bracket marks, like a targeting reticle */
    content:''; position:absolute; top:6px; left:6px; width:8px; height:8px;
    border-top:1px solid var(--cyan); border-left:1px solid var(--cyan);
    opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .card::after{
    content:''; position:absolute; bottom:6px; right:6px; width:8px; height:8px;
    border-bottom:1px solid var(--cyan); border-right:1px solid var(--cyan);
    opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .card:hover{border-color:rgba(77,232,240,.35); box-shadow:0 0 0 1px rgba(77,232,240,.06), 0 10px 24px -14px rgba(0,0,0,.7); transform:translateY(-1px);}
  .card:hover::before, .card:hover::after{opacity:.55;}
  .card.expanded{cursor:default; grid-column:1/-1; transform:none;}
  .card.expanded:hover{border-color:var(--hairline); transform:none; box-shadow:none;}
  .card.expanded::before, .card.expanded::after{opacity:0;}
  .card.aligned{border-color:var(--gold-dim); box-shadow:0 0 0 1px rgba(201,161,74,.12) inset;}
  .card.aligned:hover{border-color:var(--gold); box-shadow:0 0 0 1px rgba(201,161,74,.15) inset, 0 10px 24px -14px rgba(0,0,0,.7);}

  .aligned-badge{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; letter-spacing:.03em;
    color:var(--gold); border:1px solid var(--gold-dim); background:rgba(201,161,74,.1);
    border-radius:10px; padding:2px 7px; margin-left:auto;
  }

  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-id{display:flex; align-items:center; gap:9px;}
  .coin-badge{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(155deg, var(--panel-raised), var(--obsidian));
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; color:var(--text-mid);
    border:1px solid var(--hairline-soft); flex-shrink:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  }
  .coin-name{font-weight:700; font-size:14px; letter-spacing:.01em;}
  .coin-pair{font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}

  .price-block{text-align:right;}
  .price{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:15px;}
  .price-change{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; margin-top:1px;}
  .price-change.up{color:var(--bull);}
  .price-change.down{color:var(--bear);}

  .signal-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .signal-pill{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:800; letter-spacing:.06em;
    border-radius:5px; padding:4px 9px;
  }
  .signal-pill.LONG{background:var(--bull-dim); color:var(--bull); box-shadow:0 0 10px -3px var(--bull);}
  .signal-pill.SHORT{background:var(--bear-dim); color:var(--bear); box-shadow:0 0 10px -3px var(--bear);}
  .signal-pill.WAIT{background:var(--wait-dim); color:var(--wait);}
  .signal-pill.idle{background:var(--hairline-soft); color:var(--text-dim);}
  .signal-pill.small{font-size:9.5px; padding:3px 7px;}
  .struct-chip.small{font-size:9px; padding:1px 5px;}

  /* ===== Dashboard ===== */
  .scanner-chip{color:var(--cyan); border-color:rgba(77,232,240,.25);}
  .btn-refresh{
    background:linear-gradient(165deg, rgba(77,232,240,.14), rgba(77,232,240,.06));
    border:1px solid rgba(77,232,240,.3); color:var(--cyan);
    box-shadow:0 0 0 1px rgba(77,232,240,.08), 0 4px 14px -6px rgba(77,232,240,.35);
  }
  .btn-refresh:hover{background:linear-gradient(165deg, rgba(77,232,240,.2), rgba(77,232,240,.08)); box-shadow:0 0 0 1px rgba(77,232,240,.16), 0 6px 18px -6px rgba(77,232,240,.45);}
  .btn-refresh:disabled{opacity:.6; cursor:default;}
  .refresh-icon{display:inline-block; transition:transform 280ms ease;}
  .btn-refresh.refreshing .refresh-icon{animation:spin 700ms linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  /* ===== Hero Panel ===== */
  .hero-panel{
    padding:28px 32px; margin-bottom:20px; display:flex; flex-wrap:wrap; gap:28px;
    justify-content:space-between; align-items:center; position:relative; overflow:hidden;
  }
  .hero-panel::before{
    content:''; position:absolute; top:-40%; right:-10%; width:400px; height:400px;
    background:radial-gradient(circle, rgba(77,232,240,.08), transparent 70%); pointer-events:none;
  }
  .hero-main{position:relative; z-index:1;}
  .hero-label{font-size:11px; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; margin-bottom:6px;}
  .hero-label-note{text-transform:none; letter-spacing:0; opacity:.7;}
  .hero-balance{
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:44px; line-height:1;
    letter-spacing:-.01em;
  }
  .hero-sub-row{display:flex; gap:20px; margin-top:14px; flex-wrap:wrap;}
  .hero-sub-item{display:flex; flex-direction:column; gap:2px; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600;}
  .hero-sub-label{font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:500; font-family:'IBM Plex Sans',sans-serif;}
  .hero-ratios{display:grid; grid-template-columns:repeat(3, minmax(110px,1fr)); gap:18px 24px; position:relative; z-index:1;}
  .hero-ratio{text-align:center;}
  .hero-ratio-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:16px; white-space:nowrap;}
  .hero-ratio-val.bull{color:var(--bull);}
  .hero-ratio-val.bear{color:var(--bear);}
  .hero-ratio-val.gold{color:var(--gold);}
  .hero-ratio-val.neutral{color:var(--text-hi);}
  .hero-ratio-label{font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:5px;}

  /* ===== AI Engine Workflow ===== */
  .ai-workflow{padding:20px 24px; margin-bottom:18px;}
  .ai-workflow-title{
    font-size:11px; letter-spacing:.08em; color:var(--neon); text-transform:uppercase; font-weight:700;
    display:flex; align-items:center; gap:8px; margin-bottom:16px;
  }
  .neon-dot{width:7px; height:7px; border-radius:50%; background:var(--neon); box-shadow:0 0 10px var(--neon); animation:glow-pulse 1.8s ease-in-out infinite;}
  .regime-sample-note{color:var(--text-dim); text-transform:none; letter-spacing:0; font-weight:500; margin-left:4px;}
  .ai-workflow-stages{display:flex; align-items:center; flex-wrap:wrap; gap:4px; justify-content:space-between;}
  .ai-stage{
    flex:1; min-width:88px; text-align:center; padding:12px 6px; border-radius:10px;
    background:var(--hairline-soft); border:1px solid transparent; transition:all 280ms ease; opacity:.5;
  }
  .ai-stage.is-active{
    opacity:1; background:var(--neon-dim); border-color:rgba(57,255,158,.3);
    box-shadow:0 0 16px -6px rgba(57,255,158,.4);
  }
  .ai-stage-icon{font-size:18px; margin-bottom:4px;}
  .ai-stage-label{font-size:10px; font-weight:700; letter-spacing:.04em; color:var(--text-mid);}
  .ai-stage.is-active .ai-stage-label{color:var(--neon);}
  .ai-stage-note{font-size:9px; color:var(--text-dim); margin-top:3px; font-family:'JetBrains Mono',monospace;}
  .ai-stage-arrow{color:var(--text-dim); font-size:14px; flex-shrink:0; transition:color 280ms ease;}
  .ai-stage-arrow.is-active{color:var(--neon);}
  @media (max-width:768px){ .ai-workflow-stages{flex-direction:column; align-items:stretch;} .ai-stage-arrow{transform:rotate(90deg); align-self:center;} }

  /* ===== Market Regime Meter ===== */
  .regime-panel{padding:20px 24px; margin-bottom:18px;}
  .regime-bars{display:flex; flex-direction:column; gap:12px;}
  .regime-bar-row{display:grid; grid-template-columns:130px 1fr 44px; align-items:center; gap:12px;}
  .regime-bar-label{font-size:11.5px; color:var(--text-mid);}
  .regime-bar-track{height:7px; border-radius:4px; background:var(--hairline-soft); overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .regime-bar-fill{height:100%; border-radius:4px; transition:width 500ms ease;}
  .regime-bar-pct{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-mid); text-align:right;}

  /* ===== Order Book Panel ===== */
  .orderbook-panel{padding:20px 24px; margin-bottom:18px;}
  .ob-microstructure-strip{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:12px; margin-bottom:16px;}
  .ob-micro-stat{background:var(--hairline-soft); border-radius:8px; padding:10px 12px;}
  .ob-micro-stat .jlvl-label{display:block; margin-bottom:4px;}
  .ob-imbalance-track{
    position:relative; height:22px; border-radius:6px; overflow:hidden; margin-bottom:16px;
    background:var(--bear-dim); display:flex; align-items:center; justify-content:center;
  }
  .ob-imbalance-fill{position:absolute; left:0; top:0; bottom:0; background:var(--bull-dim); transition:width 500ms ease;}
  .ob-imbalance-label{position:relative; z-index:1; font-size:10.5px; font-family:'JetBrains Mono',monospace; color:var(--text-hi); font-weight:600;}
  .ob-columns{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .ob-col-head{font-size:10px; font-weight:700; letter-spacing:.06em; text-align:center; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--hairline-soft);}
  .ob-row{position:relative; display:flex; justify-content:space-between; padding:3px 8px; font-size:11px; border-radius:4px; overflow:hidden; margin-bottom:2px;}
  .ob-bar{position:absolute; top:0; bottom:0; right:0; z-index:0; opacity:.14;}
  .ob-bid .ob-bar{background:var(--bull);}
  .ob-ask .ob-bar{background:var(--bear);}
  .ob-price{position:relative; z-index:1;}
  .ob-bid .ob-price{color:var(--bull);}
  .ob-ask .ob-price{color:var(--bear);}
  .ob-qty{position:relative; z-index:1; color:var(--text-dim);}

  /* ===== Equity Curve ===== */
  .equity-curve-panel{padding:20px 24px; margin-bottom:18px;}
  .equity-svg{width:100%; height:180px; display:block;}
  .equity-curve-foot{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-top:10px; font-family:'JetBrains Mono',monospace;}

  .dash-status-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-bottom:18px;}
  .dash-status-card{padding:16px 18px; display:flex; align-items:center; gap:13px;}
  .dsc-icon{font-size:22px; flex-shrink:0; width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    background:rgba(77,232,240,.08); border-radius:10px;}
  .dsc-title{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px;}
  .dsc-value{font-size:13.5px; font-weight:700; color:var(--text-hi); display:flex; align-items:center;}
  .dsc-value.good{color:var(--bull);}
  .dsc-value.bad{color:var(--bear);}

  .dash-cards-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; margin-bottom:26px;}
  .dash-card{padding:16px; text-align:center; animation:card-in 320ms cubic-bezier(.2,.8,.2,1) backwards;}
  .dash-card-icon{font-size:18px; margin-bottom:8px; opacity:.85;}
  .dash-card-value{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:20px; transition:color 200ms ease;}
  .dash-card-value.cyan{color:var(--cyan); text-shadow:0 0 14px rgba(77,232,240,.35);}
  .dash-card-value.bull{color:var(--bull); text-shadow:0 0 14px rgba(61,220,151,.35);}
  .dash-card-value.bear{color:var(--bear); text-shadow:0 0 14px rgba(229,83,61,.35);}
  .dash-card-value.gold{color:var(--gold); text-shadow:0 0 14px rgba(201,161,74,.35);}
  .dash-card-value.neutral{color:var(--text-hi);}
  .dash-card-label{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:6px;}
  @keyframes card-in{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .dash-section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .dash-section-head h2{font-size:16px; margin:0; font-weight:700; letter-spacing:.01em;}
  .dash-section-count{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}

  .ongoing-signals-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:14px;}
  .signal-card{padding:16px; cursor:pointer;}
  .signal-card:hover{transform:translateY(-2px);}
  .sc-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .sc-sym{font-weight:700; font-size:14.5px; color:var(--text-hi);}
  .sc-price-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .sc-price{font-size:16px; font-weight:700;}
  .sc-pl{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;}
  .sc-pl-wait{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .sc-progress-track{height:5px; border-radius:3px; background:var(--hairline-soft); overflow:hidden; margin-bottom:12px; box-shadow:inset 0 1px 2px rgba(0,0,0,.3);}
  .sc-progress-fill{height:100%; border-radius:3px; transition:width 400ms ease;}
  .sc-progress-fill.bull{background:var(--bull); box-shadow:0 0 8px var(--bull);}
  .sc-progress-fill.bear{background:var(--bear); box-shadow:0 0 8px var(--bear);}
  .sc-levels{display:flex; flex-wrap:wrap; gap:10px; font-size:11.5px; padding:9px 0; border-top:1px solid rgba(255,255,255,.05); border-bottom:1px solid rgba(255,255,255,.05); margin-bottom:10px;}
  .sc-foot{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between;}
  .sc-meta{font-size:10.5px; color:var(--text-mid); display:flex; flex-direction:column; gap:2px;}
  .conf-val{color:var(--gold); font-family:'JetBrains Mono',monospace; font-weight:700;}
  .sc-latest-event{
    margin-top:10px; padding:8px 10px; background:rgba(77,232,240,.05); border-left:2px solid var(--cyan);
    border-radius:0 6px 6px 0; font-size:11px; color:var(--text-mid); line-height:1.5;
  }
  .sc-latest-event .activity-time{color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:10px; margin-left:4px;}
  .sc-journal-link{
    margin-top:10px; text-align:center; font-size:10.5px; color:var(--cyan);
    font-family:'JetBrains Mono',monospace; cursor:pointer; padding:6px 0;
    border-top:1px solid rgba(255,255,255,.05);
  }
  .sc-journal-link:hover{text-decoration:underline;}

  /* ===== Journal tab ===== */
  .journal-stats{display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .jstat{
    background:linear-gradient(165deg, var(--panel-raised), var(--panel));
    border:1px solid var(--hairline); border-radius:10px;
    padding:14px 20px; min-width:110px; text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }
  .jstat-clickable{cursor:pointer; transition:transform 180ms ease, border-color 180ms ease;}
  .jstat-clickable:hover{transform:translateY(-2px); border-color:rgba(255,255,255,.15);}
  .jstat-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; color:var(--text-hi);}
  .jstat-val.bull{color:var(--bull); text-shadow:0 0 12px rgba(61,220,151,.4);}
  .jstat-val.bear{color:var(--bear); text-shadow:0 0 12px rgba(229,83,61,.4);}
  .jstat-val.gold{color:var(--gold); text-shadow:0 0 12px rgba(201,161,74,.4);}
  .jstat-label{font-size:10.5px; color:var(--text-dim); margin-top:4px; letter-spacing:.03em; text-transform:uppercase;}
  .filter-pill.win-loss-pill{font-weight:700;}
  .filter-pill[data-jfilter="winning"]{border-color:var(--bull-dim); color:var(--bull);}
  .filter-pill[data-jfilter="winning"].active{background:var(--bull-dim); box-shadow:0 0 10px -3px var(--bull);}
  .filter-pill[data-jfilter="losing"]{border-color:var(--bear-dim); color:var(--bear);}
  .filter-pill[data-jfilter="losing"].active{background:var(--bear-dim); box-shadow:0 0 10px -3px var(--bear);}

  .journal-cards{display:flex; flex-direction:column; gap:14px;}
  .journal-card{
    background:linear-gradient(165deg, var(--panel-raised), var(--panel));
    border:1px solid var(--hairline); border-radius:12px; padding:16px 18px;
    box-shadow:0 12px 28px -20px rgba(0,0,0,.6);
  }
  .journal-card.is-active{border-color:rgba(77,232,240,.3); box-shadow:0 0 0 1px rgba(77,232,240,.08), 0 12px 28px -20px rgba(0,0,0,.6);}

  .jcard-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .jcard-id{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .jsym-big{font-weight:700; font-size:15px; color:var(--text-hi);}
  .jdisplay-id{font-size:9.5px; color:var(--text-dim); letter-spacing:.02em;}
  .jcard-price{font-size:14px; font-weight:600;}
  .pl-pos{color:var(--bull);}
  .pl-neg{color:var(--bear);}

  .lifecycle-badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.04em;
    border-radius:12px; padding:4px 10px; display:inline-flex; align-items:center;
  }
  .lifecycle-badge.pending{background:var(--wait-dim); color:var(--text-mid);}
  .lifecycle-badge.active{background:var(--cyan-dim); color:var(--cyan); box-shadow:0 0 10px -3px var(--cyan);}
  .lifecycle-badge.bull{background:var(--bull-dim); color:var(--bull); box-shadow:0 0 10px -3px var(--bull);}
  .lifecycle-badge.bear, .lifecycle-badge.cancelled{background:var(--bear-dim); color:var(--bear);}
  .lifecycle-badge.neutral{background:var(--hairline-soft); color:var(--text-dim);}

  .jcard-levels{
    display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--text-mid);
    padding:10px 0; border-top:1px solid var(--hairline-soft); border-bottom:1px solid var(--hairline-soft);
    margin-bottom:10px;
  }
  .jlvl{display:flex; align-items:center; gap:5px;}
  .jlvl-label{font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .jsl{color:var(--bear);}
  .jtp{color:var(--text-dim);}
  .jtp.hit{color:var(--bull); font-weight:700;}
  .jlev{color:var(--gold);}
  .be-tag{font-size:9px; color:var(--cyan); border:1px solid var(--cyan); border-radius:6px; padding:0 4px;}
  .hold-tag{
    font-size:9px; font-weight:700; letter-spacing:.03em; color:var(--gold);
    border:1px solid var(--gold); background:rgba(201,161,74,.1);
    border-radius:8px; padding:2px 7px; margin-left:6px; animation:glow-pulse 2s ease-in-out infinite;
  }
  .journal-card.is-holding{border-color:rgba(201,161,74,.35); box-shadow:0 0 0 1px rgba(201,161,74,.1), 0 12px 28px -20px rgba(0,0,0,.6);}

  .jcard-timeline{display:flex; flex-direction:column; gap:9px;}
  .timeline-row{display:flex; gap:12px; align-items:flex-start;}
  .timeline-time{font-size:10.5px; color:var(--text-dim); min-width:62px; flex-shrink:0; padding-top:1px;}
  .timeline-label{font-size:12.5px; color:var(--text-hi);}
  .timeline-detail{color:var(--text-mid); font-weight:400;}
  .timeline-reason{font-size:11px; color:var(--text-dim); font-style:italic; margin-top:1px; line-height:1.4;}
  .timeline-toggle{
    background:none; border:none; color:var(--cyan); font-size:11px; font-family:'JetBrains Mono',monospace;
    cursor:pointer; padding:8px 0 2px; text-align:left;
  }
  .timeline-toggle:hover{text-decoration:underline;}

  .trade-summary{
    margin-top:14px; padding:14px; background:var(--hairline-soft); border-radius:8px;
    border:1px solid var(--hairline);
  }
  .trade-summary-title{font-size:12.5px; font-weight:700; color:var(--text-hi); margin-bottom:10px;}
  .ts-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:10px; font-size:12px; font-family:'JetBrains Mono',monospace;}
  .ts-label{display:block; font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; font-family:'IBM Plex Sans',sans-serif;}
  .ts-reason{margin-top:10px; font-size:12px; color:var(--text-mid);}

  .jcard-foot{display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px solid var(--hairline-soft); flex-wrap:wrap;}

  .outcome-select{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    background:var(--panel-raised); border:1px solid var(--hairline); color:var(--text-mid);
    border-radius:6px; padding:5px 8px; cursor:pointer;
  }
  .outcome-select.bull{color:var(--bull); border-color:var(--bull-dim);}
  .outcome-select.bear{color:var(--bear); border-color:var(--bear-dim);}
  .journal-footnote{font-size:10.5px; color:var(--text-dim); margin-top:10px; font-style:italic;}
  .journal-retention-note{font-size:10.5px; color:var(--text-dim); margin:-6px 0 14px; font-family:'JetBrains Mono',monospace;}
  .jstat-val.cyan{color:var(--cyan);}

  .journal-filter-row{display:flex; flex-wrap:wrap; gap:18px; margin-bottom:14px; padding:14px 16px; background:var(--hairline-soft); border-radius:10px;}
  .filter-group{display:flex; flex-direction:column; gap:6px;}
  .filter-group-label{font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .date-range-select{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel-raised);
    border:1px solid var(--hairline); color:var(--text-hi); border-radius:6px; padding:6px 9px; cursor:pointer;
  }
  .date-range-select:focus{outline:none; border-color:var(--cyan);}
  .date-input{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel-raised);
    border:1px solid var(--hairline); color:var(--text-hi); border-radius:6px; padding:5px 8px;
  }
  .date-sep{font-size:11px; color:var(--text-dim); align-self:center;}

  .journal-pagination{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:20px;}
  .page-btn{
    font-family:'JetBrains Mono',monospace; font-size:12px; background:var(--panel-raised);
    border:1px solid var(--hairline); color:var(--text-hi); border-radius:7px; padding:8px 16px; cursor:pointer;
  }
  .page-btn:hover:not(:disabled){border-color:var(--cyan); color:var(--cyan);}
  .page-btn:disabled{opacity:.4; cursor:default;}
  .page-info{font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .live-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:7px;
    background:var(--cyan); box-shadow:0 0 6px var(--cyan); animation:radar-blip 1.8s ease-in-out infinite;
    vertical-align:middle;
  }
  .manual-tag{
    margin-left:7px; font-size:9px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;
    border:1px solid var(--hairline); border-radius:8px; padding:1px 6px; vertical-align:middle;
  }
  .source-tag{font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .source-tag.auto{color:var(--cyan);}

  .bias-text{font-size:11px; color:var(--text-mid); font-family:'JetBrains Mono',monospace;}

  .bias-bar-track{
    height:5px; border-radius:3px; background:var(--hairline-soft); margin-top:8px; overflow:hidden;
    position:relative; box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
  }
  .bias-bar-fill{height:100%; border-radius:3px; transition:width .4s ease;}
  .bias-bar-fill.bull{background:var(--bull); box-shadow:0 0 8px var(--bull);}
  .bias-bar-fill.bear{background:var(--bear); box-shadow:0 0 8px var(--bear);}
  .bias-bar-fill.neutral{background:var(--wait);}

  .card-foot{display:flex; justify-content:space-between; align-items:center; margin-top:10px;}
  .amd-chip{
    font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--text-dim);
    border:1px solid var(--hairline-soft); border-radius:4px; padding:2px 6px;
  }
  .kz-chip{font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .kz-chip.active{color:var(--bull);}
  .struct-chip{
    font-size:10px; font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:.03em;
    border-radius:4px; padding:2px 6px; border:1px solid var(--hairline-soft);
  }
  .struct-chip.bull{color:var(--bull); border-color:var(--bull-dim); background:rgba(61,220,151,.06);}
  .struct-chip.bear{color:var(--bear); border-color:var(--bear-dim); background:rgba(229,83,61,.06);}
  .struct-chip.shift-bull{color:var(--gold); border-color:var(--gold-dim); background:rgba(201,161,74,.08);}
  .struct-chip.shift-bear{color:var(--gold); border-color:var(--gold-dim); background:rgba(201,161,74,.08);}
  .struct-chip.neutral{color:var(--text-dim);}

  .card-loading{
    display:flex; align-items:center; gap:7px; margin-top:12px;
    font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;
  }
  .sparkline{width:100%; height:28px; display:block; margin-top:10px; opacity:.85;}
  .spinner{
    width:11px;height:11px;border-radius:50%;
    border:2px solid var(--hairline); border-top-color:var(--bull);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== Expanded detail ===== */
  .detail{
    margin-top:16px; padding-top:16px; border-top:1px solid var(--hairline);
    display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:18px;
  }
  @media (max-width:880px){ .detail{grid-template-columns:1fr;} }

  .detail-col h4{
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim);
    margin:0 0 10px; font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .detail-col h4::before{
    content:''; width:3px; height:11px; background:var(--cyan); border-radius:1px; opacity:.6;
  }
  .levels-table{width:100%; border-collapse:collapse;}
  .levels-table tr{border-bottom:1px solid var(--hairline-soft);}
  .levels-table tr:last-child{border-bottom:none;}
  .levels-table td{padding:6px 0; font-size:12.5px;}
  .levels-table td.label{color:var(--text-mid); font-size:11.5px;}
  .levels-table td.val{font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right;}
  .val.entry{color:var(--focus);}
  .val.sl{color:var(--bear);}
  .val.tp{color:var(--bull);}

  .rr-badge{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    background:var(--panel-raised); border:1px solid var(--hairline-soft);
    border-radius:6px; padding:6px 10px; margin-top:8px;
  }

  .model-tag{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    background:rgba(91,159,229,.1); color:var(--focus); border:1px solid rgba(91,159,229,.25);
    border-radius:5px; padding:4px 9px; margin-bottom:10px;
  }
  .dol-text{font-size:12.5px; color:var(--text-hi); line-height:1.5; margin:0 0 12px;}
  .summary-text{font-size:12.5px; color:var(--text-mid); line-height:1.6; margin:0;}
  .data-quality-note{font-size:11px; font-family:'JetBrains Mono',monospace; margin:10px 0 0; padding:7px 9px; border-radius:6px; line-height:1.5;}
  .data-quality-note.real{color:var(--bull); background:rgba(61,220,151,.06);}
  .data-quality-note.placeholder{color:var(--gold); background:rgba(201,161,74,.08);}

  .key-levels-list{list-style:none; margin:0; padding:0; font-size:12px;}
  .key-levels-list li{
    display:flex; justify-content:space-between; padding:5px 0;
    border-bottom:1px solid var(--hairline-soft);
  }
  .key-levels-list li:last-child{border-bottom:none;}
  .key-levels-list .klabel{color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.03em;}
  .key-levels-list .kval{font-family:'JetBrains Mono',monospace; color:var(--text-hi);}
  .kval-sub{color:var(--text-dim); font-size:10.5px;}
  .kval.htf-agree{color:var(--bull);}
  .kval.htf-disagree{color:var(--gold);}

  .reanalyze-btn{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    background:transparent; border:1px solid var(--hairline); color:var(--text-mid);
    border-radius:6px; padding:6px 11px; cursor:pointer; margin-top:14px;
  }
  .reanalyze-btn:hover{color:var(--text-hi); border-color:var(--text-dim);}
  .detail-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .detail-actions .reanalyze-btn{margin-top:14px;}
  .journal-log-btn{
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600;
    background:rgba(201,161,74,.08); border:1px solid var(--gold-dim); color:var(--gold);
    border-radius:6px; padding:6px 11px; cursor:pointer; margin-top:14px;
  }
  .journal-log-btn:hover{background:rgba(201,161,74,.14); border-color:var(--gold);}
  .journal-log-btn:disabled{opacity:.5; cursor:default;}

  .lev-stop-dist{font-size:11px; color:var(--text-dim); margin-bottom:8px;}
  .lev-table th{
    font-size:10px; text-align:right; color:var(--text-dim); font-family:'JetBrains Mono',monospace;
    font-weight:600; letter-spacing:.03em; padding-bottom:6px; border-bottom:1px solid var(--hairline-soft);
  }
  .lev-table th:first-child{text-align:left;}
  .lev-table td.label{text-align:left;}
  .lev-val{color:var(--gold) !important;}
  .lev-note{font-size:10.5px; color:var(--text-dim); line-height:1.5; margin:10px 0 0; font-style:italic;}
  .lev-empty{font-size:12px; color:var(--text-dim);}
  .collapse-btn{
    position:absolute; top:14px; right:14px;
    background:transparent; border:none; color:var(--text-dim); cursor:pointer; font-size:18px;
    line-height:1; padding:2px 6px;
  }
  .collapse-btn:hover{color:var(--text-hi);}

  /* ===== Gold panel ===== */
  .gold-panel{
    background:linear-gradient(165deg, var(--panel-raised), var(--panel));
    border:1px solid var(--hairline); border-radius:12px; padding:24px;
    box-shadow:0 16px 40px -24px rgba(0,0,0,.7);
  }
  .gold-header{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px; margin-bottom:20px;}
  .gold-title-block{display:flex; align-items:center; gap:14px;}
  .gold-badge{
    width:48px;height:48px;border-radius:10px; background:linear-gradient(160deg,var(--gold),#8a6d2e);
    display:flex;align-items:center;justify-content:center; font-weight:800; font-family:'JetBrains Mono',monospace;
    color:#1f1605; font-size:16px;
    box-shadow:0 0 0 1px rgba(201,161,74,.3), 0 0 22px rgba(201,161,74,.3), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .gold-price{font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:700;}
  .gold-source{font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:2px;}
