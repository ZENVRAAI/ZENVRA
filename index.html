function formatSignalForShare(e, mode){
  const lev1 = e.leverageSuggestion&&e.leverageSuggestion.tiers?e.leverageSuggestion.tiers.find(function(t){return t.riskPct===1;}):null;
  const dirEmoji = e.signal==='LONG'?'🟢':'🔴';
  const dir = e.signal==='LONG'?'📈 LONG':'📉 SHORT';
  const time = fmtBinanceTime(new Date(e.signalGeneratedAt||e.loggedAt));
  const outcome = deriveOutcome(e);
  var currentPrice = e.pair?(state.marketData[e.pair]&&state.marketData[e.pair].price):state.gold.price;
  if(currentPrice==null) currentPrice=e.exitPrice||e.entryPrice;
  const livePL = e.status==='active'?calcPL(e,currentPrice):e.exitPrice!=null?calcPL(e,e.exitPrice):null;
  if(!mode||mode==='signal'){
    const lines=[
      '━━━━━━━━━━━━━━━━━━━━━━',
      '⚡ ZENVRA AI — NEW SIGNAL',
      '━━━━━━━━━━━━━━━━━━━━━━',
      '',
      dirEmoji+' '+dir+'  '+e.symbol,
      '',
      '📍 Entry:      '+fmtPrice(e.entryPrice),
      '🛑 Stop Loss:  '+fmtPrice(e.originalStopLoss||e.stopLoss),
      '🎯 TP1:        '+fmtPrice(e.tp1),
      '🎯 TP2:        '+fmtPrice(e.tp2),
      '🎯 TP3:        '+fmtPrice(e.tp3),
      e.tp4!=null?'🎯 TP4:        '+fmtPrice(e.tp4)+' (if trend holds)':null,
      e.tp5!=null?'🎯 TP5:        '+fmtPrice(e.tp5)+' (full runner)':null,
      '',
      '⚖️  R:R:        '+(e.rr||'—'),
      lev1?'📊 Leverage:   '+lev1.leverage+'x fixed  (1% risk | '+lev1.marginPct.toFixed(1)+'% margin)':null,
      '🏛  Model:      '+(e.entryModel||'—'),
      '📐 Structure:  '+structureLabel(e.structure),
      '🧠 AI Conf.:   '+(e.biasStrengthAtLog||'—')+'%',
      '🕐 Session:    '+(e.killZone||'—'),
      e.premiumDiscount?'💹 Zone:       '+e.premiumDiscount:null,
      e.aligned?'✅ ALIGNED — Signal, Structure & HTF all agree':null,
      '',
      '⏰ Signal Time: '+time+' UTC',
      '',
      '━━━━━━━━━━━━━━━━━━━━━━',
      '⚠️ Not financial advice. DYOR.',
      '━━━━━━━━━━━━━━━━━━━━━━',
    ];
    return lines.filter(function(l){return l!==null&&l!==undefined;}).join('\n');
  }
  // update format
  const statusLine=outcome==='stopped'?'🔴 STOPPED OUT':outcome==='hit-tp5'?'🏆 FULL RUNNER — ALL 5 TARGETS HIT':outcome==='hit-tp4'?'🎯 TP4 HIT — holding for TP5':outcome==='hit-tp3'?'🎯 TP3 HIT'+(e.holding?' — HOLDING RUNNER':''):outcome==='hit-tp2'?'🎯 TP2 HIT':outcome==='hit-tp1'?'🎯 TP1 HIT':'🚀 ACTIVE';
  const recent=e.events.slice(-5).map(function(ev){
    return fmtBinanceTime(new Date(ev.at)).slice(11,16)+' UTC  '+ev.emoji+' '+ev.label+(ev.detail?' — '+ev.detail:'');
  }).join('\n');
  const dur=e.closedAt?fmtDuration(new Date(e.closedAt)-new Date(e.signalGeneratedAt||e.loggedAt)):null;
  const lines=[
    '━━━━━━━━━━━━━━━━━━━━━━',
    '📡 ZENVRA AI — TRADE UPDATE',
    '━━━━━━━━━━━━━━━━━━━━━━',
    '',
    dirEmoji+' '+dir+'  '+e.symbol+'  |  '+statusLine,
    '',
    '📍 Entry:      '+fmtPrice(e.entryPrice),
    '💰 Current:    '+fmtPrice(currentPrice)+(livePL!=null?' ('+(livePL>=0?'+':'')+livePL.toFixed(2)+'%)':''),
    '🛑 Stop Loss:  '+fmtPrice(e.stopLoss)+(e.breakevenSet?'  🛡️ Breakeven':''),
    '🎯 TP1:        '+fmtPrice(e.tp1)+(e.tp1Hit?'  ✅ HIT'+(e.tp1HitAt?' @ '+fmtBinanceTime(new Date(e.tp1HitAt)).slice(11,16)+' UTC':''):''),
    '🎯 TP2:        '+fmtPrice(e.tp2)+(e.tp2Hit?'  ✅ HIT'+(e.tp2HitAt?' @ '+fmtBinanceTime(new Date(e.tp2HitAt)).slice(11,16)+' UTC':''):''),
    '🎯 TP3:        '+fmtPrice(e.tp3)+(e.tp3Hit?'  ✅ HIT'+(e.tp3HitAt?' @ '+fmtBinanceTime(new Date(e.tp3HitAt)).slice(11,16)+' UTC':''):''),
    e.tp4!=null?'🎯 TP4:        '+fmtPrice(e.tp4)+(e.tp4Hit?'  ✅ HIT'+(e.tp4HitAt?' @ '+fmtBinanceTime(new Date(e.tp4HitAt)).slice(11,16)+' UTC':''):(e.holding?'  (holding)':'')):null,
    e.tp5!=null?'🎯 TP5:        '+fmtPrice(e.tp5)+(e.tp5Hit?'  ✅ HIT'+(e.tp5HitAt?' @ '+fmtBinanceTime(new Date(e.tp5HitAt)).slice(11,16)+' UTC':''):(e.holding?'  (holding)':'')):null,
    '',
    '⏰ Signal:  '+time.slice(0,16)+' UTC',
    dur?'⏱️  Duration: '+dur:null,
    '',
    '📋 Recent Activity:',
    recent,
    '',
    '━━━━━━━━━━━━━━━━━━━━━━',
    '⚠️ Not financial advice. DYOR.',
    '━━━━━━━━━━━━━━━━━━━━━━',
  ];
  return lines.filter(function(l){return l!==null&&l!==undefined;}).join('\n');
}

    else{document.execCommand('copy');showToast('Copied!');}

  const cs=document.getElementById('scp-signal'); if(cs) cs.addEventListener('click',function(){copyTA('sta-signal');});
  const cu=document.getElementById('scp-update'); if(cu) cu.addEventListener('click',function(){copyTA('sta-update');});
  ov.querySelectorAll('.share-tab-btn').forEach(function(tb){
    tb.addEventListener('click',function(){

    });
  });
}

let zvhBtcFetching = false;
function zvhEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function zvhPct(n){ if (n==null || !isFinite(n)) return '-'; return (n>=0?'+':'') + n.toFixed(2) + '%'; }
function zvhNow(e){
  if (e.pair && state.marketData[e.pair] && state.marketData[e.pair].price) return state.marketData[e.pair].price;
  if (/XAU|GOLD/i.test(String(e.symbol)) && state.gold && state.gold.price) return state.gold.price;
  return null;
}
function zvhCandles(kl){
  const k = (kl || []).slice(-48);
  if (k.length < 5) return '<div class="zvh-empty">Loading chart…</div>';
  const W = 320, H = 110, pad = 6;
  let hi = -Infinity, lo = Infinity;
  k.forEach(function(c){ hi = Math.max(hi, +c[2]); lo = Math.min(lo, +c[3]); });
  const rng = (hi - lo) || 1, bw = W / k.length;
  const y = function(v){ return pad + (hi - v) / rng * (H - 2 * pad); };
  let out = '';
  k.forEach(function(c, i){
    const o = +c[1], h = +c[2], l = +c[3], cl = +c[4];

function zvFeatures(e){

  if (e.symbol) f.push('coin:' + e.symbol);
  if (e.mode) f.push('mode:' + e.mode);
  return f;
}
function zvBrainSync(){
  let changed = false;
  try { keSyncLive(); } catch (e) {}
  (state.journal || []).forEach(function(e){
    if (e.brainCounted || e.status !== 'closed' || e.exitPrice == null) return;
    const pl = calcPL(e, e.exitPrice);

    zvFeatures(e).forEach(function(k){
      const s = ZV.brain.stats[k] || (ZV.brain.stats[k] = { n:0, w:0, pl:0 });
      s.n++; if (pl > 0) s.w++; s.pl += pl;
    });

  });
  return changed;
}
function zvBrainScore(a){
  const f = zvFeatures({ signal:a.signal, entryModel:a.entryModel, killZone:getActiveKZNow().label, htfAgrees:a.htfAgrees,
    biasStrengthAtLog:(a.biasStrength != null ? Math.round(a.biasStrength) : null), symbol:a.symbol });
  let wsum = 0, acc = 0, top = 0;
  f.forEach(function(k){
    const s = ZV.brain.stats[k]; if (!s || !s.n) return;
    const wr = (s.w + 2) / (s.n + 4), wt = Math.min(s.n, 30);
    wsum += wt; acc += wr * wt; top = Math.max(top, s.n);
  });
  return wsum ? { score: Math.round(acc / wsum * 100), n: top } : { score: null, n: 0 };
}
/* Journal gate. In strict mode, every auto-detected setup is DEEP-VERIFIED before it is logged:

const _zvOrigLog = logSetupToJournal;

function zvTrend(k, period){
  const c = k.map(function(x){ return +x[4]; }), h = k.map(function(x){ return +x[2]; }), l = k.map(function(x){ return +x[3]; });
  const kk = 2 / (period + 1); let e = c[0];
  for (let i = 1; i < c.length; i++) e = c[i] * kk + e * (1 - kk);
  const sh = [], sl = [];
  for (let i = 2; i < h.length - 2; i++) {
    if (h[i] > h[i-1] && h[i] > h[i-2] && h[i] > h[i+1] && h[i] > h[i+2]) sh.push(h[i]);
    if (l[i] < l[i-1] && l[i] < l[i-2] && l[i] < l[i+1] && l[i] < l[i+2]) sl.push(l[i]);
  }
  let st = 'Undetermined';
  if (sh.length >= 2 && sl.length >= 2) {
    const hh = sh[sh.length-1] > sh[sh.length-2], hl = sl[sl.length-1] > sl[sl.length-2];
    st = (hh && hl) ? 'HH-HL' : (!hh && !hl) ? 'LH-LL' : hh ? 'MSS-Bullish-Break' : 'MSS-Bearish-Break';
  }
  return { bias: c[c.length-1] >= e ? 'Bullish' : 'Bearish', structure: st };
}

logSetupToJournal = function(sym, pair, analysis, source){

/* ---------- liquidity engine ---------- */
function zvLiquidity(k1h, k1d, k1w, price){
  const lv = [];
  const add = function(p, label, strength){ if (isFinite(p) && p > 0) lv.push({ price:p, label:label, strength:strength, side: p > price ? 'BSL' : 'SSL' }); };
  if (k1d.length >= 2) {
    const y = k1d[k1d.length - 2], t = k1d[k1d.length - 1];
    add(+y[2], 'PDH', 3); add(+y[3], 'PDL', 3); add(+t[2], 'Today high', 2); add(+t[3], 'Today low', 2);
  }
  if (k1w.length >= 2) { const w = k1w[k1w.length - 2]; add(+w[2], 'PWH', 4); add(+w[3], 'PWL', 4); }
  const H = k1h.map(function(c){ return +c[2]; }), L = k1h.map(function(c){ return +c[3]; });
  const sh = [], sl = [];
  for (let i = 2; i < H.length - 2; i++) {
    if (H[i] > H[i-1] && H[i] > H[i-2] && H[i] > H[i+1] && H[i] > H[i+2]) sh.push(H[i]);
    if (L[i] < L[i-1] && L[i] < L[i-2] && L[i] < L[i+1] && L[i] < L[i+2]) sl.push(L[i]);
  }
  const tol = price * 0.0015;
  const cluster = function(arr){
    const out = [];
    arr.slice().sort(function(a, b){ return a - b; }).forEach(function(v){
      const g = out.find(function(o){ return Math.abs(o.p - v) <= tol; });
      if (g) { g.n++; g.p = (g.p * (g.n - 1) + v) / g.n; } else out.push({ p:v, n:1 });
    });
    return out;
  };
  cluster(sh).forEach(function(g){ add(g.p, g.n >= 2 ? 'EQH x' + g.n : 'Swing high', g.n >= 2 ? 2 + g.n : 1); });
  cluster(sl).forEach(function(g){ add(g.p, g.n >= 2 ? 'EQL x' + g.n : 'Swing low', g.n >= 2 ? 2 + g.n : 1); });
  const step = Math.pow(10, Math.floor(Math.log10(price)) - 1) * 5;
  const base = Math.floor(price / step) * step;
  [base - step, base, base + step, base + 2 * step].forEach(function(p){ add(p, 'Round ' + fmtPrice(p), 1); });
  // merge near-duplicates (keep strongest), keep +/-12%
  lv.sort(function(a, b){ return b.price - a.price; });
  const merged = [];
  lv.forEach(function(l){
    if (Math.abs(l.price - price) / price > 0.12) return;
    const near = merged.find(function(m){ return Math.abs(m.price - l.price) <= tol * 0.8; });
    if (near) { if (l.strength > near.strength) { near.label = l.label + (near.label !== l.label ? ' / ' + near.label : ''); near.strength = l.strength; near.price = l.price; } else near.label += ' / ' + l.label; }
    else merged.push({ price:l.price, label:l.label, strength:l.strength, side:l.side });
  });
  merged.sort(function(a, b){ return b.price - a.price; });
  let magnet = null, best = 0;
  merged.forEach(function(l){
    const d = Math.abs(l.price - price) / price * 100;
    const pull = l.strength / Math.max(d, 0.1);
    l.dist = (l.price - price) / price * 100;
    if (l.strength >= 2 && pull > best) { best = pull; magnet = l; }
  });
  // sweep detection on the last 8 hourly candles
  let sweep = null;
  const rec = k1h.slice(-8);
  merged.filter(function(l){ return l.strength >= 2; }).forEach(function(l){
    rec.forEach(function(c, i){
      const hi = +c[2], lo = +c[3], cl = +c[4], ago = rec.length - 1 - i;
      let s = null;
      if (hi > l.price && cl < l.price && l.price > Math.min(price, cl) && l.label.indexOf('low') < 0 && l.label.indexOf('EQL') < 0 && l.label !== 'PDL' && l.label !== 'PWL') s = { dir:'bear', text:'Buy-side liquidity swept at ' + l.label + ' and rejected', level:l.price, ago:ago };
      if (lo < l.price && cl > l.price && l.price < Math.max(price, cl) && (l.label.indexOf('low') >= 0 || l.label.indexOf('EQL') >= 0 || l.label === 'PDL' || l.label === 'PWL')) s = { dir:'bull', text:'Sell-side liquidity swept at ' + l.label + ' and reclaimed', level:l.price, ago:ago };
      if (s && (!sweep || s.ago < sweep.ago)) sweep = s;
    });
  });
  return { levels: merged, magnet: magnet, sweep: sweep };
}

    g('/futures/data/takerlongshortRatio' + q, 120000),
    g('/futures/data/openInterestHist' + q, 120000),
    g('/fapi/v1/aggTrades?symbol=' + sym + '&limit=1000', 20000)
  ]);
  const top = res[0], glob = res[1], taker = res[2], oi = res[3], agg = res[4];
  const out = { ok: !!(top || glob || taker || oi || agg), notes: [] };
  let score = 0;
  if (top && top.length >= 2) {
    const a = +top[0].longShortRatio, b = +top[top.length - 1].longShortRatio;
    out.top = { now: b, chg: (b - a) / a * 100, longPct: +top[top.length - 1].longAccount * 100 };
    if (b > 1 && b >= a) { score++; out.notes.push('Top traders are net long and adding'); }
    else if (b < 1 && b <= a) { score--; out.notes.push('Top traders are net short and adding'); }
    else out.notes.push('Top traders are reducing their lean');
  }
  if (glob && glob.length) {
    const b = +glob[glob.length - 1].longShortRatio;
    out.retail = { now: b, longPct: +glob[glob.length - 1].longAccount * 100 };
    if (b > 1.8) { score--; out.notes.push('Retail is heavily long (crowded, contrarian bearish)'); }
    else if (b < 0.8) { score++; out.notes.push('Retail is heavily short (crowded, contrarian bullish)'); }
  }
  if (taker && taker.length) {
    const r = taker.slice(-6).map(function(x){ return +x.buySellRatio; });
    const avg = r.reduce(function(s, v){ return s + v; }, 0) / r.length;
    out.taker = { avg: avg };
    if (avg > 1.03) { score++; out.notes.push('Aggressive buyers dominate taker flow'); }
    else if (avg < 0.97) { score--; out.notes.push('Aggressive sellers dominate taker flow'); }
  }
  if (oi && oi.length >= 2) {
    const a = +oi[Math.max(0, oi.length - 7)].sumOpenInterestValue, b = +oi[oi.length - 1].sumOpenInterestValue;
    const oiChg = (b - a) / a * 100;
    let pxChg = 0;
    if (k1h && k1h.length > 7) pxChg = (+k1h[k1h.length - 1][4] - +k1h[k1h.length - 7][4]) / +k1h[k1h.length - 7][4] * 100;
    out.oi = { chg: oiChg, px: pxChg };
    if (oiChg > 1 && pxChg > 0) { score++; out.notes.push('Open interest rising with price: new longs, trend fuel'); }
    else if (oiChg > 1 && pxChg < 0) { score--; out.notes.push('Open interest rising as price falls: new shorts'); }
    else if (oiChg < -1) out.notes.push('Open interest falling: positions closing, move may be exhausted');
  }
  if (agg && agg.length) {
    const notional = agg.map(function(t){ return +t.p * +t.q; });
    const sorted = notional.slice().sort(function(a, b){ return a - b; });
    const thr = Math.max(sorted[Math.floor(sorted.length * 0.98)] || 0, 25000);
    let buy = 0, sell = 0; const big = [];
    agg.forEach(function(t, i){
      const n = notional[i]; if (n < thr) return;
      if (t.m) sell += n; else buy += n;
      big.push({ t: t.T, side: t.m ? 'SELL' : 'BUY', usd: n, price: +t.p });
    });
    big.sort(function(a, b){ return b.usd - a.usd; });
    const tot = buy + sell;
    out.trades = { thr: thr, buy: buy, sell: sell, big: big.slice(0, 6), buyPct: tot ? buy / tot * 100 : 50 };
    if (tot && out.trades.buyPct > 58) { score++; out.notes.push('Large trades are mostly buys'); }
    else if (tot && out.trades.buyPct < 42) { score--; out.notes.push('Large trades are mostly sells'); }
  }
  out.score = score;
  out.dir = score >= 2 ? 1 : score <= -2 ? -1 : 0;
  out.verdict = out.dir > 0 ? 'Bullish: smart-money flow is accumulating' : out.dir < 0 ? 'Bearish: smart-money flow is distributing' : 'Mixed: no clear smart-money edge';
  return out;
}

/* ---------- strategy detectors ---------- */
function zvDetectors(b){
  const sc = b.scaffold, a = b.analysis, liq = b.liq, out = [];
  const sw = liq.sweep;
  out.push({ name:'Liquidity sweep reversal', on: !!sw && sw.ago <= 4, dir: sw ? (sw.dir === 'bull' ? 'LONG' : 'SHORT') : null,
    note: sw ? sw.text + ' (' + sw.ago + 'h ago)' : 'No fresh sweep of a major level in the last 8 hours' });
  const hi = sc.lastSwingHigh, lo = sc.lastSwingLow, p = sc.currentPrice;
  let ote = { name:'OTE retracement (62-79%)', on:false, dir:null, note:'Price is not in the optimal trade entry band' };
  if (hi > lo) {
    const retrBull = (hi - p) / (hi - lo), retrBear = (p - lo) / (hi - lo);
    if (sc.structure && /bull/i.test(sc.structure) && retrBull >= 0.62 && retrBull <= 0.79) ote = { name:ote.name, on:true, dir:'LONG', note:'Pulled back ' + Math.round(retrBull * 100) + '% of the last up-leg in a bullish structure' };
    else if (sc.structure && /bear/i.test(sc.structure) && retrBear >= 0.62 && retrBear <= 0.79) ote = { name:ote.name, on:true, dir:'SHORT', note:'Retraced ' + Math.round(retrBear * 100) + '% of the last down-leg in a bearish structure' };
  }
  out.push(ote);
  const pdOk = (sc.premiumDiscount === 'Discount' && a.signal === 'LONG') || (sc.premiumDiscount === 'Premium' && a.signal === 'SHORT');
  out.push({ name:'Premium / discount alignment', on: pdOk, dir: pdOk ? a.signal : null,
    note: sc.premiumDiscount + ' of the range' + (a.signal === 'WAIT' ? ' (no setup yet)' : pdOk ? ': buying cheap / selling expensive' : ': trade is on the wrong side of the range') });
  const kz = getActiveKZNow().label;
  out.push({ name:'Kill zone / Silver Bullet timing', on: !!sc.realSilverBulletActive || /London|NY/i.test(kz), dir:null, note:'Current session: ' + kz + (sc.realSilverBulletActive ? ' (Silver Bullet window live)' : '') });
  // Wyckoff-style spring / upthrust on the hourly chart
  const k = b.k1h.slice(-40), body = k.slice(0, -3);
  let wy = { name:'Wyckoff spring / upthrust', on:false, dir:null, note:'No spring or upthrust at the edge of the recent range' };
  if (body.length > 20) {
    const rl = Math.min.apply(null, body.map(function(c){ return +c[3]; })), rh = Math.max.apply(null, body.map(function(c){ return +c[2]; }));
    const avgV = body.reduce(function(s, c){ return s + +c[5]; }, 0) / body.length;
    k.slice(-3).forEach(function(c){
      if (+c[3] < rl && +c[4] > rl && +c[5] > avgV) wy = { name:wy.name, on:true, dir:'LONG', note:'Spring: wick under the range low with above-average volume, then closed back inside' };
      if (+c[2] > rh && +c[4] < rh && +c[5] > avgV) wy = { name:wy.name, on:true, dir:'SHORT', note:'Upthrust: wick above the range high with above-average volume, then closed back inside' };
    });
  }
  out.push(wy);
  return out;
}

/* ---------- composite quality score ---------- */
function zvProScore(b){
  const a = b.analysis, dir = a.signal, parts = [];
  if (dir === 'WAIT') return { score:null, grade:'-', parts:[{ t:'No active setup. The engine is waiting for structure, liquidity and timing to line up.', v:0 }] };
  let s = 50;
  const add = function(t, v){ parts.push({ t:t, v:v }); s += v; };
  add(a.htfAgrees ? 'Higher timeframe agrees' : 'Higher timeframe is mixed', a.htfAgrees ? 12 : -8);
  const sw = b.liq.sweep;
  if (sw) { const ok = (dir === 'LONG' && sw.dir === 'bull') || (dir === 'SHORT' && sw.dir === 'bear'); add(ok ? 'A recent liquidity sweep supports the trade' : 'A recent sweep points the other way', ok ? 14 : -10); }
  const m = b.liq.magnet;
  if (m) { const ok = (dir === 'LONG' && m.side === 'BSL') || (dir === 'SHORT' && m.side === 'SSL'); add(ok ? 'The strongest nearby liquidity pool lies in the trade direction' : 'The strongest nearby liquidity pool sits against the trade', ok ? 8 : -6); }
  if (b.whale && b.whale.ok && b.whale.dir) { const ok = (dir === 'LONG' && b.whale.dir > 0) || (dir === 'SHORT' && b.whale.dir < 0); add(ok ? 'Smart-money flow agrees' : 'Smart-money flow disagrees', ok ? 12 : -12); }
  if (b.brain && b.brain.score != null) add('Your history: ' + b.brain.score + '% win rate on similar setups (' + b.brain.n + ' trades)', Math.round((b.brain.score - 50) * 0.3));
  if (a.rr != null) add('Reward to risk ' + a.rr, a.rr >= 2 ? 8 : (a.rr < 1.2 ? -8 : 0));
  const kz = getActiveKZNow().label; if (/London|NY|Silver/i.test(kz)) add('Active session: ' + kz, 6);
  s = Math.max(0, Math.min(100, Math.round(s)));
  return { score:s, grade: s >= 80 ? 'A' : s >= 65 ? 'B' : s >= 50 ? 'C' : 'D', parts:parts };
}

/* ---------- BACKTEST (real Binance history, same engine) ---------- */
function zvKzAt(t){
  const d = new Date(t), h = d.getUTCHours() + d.getUTCMinutes() / 60;
  return KZ_SEGMENTS.find(function(g){ return h >= g.startH && h < g.endH; }) || KZ_SEGMENTS[KZ_SEGMENTS.length - 1];
}
function zvHtfFrom(kl){
  const h1 = [];
  for (let i = kl.length - 200; i < kl.length; i += 4) {
    if (i < 0) continue;
    const g = kl.slice(i, i + 4);
    h1.push({ h: Math.max.apply(null, g.map(function(x){ return +x[2]; })), l: Math.min.apply(null, g.map(function(x){ return +x[3]; })), c: +g[g.length - 1][4] });
  }
  if (h1.length < 10) return null;
  const closes = h1.map(function(x){ return x.c; }), highs = h1.map(function(x){ return x.h; }), lows = h1.map(function(x){ return x.l; });
  const k = 2 / (Math.min(20, closes.length) + 1); let e = closes[0];
  for (let i = 1; i < closes.length; i++) e = closes[i] * k + e * (1 - k);
  const sh = [], sl = [];
  for (let i = 2; i < highs.length - 2; i++) {
    if (highs[i] > highs[i-1] && highs[i] > highs[i-2] && highs[i] > highs[i+1] && highs[i] > highs[i+2]) sh.push(highs[i]);
    if (lows[i] < lows[i-1] && lows[i] < lows[i-2] && lows[i] < lows[i+1] && lows[i] < lows[i+2]) sl.push(lows[i]);
  }
  let st = 'Undetermined';
  if (sh.length >= 2 && sl.length >= 2) {
    const hh = sh[sh.length-1] > sh[sh.length-2], hl = sl[sl.length-1] > sl[sl.length-2];
    st = (hh && hl) ? 'HH-HL' : (!hh && !hl) ? 'LH-LL' : (hh && !hl) ? 'MSS-Bullish-Break' : 'MSS-Bearish-Break';
  }
  return { bias: closes[closes.length-1] >= e ? 'Bullish' : 'Bearish', structure: st, recentHigh: Math.max.apply(null, highs.slice(-20)), recentLow: Math.min.apply(null, lows.slice(-20)) };
}

          if (long ? hi >= a.tp3 : lo <= a.tp3) h3 = true;

function zvSearchAttr(s){ return zvhEsc(String(s).toLowerCase()); }
function zvFilterBind(tc){
  const i = tc.querySelector('[data-zvfilter]'); if (!i) return;
  const apply = function(){
    const q = i.value.trim().toLowerCase();
    tc.querySelectorAll('[data-s]').forEach(function(el){ el.style.display = (!q || el.getAttribute('data-s').indexOf(q) >= 0) ? '' : 'none'; });
  };
  i.addEventListener('input', function(){ ZV.lq = i.value; apply(); });
  if (ZV.lq) { i.value = ZV.lq; apply(); }
}

   rule weights are TRAINED from real Binance history and from your own
   closed trades. Rules and training run entirely in this app.
   =================================================================== */
ZV.ke = { hist:{ base:{ n:0, w:0 }, rules:{}, buckets:{} }, live:{ base:{ n:0, w:0 }, rules:{} }, trainedAt:0, samples:0, minScore:65, coins:0 };
ZV.keData = {};
try { const _k = JSON.parse(localStorage.getItem('zv.ke.v1') || 'null'); if (_k && _k.hist) ZV.ke = _k; } catch (e) {}
const KE_CATS = { trend:'Trend and regime', mom:'Momentum and volume', smc:'Smart money structure', der:'Derivatives positioning', ctx:'Market context', risk:'Risk and process', tok:'Token quality' };

/* ---------- indicators ---------- */
function keEma(a, n){ const k = 2 / (n + 1); let e = a[0]; for (let i = 1; i < a.length; i++) e = a[i] * k + e * (1 - k); return e; }
function keRsiSeries(c, n){
  n = n || 14; const out = new Array(c.length).fill(50); if (c.length < n + 2) return out;
  let g = 0, l = 0; for (let i = 1; i <= n; i++) { const d = c[i] - c[i-1]; if (d >= 0) g += d; else l -= d; }
  let ag = g / n, al = l / n; out[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = n + 1; i < c.length; i++) { const d = c[i] - c[i-1]; ag = (ag * (n - 1) + (d > 0 ? d : 0)) / n; al = (al * (n - 1) + (d < 0 ? -d : 0)) / n; out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al); }
  return out;
}
function keRsi(c, n){ const s = keRsiSeries(c, n); return s[s.length - 1]; }
function keAtr(k, n){
  n = n || 14; const m = Math.min(n, k.length - 1); if (m < 2) return 0; let s = 0;
  for (let i = k.length - m; i < k.length; i++) { const h = +k[i][2], l = +k[i][3], pc = +k[i-1][4]; s += Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)); }
  return s / m;
}
function keEff(c, n){
  n = n || 20; if (c.length < n + 1) return 0.3; const a = c.slice(-n - 1); let path = 0;
  for (let i = 1; i < a.length; i++) path += Math.abs(a[i] - a[i-1]);
  return path ? Math.abs(a[a.length-1] - a[0]) / path : 0;
}
function keCut(arr, t, dur){ let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (+arr[m][0] + dur <= t) lo = m + 1; else hi = m; } return lo; }

/* ---------- plan (structure stop, liquidity-aware targets) ---------- */
function kePlan(d, dir){
  const px = d.px, k = d.k15.slice(-60), atr = keAtr(k, 14) || px * 0.004, sc = d.sc;
  const rec = d.k15.slice(-24);
  let stop;
  if (dir > 0) {
    const lo = Math.min.apply(null, rec.map(function(x){ return +x[3]; }));
    stop = Math.min(isFinite(sc.lastSwingLow) ? sc.lastSwingLow : px - atr * 2, lo) - atr * 0.3;
    if (px - stop < atr * 1.2) stop = px - atr * 1.2;
    if (px - stop > px * 0.05) stop = px * 0.95;
  } else {
    const hi = Math.max.apply(null, rec.map(function(x){ return +x[2]; }));
    stop = Math.max(isFinite(sc.lastSwingHigh) ? sc.lastSwingHigh : px + atr * 2, hi) + atr * 0.3;
    if (stop - px < atr * 1.2) stop = px + atr * 1.2;
    if (stop - px > px * 0.05) stop = px * 1.05;
  }
  const risk = Math.abs(px - stop);
  let rr = 3;
  if (d.liq) {
    const ahead = d.liq.levels.filter(function(l){ return l.strength >= 2 && (dir > 0 ? l.price > px : l.price < px); })
      .sort(function(a, b){ return dir > 0 ? a.price - b.price : b.price - a.price; })[0];
    if (ahead) rr = Math.min(5, Math.abs(ahead.price - px) / risk);
  }
  return { entry: px, stop: stop, tp1: px + dir * risk, tp2: px + dir * 2 * risk, tp3: px + dir * 3 * risk, risk: risk, rr: rr };
}

/* ---------- rule base ---------- */
const KE_RULES = [];
function keRule(id, cat, name, w, fn){ KE_RULES.push({ id:id, cat:cat, name:name, w:w, fn:fn }); }
function ke(s, note, veto){ return { s:s, note:note || '', veto:veto || null }; }
function keZone(c){
  const sc = c.sc, px = c.px, atr = keAtr(c.k15.slice(-60), 14) || px * 0.004, hi = sc.lastSwingHigh, lo = sc.lastSwingLow, leg = hi - lo, z = [];
  if (c.dir > 0) {
    if (sc.bullFVG && px >= sc.bullFVG.bottom - atr * 0.1 && px <= sc.bullFVG.top + atr * 0.25) z.push('FVG');
    if (leg > 0 && px >= hi - leg * 0.79 && px <= hi - leg * 0.62) z.push('OTE');
    if (sc.prevSwingLow > sc.lastSwingLow && px > sc.prevSwingLow && px <= sc.prevSwingLow + atr * 0.5) z.push('Breaker');
  } else {
    if (sc.bearFVG && px <= sc.bearFVG.top + atr * 0.1 && px >= sc.bearFVG.bottom - atr * 0.25) z.push('FVG');
    if (leg > 0 && px >= lo + leg * 0.62 && px <= lo + leg * 0.79) z.push('OTE');
    if (sc.prevSwingHigh < sc.lastSwingHigh && px < sc.prevSwingHigh && px >= sc.prevSwingHigh - atr * 0.5) z.push('Breaker');
  }
  return z;
}
const keOpp = function(t, d){ return (d > 0 && (t.structure === 'LH-LL' || t.structure === 'MSS-Bearish-Break')) || (d < 0 && (t.structure === 'HH-HL' || t.structure === 'MSS-Bullish-Break')); };

/* TREND AND REGIME */
keRule('t4h', 'trend', '4H trend agrees', 3, function(c){
  if (!c.k4h || c.k4h.length < 30) return ke(null);
  const t = zvTrend(c.k4h, 20), d = c.dir, al = (d > 0 && t.bias === 'Bullish') || (d < 0 && t.bias === 'Bearish'), opp = keOpp(t, d);
  if (!al && opp) return ke(-1, '4H bias and structure both oppose (' + t.bias + ', ' + t.structure + ')', '4H trend and structure oppose the trade');
  if (al && !opp) return ke(1, '4H ' + t.bias.toLowerCase() + ', structure ' + t.structure);
  return ke(al ? 0.3 : -0.6, '4H mixed (' + t.bias + ', ' + t.structure + ')');
});
keRule('t1d', 'trend', 'Daily trend agrees', 2, function(c){
  if (!c.k1d || c.k1d.length < 12) return ke(null);
  const t = zvTrend(c.k1d, 10), d = c.dir, al = (d > 0 && t.bias === 'Bullish') || (d < 0 && t.bias === 'Bearish'), opp = keOpp(t, d);
  if (!al && opp) return ke(-1, 'Daily bias and structure oppose', 'Daily trend and structure oppose the trade');
  return ke(al ? 1 : -0.6, 'Daily ' + t.bias.toLowerCase() + ', structure ' + t.structure);
});
keRule('wk', 'trend', 'Weekly bias agrees', 1, function(c){
  const k = c.k1w; if (!k || k.length < 3) return ke(null);
  const p = k[k.length - 2], mid = (+p[2] + +p[3]) / 2, above = c.px > mid;
  return ke((c.dir > 0) === above ? 1 : -1, 'Price ' + (above ? 'above' : 'below') + ' last week\'s midpoint');
});
keRule('reg', 'trend', 'Market regime fits', 1.5, function(c){
  const cl = c.k1h.map(function(x){ return +x[4]; }), er = keEff(cl, 20), slope = (cl[cl.length - 1] - cl[cl.length - 6]) * c.dir;
  if (er < 0.12) return ke(-1, 'Choppy market (efficiency ' + er.toFixed(2) + ')');
  if (er >= 0.3 && slope > 0) return ke(1, 'Trending with the trade (efficiency ' + er.toFixed(2) + ')');
  return ke(0, 'Mixed regime (efficiency ' + er.toFixed(2) + ')');
});
/* MOMENTUM AND VOLUME */
keRule('rsi', 'mom', 'RSI not stretched against the trade', 1, function(c){
  const r = keRsi(c.k1h.map(function(x){ return +x[4]; }), 14);
  if (c.dir > 0 && r > 75) return ke(-1, 'RSI ' + r.toFixed(0) + ' overbought: chasing');
  if (c.dir < 0 && r < 25) return ke(-1, 'RSI ' + r.toFixed(0) + ' oversold: chasing');
  return ke(r >= 35 && r <= 65 ? 1 : 0, 'RSI ' + r.toFixed(0));
});
keRule('ext', 'mom', 'Not extended from value', 1.5, function(c){
  const cl = c.k1h.map(function(x){ return +x[4]; }), e = keEma(cl.slice(-80), 20), atr = keAtr(c.k1h, 14);
  if (!atr) return ke(null);
  const dist = c.dir * (c.px - e) / atr;
  if (dist > 2.5) return ke(-1, 'Price is ' + dist.toFixed(1) + ' ATR beyond the 1H EMA20: extended');
  return ke(dist < 1 ? 1 : 0, 'Distance from 1H EMA20: ' + dist.toFixed(1) + ' ATR');
});
keRule('chase', 'mom', 'Not chasing the 24h move', 1, function(c){
  let ch = null;
  if (c.tick && c.tick.priceChangePercent != null) ch = +c.tick.priceChangePercent;
  else if (c.k1h.length > 25) ch = (c.px - +c.k1h[c.k1h.length - 25][4]) / +c.k1h[c.k1h.length - 25][4] * 100;
  if (ch == null) return ke(null);
  const v = ch * c.dir;
  if (v > 12) return ke(-1, 'Already moved ' + v.toFixed(1) + '% in the trade direction over 24h');
  return ke(v < 6 ? 1 : 0, '24h move ' + ch.toFixed(1) + '%');
});
keRule('vol', 'mom', 'Volume participation', 1, function(c){
  const v = c.k1h.map(function(x){ return +x[5]; }); if (v.length < 30) return ke(null);
  const rec = v.slice(-4).reduce(function(a, b){ return a + b; }, 0) / 4, base = v.slice(-48, -4), avg = base.reduce(function(a, b){ return a + b; }, 0) / Math.max(1, base.length), r = avg ? rec / avg : 1;
  return ke(r >= 0.9 ? 1 : (r < 0.5 ? -1 : 0), 'Recent volume ' + r.toFixed(2) + 'x its average');
});
keRule('liq24', 'mom', 'Liquid enough to trade', 1, function(c){
  if (!c.tick || c.tick.quoteVolume == null) return ke(null);
  const q = +c.tick.quoteVolume;
  if (q < 5e6) return ke(-1, '24h volume only ' + zvUsd(q), '24h volume under $5M: too illiquid');
  return ke(q >= 5e7 ? 1 : (q < 1.5e7 ? -1 : 0), '24h volume ' + zvUsd(q));

/* SMART MONEY STRUCTURE */
keRule('sess', 'smc', 'London or New York session', 1.5, function(c){
  const k = c.kz && c.kz.key;
  if (['london', 'ny-am', 'ny-pm'].indexOf(k) >= 0) return ke(1, 'Session: ' + c.kz.label);
  return ke(-1, 'Session: ' + (c.kz ? c.kz.label : 'unknown') + ' (thinner liquidity)');

keRule('loc', 'smc', 'Discount for longs, premium for shorts', 2, function(c){
  const hi = c.sc.lastSwingHigh, lo = c.sc.lastSwingLow; if (!(hi > lo)) return ke(null);
  const pos = (c.px - lo) / (hi - lo);
  if (pos < -0.1 || pos > 1.1) return ke(0, 'Price is outside the last leg');
  return ke((c.dir > 0 ? pos <= 0.5 : pos >= 0.5) ? 1 : -1, 'Price at ' + Math.round(pos * 100) + '% of the last leg (' + (pos <= 0.5 ? 'discount' : 'premium') + ')');
});
keRule('zone', 'smc', 'Inside an entry zone (FVG, OTE, breaker)', 2, function(c){
  const z = keZone(c); return z.length ? ke(1, 'Inside: ' + z.join(', ')) : ke(-1, 'Not inside a valid entry zone yet');
});
keRule('trig', 'smc', 'Trigger: sweep, displacement or structure shift', 2, function(c){
  const sc = c.sc, sw = c.liq && c.liq.sweep, parts = [];
  if (sw && sw.ago <= 4 && ((c.dir > 0 && sw.dir === 'bull') || (c.dir < 0 && sw.dir === 'bear'))) parts.push('sweep');
  if (sc.displacementDirection === (c.dir > 0 ? 'Bullish' : 'Bearish')) parts.push('displacement');
  if (sc.structure === (c.dir > 0 ? 'MSS-Bullish-Break' : 'MSS-Bearish-Break')) parts.push('structure shift');
  return parts.length ? ke(1, 'Trigger present: ' + parts.join(', ')) : ke(-1, 'No sweep, displacement or structure shift yet');
});
keRule('sweep', 'smc', 'Liquidity sweep supports the trade', 1.5, function(c){
  const sw = c.liq && c.liq.sweep; if (!sw) return ke(0, 'No fresh sweep of a major level');
  return ke(((c.dir > 0 && sw.dir === 'bull') || (c.dir < 0 && sw.dir === 'bear')) ? 1 : -1, sw.text + ' (' + sw.ago + 'h ago)');
});
keRule('dpd', 'smc', 'Daily range location', 1, function(c){
  const k = c.k1d; if (!k || k.length < 2) return ke(null);
  const y = k[k.length - 2], below = c.px < (+y[2] + +y[3]) / 2;
  return ke((c.dir > 0) === below ? 1 : -1, 'Price ' + (below ? 'below' : 'above') + ' yesterday\'s midpoint');
});
keRule('mag', 'smc', 'Liquidity magnet in trade direction', 1, function(c){
  const m = c.liq && c.liq.magnet; if (!m) return ke(0, 'No dominant liquidity pool');
  const ok = (c.dir > 0 && m.side === 'BSL') || (c.dir < 0 && m.side === 'SSL');
  return ke(ok ? 1 : -1, (ok ? 'Strongest pool ahead: ' : 'Strongest pool behind: ') + m.label);
});
keRule('room', 'smc', 'Room to the next liquidity', 2, function(c){
  const p = c.plan; if (!p || !c.liq) return ke(null);
  const risk = Math.abs(p.entry - p.stop); if (!(risk > 0)) return ke(null);
  const ahead = c.liq.levels.filter(function(l){ return l.strength >= 2 && (c.dir > 0 ? l.price > p.entry : l.price < p.entry); }).sort(function(a, b){ return c.dir > 0 ? a.price - b.price : b.price - a.price; });
  const wall = ahead.find(function(l){ return l.strength >= 3 && Math.abs(l.price - p.entry) < risk; });
  if (wall) return ke(-1, 'Major liquidity (' + wall.label + ') within 1R', 'Less than 1R of room before major liquidity (' + wall.label + ')');
  if (!ahead.length) return ke(1, 'Open path ahead');
  const r = Math.abs(ahead[0].price - p.entry) / risk;
  return ke(r >= 1.2 ? 1 : -1, 'Nearest pool ' + r.toFixed(1) + 'R away (' + ahead[0].label + ')');
});
keRule('hunt', 'smc', 'Stop is not sitting on a liquidity pool', 2, function(c){
  const p = c.plan; if (!p || !c.liq) return ke(null);
  const risk = Math.abs(p.entry - p.stop); if (!(risk > 0)) return ke(null);
  const h = c.liq.levels.filter(function(l){ return l.strength >= 2; }).find(function(l){ return c.dir > 0 ? (l.price < p.stop && p.stop - l.price <= risk * 0.25) : (l.price > p.stop && l.price - p.stop <= risk * 0.25); });
  if (h) return ke(-1, 'Stop sits just beyond ' + h.label, 'Stop sits just beyond a liquidity pool (' + h.label + ' at ' + fmtPrice(h.price) + ') that is likely to be swept first');
  return ke(1, 'Stop is clear of nearby pools');
});
keRule('conf', 'smc', 'Several zones overlap', 1, function(c){
  const z = keZone(c), cl = c.k1h.map(function(x){ return +x[4]; }), e = keEma(cl.slice(-80), 20), atr = keAtr(c.k1h, 14);
  if (atr && Math.abs(c.px - e) < atr * 0.6) z.push('EMA20');
  return ke(z.length >= 2 ? 1 : 0, z.length ? 'Zones: ' + z.join(' + ') : 'No overlapping zones');

/* DERIVATIVES POSITIONING */

  if ((c.dir > 0 && f < -0.0002) || (c.dir < 0 && f > 0.0002)) return ke(1, 'Funding ' + pct + ': the crowd is on the other side');
  return ke(0, 'Funding ' + pct + ' neutral');

/* ---------- trained weights ---------- */
function keMult(id){
  const k = ZV.ke, h = k.hist.rules[id] || { pn:0, pw:0 }, l = k.live.rules[id] || { pn:0, pw:0 };
  const n = h.pn + 3 * l.pn, w = h.pw + 3 * l.pw; if (n < 15) return 1;
  const bn = k.hist.base.n + 3 * k.live.base.n, bw = k.hist.base.w + 3 * k.live.base.w, base = bn ? bw / bn : 0.4;
  return Math.max(0.25, Math.min(1.8, 1 + 3 * ((w + 2) / (n + 4) - base) * Math.min(1, n / 60)));
}
function keMin(){ return ZV.ke.minScore || 65; }

/* ---------- evaluation ---------- */
function keEval(c){
  const items = [], vetoes = []; let num = 0, den = 0, tw = 0, ew = 0;
  KE_RULES.forEach(function(r){
    let o; try { o = r.fn(c); } catch (e) { o = ke(null, 'n/a'); }
    const m = c.noTrain ? 1 : keMult(r.id); tw += r.w;
    if (o.s != null) { ew += r.w; den += r.w * m; num += r.w * m * o.s; }
    if (o.veto) vetoes.push(o.veto);

function zvPendingTick(){
  const now = Date.now();

    if (e.status !== 'pending' || !e.limit) return;
    const md = e.pair && state.marketData[e.pair], px = md && md.price; if (!px) return;
    const long = e.signal === 'LONG';
    if (long ? px <= e.entryPrice : px >= e.entryPrice) {

      appendEvent(e, 'ENTRY_FILLED', 'Limit filled @ ' + fmtPrice(e.entryPrice), 'Price touched the zone');
      appendEvent(e, 'TRADE_ACTIVE', 'SL ' + fmtPrice(e.stopLoss) + ' | TP1 ' + fmtPrice(e.tp1) + ' | TP2 ' + fmtPrice(e.tp2), 'Monitoring active');
      zvPing('Limit filled: ' + e.symbol + ' ' + e.signal, 'Entry ' + fmtPrice(e.entryPrice) + ', stop ' + fmtPrice(e.stopLoss));
    } else if (long ? px >= e.tp1 : px <= e.tp1) {

}

    else if (state.tab === 'market') renderMarketAnalysis();
  }, 5000); // keep live tabs fresh without a full re-render every second
  setInterval(function(){ if (state.tab === 'market') refreshMicrostructure().then(function(){ if (state.tab==='market') renderMarketAnalysis(); }); }, 15000); // order book / funding / OI refresh — only while the Market tab is open, to avoid unnecessary calls
  if (state.autoAnalyze) runAutoAnalyzeCycle(); // kick off immediately rather than waiting REFRESH_MS for the first sweep
  setInterval(function(){ if (state.autoAnalyze) runAutoAnalyzeCycle(); }, REFRESH_MS);
  setInterval(autoTrackJournalOutcomes, REFRESH_MS); // checks open trades against live price every cycle
  setInterval(pruneJournalToRetention, 6 * 60 * 60 * 1000); // re-check 3-month retention every 6 hours
  state.lastRefreshAt = binanceNow().toISOString();
  updateLastRefreshChip();
  setInterval(function(){ state.lastRefreshAt = binanceNow().toISOString(); updateLastRefreshChip(); }, REFRESH_MS);
}

try {
  boot();
} catch (e) {
  showBootError('Boot error: ' + e.message);
  console.error(e);
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('SW registration failed', e); }); });
}
</script>
<script>
/* Keep-awake: holds a screen wake lock while ZENVRA is open and visible so the
   scanner keeps running. Re-acquires after you switch apps and come back. */
(function(){
  var lock = null, announced = false;
  function acquire(){
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || lock) return;
    navigator.wakeLock.request('screen').then(function(l){
      lock = l;
      l.addEventListener('release', function(){ lock = null; });
      if (!announced) { announced = true; try { showToast('Screen stay-awake on: scanner keeps running while the app is open'); } catch (e) {} }
    }).catch(function(e){ console.warn('Wake lock failed', e); });
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') acquire(); });
  ['click','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev, acquire, { passive: true }); });
  window.addEventListener('load', acquire);
})();
</script>
