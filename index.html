  if (!state.coinUniverseLoaded) {
    tc.innerHTML = '<div class="empty-state"><div class="spinner" style="margin:0 auto 10px"></div>Loading ZENVRA…</div>';
    return;
  }
  const btc = state.marketData['BTCUSDT'] || {};
  if (!btc.klines && !zvhBtcFetching) {
    zvhBtcFetching = true;
    fetchKlinesFor('BTCUSDT').then(function(){ if (state.tab === 'home') renderHome(); }).catch(function(){}).then(function(){ setTimeout(function(){ zvhBtcFetching = false; }, 20000); });
  }
  const J = state.journal || [];
  const open = J.filter(function(e){ return e.status === 'active' || e.status === 'pending'; })
    .sort(function(a,b){ return new Date(b.loggedAt) - new Date(a.loggedAt); });
  const closed = J.filter(function(e){ return e.status === 'closed' && e.exitPrice != null; })
    .sort(function(a,b){ return new Date(b.closedAt||0) - new Date(a.closedAt||0); });
  const pl = function(e){ return calcPL(e, e.exitPrice); };
  const wins = closed.filter(function(e){ return pl(e) > 0; }).length;
  const total = closed.reduce(function(s,e){ return s + pl(e); }, 0);
  const nowD = binanceNow();
  const sod = Date.UTC(nowD.getUTCFullYear(), nowD.getUTCMonth(), nowD.getUTCDate());
  const today = closed.filter(function(e){ return e.closedAt && new Date(e.closedAt).getTime() >= sod; })
    .reduce(function(s,e){ return s + pl(e); }, 0);
  const wr = closed.length ? wins / closed.length : 0;

  // Top banner: most recent closed trade
  let banner;
  if (closed.length) {
    const L = closed[0], v = pl(L), win = v > 0;
    banner = '<div class="zvh-banner"><div class="zvh-badge">' + zvhEsc(String(L.symbol).charAt(0)) + '</div>' +
      '<div class="zvh-b-mid"><div class="zvh-b-tag ' + (win?'':'loss') + '">' + (win?'TAKE PROFIT':'STOP LOSS') + '</div>' +
      '<div class="zvh-b-title">' + zvhEsc(L.symbol) + ' ' + zvhEsc(L.signal) + '</div>' +
      '<div class="zvh-b-sub">' + fmtPrice(L.entryPrice) + ' → ' + fmtPrice(L.exitPrice) + '</div></div>' +
      '<div class="zvh-b-r"><div class="zvh-b-val ' + (win?'':'loss') + '">' + zvhPct(v) + '</div><span class="zvh-b-chip">SETTLED</span></div></div>';
  } else {
    banner = '<div class="zvh-banner"><div class="zvh-badge">Z</div><div class="zvh-b-mid"><div class="zvh-b-tag">SCANNER LIVE</div>' +
      '<div class="zvh-b-title">No closed trades yet</div><div class="zvh-b-sub">' + open.length + ' open · waiting for TP / SL</div></div></div>';
  }

  // Progress ring = win rate
  const R = 96, C = 2 * Math.PI * R;
  const ring = '<div class="zvh-ringwrap"><svg viewBox="0 0 240 240">' +
    '<defs><linearGradient id="zvhg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>' +
    '<circle cx="120" cy="120" r="'+R+'" fill="rgba(255,255,255,.55)" stroke="#e3e6f3" stroke-width="12"/>' +
    '<circle cx="120" cy="120" r="'+R+'" fill="none" stroke="url(#zvhg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(wr*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 120 120)"/>' +
    '</svg><div class="zvh-ringc"><div class="lab">TOTAL P/L</div>' +
    '<div class="big ' + (total>=0?'up':'dn') + '">' + (closed.length ? zvhPct(total) : '0.00%') + '</div>' +
    '<div class="sub ' + (today>=0?'up':'dn') + '">' + zvhPct(today) + ' today</div>' +
    '<div class="foot">' + (closed.length ? Math.round(wr*100) + '% win rate · ' + wins + 'W ' + (closed.length-wins) + 'L' : 'win rate appears after first close') + '</div></div></div>';

  // BTC card
  const chg = btc.changePct;
  const btcCard = '<div class="zvh-card"><div class="zvh-btc-h"><div class="zvh-btc-n"><span class="zvh-btc-i">₿</span>BTC / USDT</div>' +
    '<div><div class="zvh-btc-p">' + (btc.price ? fmtPrice(btc.price) : '-') + '</div><div class="zvh-btc-c ' + (chg>=0?'up':'dn') + '">' + (chg!=null?zvhPct(chg)+' 24h':'') + '</div></div></div>' +
    zvhCandles(btc.klines) + '</div>';

  // Open positions stack (tap a back card to bring it forward)
  const stack = open.slice(0, 3);
  let stackHTML;
  if (!stack.length) {
    stackHTML = '<div class="zvh-card zvh-none">No open positions right now.<br>The scanner is watching the market.</div>';
  } else {
    let front = Math.min(state.zvhFront || 0, stack.length - 1); if (front < 0) front = 0;
    const order = [];
    stack.forEach(function(_, i){ if (i !== front) order.push(i); });
    order.push(front);
    stackHTML = '<div class="zvh-stack">' + order.map(function(i){
      const e = stack[i], px = zvhNow(e), upl = px != null ? calcPL(e, px) : null, isF = i === front;
      const head = '<div class="zvh-pos-h"><div><span class="zvh-pos-n">' + zvhEsc(e.symbol) + '</span><span class="zvh-pill ' + (e.signal==='SHORT'?'s':'') + '">' + zvhEsc(e.signal) + '</span></div>' +
        '<div class="zvh-pl ' + (upl!=null && upl>=0 ? 'up':'dn') + '">' + zvhPct(upl) + '</div></div>';
      const body = isF ? '<div class="zvh-grid"><div>ENTRY<span>' + fmtPrice(e.entryPrice) + '</span></div><div>NOW<span>' + (px!=null?fmtPrice(px):'-') + '</span></div>' +
        '<div>STOP<span>' + fmtPrice(e.stopLoss) + '</span></div><div>TP1<span>' + fmtPrice(e.tp1) + '</span></div></div>' : '';
      return '<div class="zvh-pos t' + (i%3) + (isF?' front':'') + '" data-zvh="' + i + '">' + head + body + '</div>';
    }).join('') + '</div>';
  }

  // Recent closed
  const recent = closed.slice(0, 3).map(function(e){
    const v = pl(e);
    return '<div class="zvh-crow"><span><b>' + zvhEsc(e.symbol) + '</b> ' + zvhEsc(e.signal) + '</span><span class="mono ' + (v>=0?'up':'dn') + '" style="font-weight:700">' + zvhPct(v) + '</span></div>';
  }).join('');

  tc.innerHTML = '<div class="zvh">' + banner + ring + btcCard +
    '<div class="zvh-sec"><span>OPEN POSITIONS</span><span>' + open.length + ' live · ' + closed.length + ' closed</span></div>' + stackHTML +
    (recent ? '<div class="zvh-sec"><span>RECENTLY CLOSED</span><b data-zvhgo="journal">See all</b></div><div class="zvh-card">' + recent + '</div>' : '') +
    '<div class="zvh-note">P/L figures are price moves per trade from your own journal (not account returns, leverage not applied). Analysis tool only, not financial advice. Leveraged trading can lose more than you put in.</div></div>';

  tc.querySelectorAll('[data-zvh]').forEach(function(el){
    el.addEventListener('click', function(){ state.zvhFront = +el.getAttribute('data-zvh'); renderHome(); });
  });
  tc.querySelectorAll('[data-zvhgo]').forEach(function(el){
    el.addEventListener('click', function(){ state.tab = el.getAttribute('data-zvhgo'); render(); });
  });
}

async function boot(){
  ensureShell();
  render(); // shows the dashboard's empty/loading state briefly while the coin universe loads
  syncBinanceServerTime(); // don't block boot on this — journal timestamps fall back to local clock until it resolves
  setInterval(syncBinanceServerTime, 10 * 60 * 1000); // re-sync periodically to correct for clock drift
  await loadCoinUniverse(); // must resolve before anything that reads COINS
  render();
  await fetchAllMarketData(); // wait for prices to exist before the sweep tries to analyze anything
  setInterval(fetchAllMarketData, REFRESH_MS);
  connectWS();
  /* Gold was previously analysis-on-demand only (manual button click),
     meaning its signal could sit stale indefinitely between clicks —
     the same "fires an already-moved signal" problem just fixed for
     crypto, just more severe since nothing forced a re-check at all.
     Now it re-analyzes automatically right after each fresh poll.
     IMPORTANT: chained inside ONE interval, not two independent timers
     — pollGold() is async (awaits a network fetch), so a separate timer
     firing analyzeGold() on the same REFRESH_MS cadence has no
     guarantee it runs AFTER that cycle's poll actually resolves; it
     could just as easily fire first and analyze against the previous
     cycle's stale price, quietly reintroducing the same staleness bug
     in a new place. Awaiting pollGold() before calling analyzeGold()
     guarantees the analysis always sees this cycle's freshly-polled
     price, not a leftover one. */
  async function goldPollAndAnalyzeCycle(){
    await pollGold();
    if (state.autoAnalyze && !state.gold.weekendClosed && state.gold.price) await analyzeGold();
  }
  goldPollAndAnalyzeCycle();
  setInterval(goldPollAndAnalyzeCycle, REFRESH_MS);
  setInterval(function(){ renderRibbon(); }, 1000);
  renderTerminalTicker();
  setInterval(renderTerminalTicker, 5000); // slower than the ribbon clock so the marquee CSS animation isn't restarted every second
  setInterval(function(){
    if (state.tab === 'home') renderHome();
    else if (state.tab === 'dashboard') renderDashboard();
    else if (state.tab === 'signals') renderSignalsTab();
    else if (state.tab === 'scanner') renderScannerTab();
    else if (state.tab === 'market') renderMarketAnalysis();
  }, 5000); // keep live tabs fresh without a full re-render every second
  setInterval(function(){ if (state.tab === 'market') refreshMicrostructure().then(function(){ if (state.tab==='market') renderMarketAnalysis(); }); }, 15000); // order book / funding / OI refresh — only while the Market tab is open, to avoid unnecessary calls
  if (state.autoAnalyze) runAutoAnalyzeCycle(); // kick off immediately rather than waiting REFRESH_MS for the first sweep
  setInterval(function(){ if (state.autoAnalyze) runAutoAnalyzeCycle(); }, REFRESH_MS);
  setInterval(autoTrackJournalOutcomes, REFRESH_MS); // checks open trades against live price every cycle
  setInterval(pruneJournalToRetention, 6 * 60 * 60 * 1000); // re-check 3-month retention every 6 hours
  state.lastRefreshAt = binanceNow().toISOString();
  updateLastRefreshChip();
  setInterval(function(){ state.lastRefreshAt = binanceNow().toISOString(); updateLastRefreshChip(); }, REFRESH_MS);
}

try {
  boot();
} catch (e) {
  showBootError('Boot error: ' + e.message);
  console.error(e);
}
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('SW registration failed', e); }); });
}

<script>
/* Keep-awake: holds a screen wake lock while ZENVRA is open and visible so the
   scanner keeps running. Re-acquires after you switch apps and come back. */
(function(){
  var lock = null, announced = false;
  function acquire(){
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || lock) return;
    navigator.wakeLock.request('screen').then(function(l){
      lock = l;
      l.addEventListener('release', function(){ lock = null; });
      if (!announced) { announced = true; try { showToast('Screen stay-awake on: scanner keeps running while the app is open'); } catch (e) {} }
    }).catch(function(e){ console.warn('Wake lock failed', e); });
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') acquire(); });
  ['click','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev, acquire, { passive: true }); });
  window.addEventListener('load', acquire);
})();
</script>
